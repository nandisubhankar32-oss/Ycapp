<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>YourChoice</title>
<style>
:root{
  --bg:#f5f5f5; --card:#ffffff; --text:#1a1a1a; --accent:#0288d1; --accent2:#d32f2f;
  --muted:#757575; --border:#e0e0e0; --success:#388e3c; --warning:#f57c00;
}
[data-theme="dark"] {
  --bg:#121212; --card:#1e1e1e; --text:#f5f5f5; --border:#333333; --muted:#aaaaaa;
}
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none;}
body{ font-family:'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--text); transition:background 0.3s,color 0.3s; overflow-x:hidden; }
.allow-copy, .allow-copy *, #chatBox, #chatBox *, .literature-text, .literature-text *, .copyable, input, textarea, select { user-select:text !important;-webkit-user-select:text !important; }
.container{max-width:600px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);position: relative;}

.profile-info{display:flex;align-items:center;gap:10px;font-size:14px;flex-wrap:wrap;}

.profile-info .status-tag.co{background:var(--warning);}
.network-dot{ width:10px;height:10px;border-radius:50%; background:#4caf50;display:inline-block;}
.network-dot.offline{background:#f44336}
.notice-ticker{ background:var(--accent2); color:#fff; padding:6px 12px; font-size:13px; white-space:nowrap; overflow:hidden; border-radius:6px; }

@keyframes scroll{to{transform:translateX(-100%)}}
.main-content{flex:1;padding:16px;padding-bottom:100px}
.nav-grid{ display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px }
.nav-btn{ background:var(--card); border:1px solid var(--border); border-radius:12px; padding:20px 10px; text-align:center; cursor:pointer; position:relative; }
.nav-btn:active{transform:scale(0.95)}
.nav-btn .icon{font-size:28px;margin-bottom:6px}
.nav-btn .label{font-size:12px;font-weight:500;}
.screen{display:none} .screen.active{display:block}
.card{ background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:12px; position: relative; }
.btn{ background:var(--accent); color:#fff; border:none; padding:12px 20px; border-radius:8px; font-size:14px; cursor:pointer; width:100%; margin-top:8px; font-weight: 500; }
.btn-secondary{background:var(--muted)} .btn-danger{background:var(--accent2)} .btn-warning{background:var(--warning)} .btn-success{background:var(--success)}
.input{ width:100%;padding:12px; background:var(--card); border:1px solid var(--border); border-radius:8px; color:var(--text); font-size:14px; margin-top:8px; }
.bottom-nav{ position:fixed;bottom:0;left:0;right:0; background:var(--card); border-top:1px solid var(--border); display:flex;justify-content:space-around; padding:8px 0; max-width: 600px; margin: 0 auto; z-index: 99; }
.bottom-nav-btn{ background:none;border:none;color:var(--muted); font-size:12px;cursor:pointer;padding:4px 8px; font-weight: 500; }
.bottom-nav-btn.active{color:var(--accent)}
.bluelight-filter{ position:fixed;top:0;left:0;right:0;bottom:0; background:rgba(255,235,59,0.15); mix-blend-mode:multiply; pointer-events:none; z-index:999; display:none; }
.brightness-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0); pointer-events: none; z-index: 9998; }
.switch-link{ display:block;text-align:center;margin-top:15px;color:var(--accent); font-size:13px;text-decoration:underline;cursor:pointer; }
.form-builder-row{ display:flex;align-items:center;gap:10px;margin-top:8px; }
.flex-actions { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap;}
.flex-actions .btn { margin-top:0; padding:8px 12px; font-size:12px; width:auto; flex:1; text-align:center;}
.delete-inline-btn { position: absolute; top: 10px; right: 10px; background: var(--accent2); color: #fff; border: none; border-radius: 4px; padding: 4px 8px; font-size: 11px; cursor: pointer; z-index: 5; }
.battle-q-card { border-left: 4px solid var(--accent2); padding: 10px; margin-bottom: 10px; background: var(--bg); border-radius: 6px; }

/* Notification Dots */
.dot-red { position:absolute; top:-4px; right:-4px; width:12px; height:12px; background:red; border-radius:50%; border:2px solid #fff; display:none; }
.dot-green { width:10px; height:10px; background:#4caf50; border-radius:50%; display:inline-block; margin-left:5px; }

</style>

const firebaseConfig = {
  apiKey: "AIzaSyDbFaMS-WtEYho-rUG1b1YNnfcE44u3VXI",
  authDomain: "your-choice-4b2aa.firebaseapp.com",

};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let currentUser = null;
let lastSeenData = {}; 

function $(id){return document.getElementById(id)}
window.$ = $;
function toast(msg){
  let t = document.createElement('div'); t.textContent = msg;
  t.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:10px 20px;border-radius:8px;z-index:1000;font-size:14px;box-shadow:0 4px 6px rgba(0,0,0,0.1);';
  document.body.appendChild(t); setTimeout(()=>t.remove(),2000);
}
window.toast = toast;

// --- Notification Engine ---
function pushNotify(title, body) {
  if (currentUser?.muted) return;
  if (!("Notification" in window)) return;
  if (Notification.permission === "granted") { new Notification(title, { body }); }
  else if (Notification.permission !== "denied") {
    Notification.requestPermission().then(p => { if (p === "granted") new Notification(title, { body }); });
  }
}

function updateLastSeen(section) {
  if(!currentUser) return;
  lastSeenData[section] = Date.now();
  update(ref(db, `users/${currentUser.serial}/lastSeen/${section}`), Date.now());
}

// --- Smart Text Evaluator ---
function getLevenshteinDistance(a, b) {
  if(!a.length) return b.length; if(!b.length) return a.length;
  const matrix = []; for(let i=0; i<=b.length; i++){matrix[i]=[i];}
  for(let j=0; j<=a.length; j++){matrix[0][j]=j;}
  for(let i=1; i<=b.length; i++){
    for(let j=1; j<=a.length; j++){
      if(b.charAt(i-1)===a.charAt(j-1)) matrix[i][j] = matrix[i-1][j-1];
      else matrix[i][j] = Math.min(matrix[i-1][j-1]+1, Math.min(matrix[i][j-1]+1, matrix[i-1][j]+1));
    }
  } return matrix[b.length][a.length];
}
function checkAnswerSmart(u, c) {
  if (!u || !c) return false;
  let strU = u.toLowerCase().trim().replace(/[\s.,\/#!$%\^&\*;:{}=\-_`~()]/g,"");
  let strC = c.toLowerCase().trim().replace(/[\s.,\/#!$%\^&\*;:{}=\-_`~()]/g,"");
  if (strU === strC) return true;
  let maxLen = Math.max(strU.length, strC.length); if (maxLen === 0) return false;
  return ((maxLen - getLevenshteinDistance(strU, strC)) / maxLen) >= 0.78; 
}

// --- Chat Log Auto Expiry (Rule: Others 1) ---
async function runAutoExpiryCheck(){
  const now = Date.now();
  // Standard limits
  const twentyDaysMs = 20 * 86400000;
  const hundredDaysMs = 100 * 86400000;

  // CO Chat (20 Days)
  const coSnap = await get(ref(db, 'co_messages'));
  if(coSnap.exists()){
    Object.entries(coSnap.val()).forEach(([userSerial, msgs]) => {
      Object.entries(msgs).forEach(async ([msgId, m]) => {
        if(m.time && (now - m.time) > twentyDaysMs) await remove(ref(db, `co_messages/${userSerial}/${msgId}`));
      });
    });
  }

  // General & Group Chats (100 Days)
  const chatSnap = await get(ref(db, 'chats'));
  if(chatSnap.exists()){
    Object.entries(chatSnap.val()).forEach(([cId, msgs]) => {
      Object.entries(msgs).forEach(async ([mId, m]) => {
        if(m.time && (now - m.time) > hundredDaysMs) await remove(ref(db, `chats/${cId}/${mId}`));
      });
    });
  }
  const groupChatSnap = await get(ref(db, 'group_chats'));
  if(groupChatSnap.exists()){
    Object.entries(groupChatSnap.val()).forEach(([gId, msgs]) => {
      Object.entries(msgs).forEach(async ([mId, m]) => {
        if(m.time && (now - m.time) > hundredDaysMs) await remove(ref(db, `group_chats/${gId}/${mId}`));
      });
    });
  }
}

// --- Core App Rendering ---
function applySavedSettings() {
  document.documentElement.setAttribute("data-theme", localStorage.getItem("yc_theme") || "light");
  const bVal = localStorage.getItem("yc_brightness") || "100";
  if($('brightnessLayer')) $('brightnessLayer').style.backgroundColor = `rgba(0, 0, 0, ${(100 - parseInt(bVal)) / 100 * 0.85})`;
  if($('bluelight')) $('bluelight').style.display = localStorage.getItem("yc_bluecut") === "true" ? 'block' : 'none';
}

function renderAuth(){
  $('app').innerHTML = `
    <div class="screen active">
      <div class="card" style="margin-top:60px">
        <h2 style="text-align:center;color:var(--accent);">YourChoice Login</h2>
        <input type="text" class="input" id="authSerial" placeholder="Serial No (YC_XXXXXX) or Name">
        <input type="password" class="input" id="authPass" placeholder="Password">
        <button class="btn" onclick="login()">Login / Enter</button>
      </div>
    </div>
  `;
}

window.login = async function(){
  const s = $('authSerial').value.trim(); const p = $('authPass').value.trim();
  if(!s || !p) return toast('All fields required');
  try {
    let targetSerial = s.startsWith('YC_') ? s : null;
    if(!targetSerial){
        // Find by name if serial not provided (Simplified for standard flow)
        toast('Using serial number is safer, attempting name match...');
    }
    const snap = await get(ref(db, 'users/' + (targetSerial || s)));
    if(!snap.exists()) {
       // Registration bypass for demo
       currentUser = { name: s, serial: 'YC_'+Math.floor(Math.random()*100000), password: p, score:0, isCO: s.toLowerCase() === 'admin' };
       await set(ref(db, 'users/'+currentUser.serial), currentUser);
    } else {
       currentUser = snap.val();
       if(currentUser.password !== p) return toast('Wrong password');
    }
    localStorage.setItem('yc_user', JSON.stringify(currentUser));
    syncUserAndRender();
  } catch(e) { toast('Error'); }
}

async function syncUserAndRender() {
  if(!currentUser) return renderAuth();
  onValue(ref(db, 'users/' + currentUser.serial), snap => {
    if(snap.exists()) {
      currentUser = snap.val();
      lastSeenData = currentUser.lastSeen || {};
      renderHome();
      checkGlobalIndicators();
    } else renderAuth();
  });
  applySavedSettings(); runAutoExpiryCheck();
}

window.renderHome = function(){
  const u = currentUser; if(!u) return;
  $('app').innerHTML = `
    <header>
      <div class="header-top">
        <div class="profile-info">
          <strong>${u.name}</strong> <span>S: ${u.serial}</span> <span class="score-tag">Score: ${u.score || 0}</span>
        </div>
        <span class="network-dot" id="netDot"></span>
      </div>
    </header>
    
    <div class="main-content">
      <div class="card">
        <h4 style="font-size:13px; margin-bottom:6px;">🌓 Display Settings</h4>
        <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:8px;">
          <button class="btn btn-secondary" style="padding:6px 12px; width:auto;" onclick="toggleDarkThemeLive()">Dark Mode</button>
          <button class="btn btn-warning" style="padding:6px 12px; width:auto;" onclick="toggleBlueCut()">Blue-cut</button>
          <button class="btn ${u.muted?'btn-danger':'btn-success'}" style="padding:6px 12px; width:auto;" onclick="toggleMute()">${u.muted?'Unmute':'Mute'}</button>
        </div>
        <input type="range" min="15" max="100" value="${localStorage.getItem('yc_brightness') || 100}" oninput="alterAppBrightnessLive(this.value)" style="width:100%;">
      </div>

      <div class="nav-grid">
        <div class="nav-btn" onclick="showQuest()">
          <span class="dot-red" id="dot_quest"></span><div class="icon">📚</div><div class="label">Quest</div>
        </div>
        <div class="nav-btn" onclick="showContact()">
          <span class="dot-green" id="dot_contact" style="position:absolute;top:5px;right:5px;display:none;"></span><div class="icon">👥</div><div class="label">Contact</div>
        </div>
        <div class="nav-btn" onclick="showBattle()">
          <span class="dot-red" id="dot_battle"></span><div class="icon">⚔️</div><div class="label">Live Battle</div>
        </div>
        <div class="nav-btn" onclick="showGames()">
          <span class="badge-new" id="new_games">NEW</span><div class="icon">🎮</div><div class="label">Games</div>
        </div>
        <div class="nav-btn" onclick="showTools()">
          <span class="badge-new" id="new_tools">NEW</span><div class="icon">🛠️</div><div class="label">Tools</div>
        </div>
        <div class="nav-btn" onclick="showLiterature()">
          <span class="badge-new" id="new_lit">NEW</span><div class="icon">📖</div><div class="label">Literature</div>
        </div>
      </div>
    </div>
    
    <div class="bottom-nav">
      <button class="bottom-nav-btn active" onclick="renderHome()">Home</button>
      <button class="bottom-nav-btn" onclick="showCOPanel()">CO Panel</button>
    </div>
  `;
}

// Indicator checks
function checkGlobalIndicators() {
  const checkNode = (node, uiId, type) => {
    onValue(ref(db, node), snap => {
      let hasNew = false;
      if(snap.exists()){
        let latest = 0;
        Object.values(snap.val()).forEach(item => { if(item.createdAt > latest) latest = item.createdAt; });
        if(latest > (lastSeenData[node] || 0)) { hasNew = true; pushNotify('New Content', `New item available in ${node}`); }
      }
      if($(uiId)) $(uiId).style.display = hasNew ? (type==='dot'?'block':'inline-block') : 'none';
    });
  };
  checkNode('quests', 'dot_quest', 'dot');
  checkNode('battles', 'dot_battle', 'dot');
  checkNode('custom_games', 'new_games', 'badge'); // Assuming Pak Chan Ruti goes here
  checkNode('custom_tools', 'new_tools', 'badge');
  checkNode('literature', 'new_lit', 'badge');
}

window.toggleBlueCut = function() {
  const isON = localStorage.getItem("yc_bluecut") === "true";
  localStorage.setItem("yc_bluecut", !isON);
  applySavedSettings();
}
window.alterAppBrightnessLive = function(v) { localStorage.setItem("yc_brightness", v); applySavedSettings(); }
window.toggleDarkThemeLive = function() {
  const cur = localStorage.getItem("yc_theme") === "dark" ? "light" : "dark";
  localStorage.setItem("yc_theme", cur); applySavedSettings();
}
window.toggleMute = async function() {
  await update(ref(db, 'users/'+currentUser.serial), { muted: !currentUser.muted });
  toast(!currentUser.muted ? 'Notifications Muted' : 'Notifications Active');
}

// FEATURE 1,2,3,4,5: CONTACT MODULE

window.showContact = function(){
  updateLastSeen('contact');
  $('app').innerHTML = `
    <div class="screen active">
      <header><button onclick="renderHome()" style="background:none;border:none;color:var(--accent);cursor:pointer;">← Back</button> <span>Contact</span> <button onclick="showFindFriend()" style="background:none;border:none;color:var(--accent);cursor:pointer;">+ Find</button></header>
      <div class="main-content">
        <button class="btn btn-danger" onclick="openCOChat()" style="margin-bottom:15px;">📞 Contact CO</button>
        <div class="card">
          <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
            <h3>Groups</h3> <button class="btn btn-success" style="width:auto;margin:0;padding:6px 12px;font-size:12px;" onclick="showCreateGroup()">+ New Group</button>
          </div>
          <div id="groupList">Loading...</div>
        </div>
        <div class="card"><h3>Friends List</h3><div id="friendList">Loading...</div></div>
        <div class="card"><h3>Friend Requests</h3><div id="reqList">Loading...</div></div>
      </div>
    </div>
  `;
  loadGroups(); loadFriends(); loadRequests();
}

function loadFriends(){
  onValue(ref(db, 'friends/' + currentUser.serial), async snap => {
    let arr = [];
    if(snap.exists()) {
      for(let [fid, data] of Object.entries(snap.val())) {
        const uSnap = await get(ref(db, 'users/' + fid));
        if(uSnap.exists()) arr.push({ fid, uData: uSnap.val(), nickname: data.nickname || uSnap.val().name, lastMsg: data.lastMsgTime || 0 });
      }
      arr.sort((a,b) => b.lastMsg - a.lastMsg); // Sorting newest top
    }
    let html = arr.map(f => `
      <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
        <div onclick="openFriendChat('${f.fid}', '${f.nickname}')" style="cursor:pointer; flex:1;">
          👤 <b>${f.nickname}</b> <small style="color:var(--muted)">(${f.fid})</small>
        </div>
        <button class="btn btn-secondary" style="width:auto; margin:0; padding:6px; font-size:11px;" onclick="setFriendNickname('${f.fid}','${f.nickname}')">✏️ Rename</button>
      </div>`).join('');
    if($('friendList')) $('friendList').innerHTML = html || '<div style="color:var(--muted); font-size:13px">No friends yet.</div>';
  });
}

window.setFriendNickname = async function(fid, oldName) {
  let newName = prompt("Enter custom nickname for this friend:", oldName);
  if(newName && newName.trim()) {
    await update(ref(db, `friends/${currentUser.serial}/${fid}`), { nickname: newName.trim() });
    toast('Nickname updated!');
  }
}

function loadGroups() {
  onValue(ref(db, 'groups'), snap => {
    let arr = [];
    if(snap.exists()){
      Object.entries(snap.val()).forEach(([gId, g]) => {
        if(g.members && g.members[currentUser.serial]) arr.push({ gId, ...g });
      });
      arr.sort((a,b) => (b.lastMsgTime||0) - (a.lastMsgTime||0));
    }
    let html = arr.map(g => `
      <div class="card" style="background:#f9f9f9; display:flex; justify-content:space-between; align-items:center;">
        <div onclick="openGroupChat('${g.gId}', '${g.name}')" style="cursor:pointer; flex:1;">💬 <b>${g.name}</b></div>
        ${g.members[currentUser.serial] === 'leader' ? `<button class="delete-inline-btn" style="position:static;" onclick="deleteGroup('${g.gId}')">Delete</button>` : ''}
      </div>
    `).join('');
    if($('groupList')) $('groupList').innerHTML = html || '<div style="color:var(--muted); font-size:13px">Not in any groups.</div>';
  });
}

window.deleteGroup = async function(gId) {
  if(confirm('Are you sure you want to completely delete this group?')) {
    await remove(ref(db, 'groups/' + gId));
    await remove(ref(db, 'group_chats/' + gId));
    toast('Group deleted');
  }
}

window.showCreateGroup = async function() {
  const name = prompt("Enter Group Name:");
  if(!name) return;
  const newRef = push(ref(db, 'groups'));
  let members = {}; members[currentUser.serial] = 'leader';
  await set(newRef, { name, createdAt: Date.now(), members });
  toast('Group created!'); showContact();
}

window.showFindFriend = async function() {
  $('app').innerHTML = `
    <div class="screen active">
      <header><button onclick="showContact()" style="background:none;border:none;color:var(--accent);cursor:pointer;">← Back</button><span>Find Friends</span></header>
      <div class="main-content">
        <input class="input" id="searchUserInp" placeholder="Search by name or serial..." oninput="execUserSearch()">
        <div id="searchResList" style="margin-top:15px;"></div>
      </div>
    </div>
  `;
  const snap = await get(ref(db, 'users'));
  const fSnap = await get(ref(db, 'friends/'+currentUser.serial));
  const myFriends = fSnap.exists() ? Object.keys(fSnap.val()) : [];
  window.allNonFriends = [];
  if(snap.exists()) {
    Object.entries(snap.val()).forEach(([s, u]) => {
      if(s !== currentUser.serial && !myFriends.includes(s)) window.allNonFriends.push({ s, ...u });
    });
  }
  execUserSearch();
}
window.execUserSearch = function() {
  const q = $('searchUserInp').value.toLowerCase().trim();
  let list = window.allNonFriends;
  if(q) list = list.filter(u => u.name.toLowerCase().includes(q) || u.s.toLowerCase().includes(q));
  
  $('searchResList').innerHTML = list.map(u => `
    <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
      <div><b>${u.name}</b><br><small>${u.s}</small></div>
      <button class="btn" style="width:auto; margin:0; padding:6px 12px;" onclick="sendRequest('${u.s}')">Send Req</button>
    </div>
  `).join('') || '<div class="card">No users found.</div>';
}
window.sendRequest = async function(target) {
  await set(ref(db, `requests/${target}/${currentUser.serial}`), Date.now());
  toast('Request sent!');
}

function loadRequests(){
  onValue(ref(db, 'requests/' + currentUser.serial), async snap => {
    let html = '';
    if(snap.exists()) {
      for(let [from] of Object.entries(snap.val())) {
        const uSnap = await get(ref(db, 'users/' + from));
        if(uSnap.exists()) {
          html += `<div class="card" style="display:flex; justify-content:space-between; align-items:center;">
            <div><b>${uSnap.val().name}</b></div>
            <button class="btn btn-success" style="width:auto;padding:6px 12px; margin:0;" onclick="acceptReq('${from}')">Accept</button>
          </div>`;
        }
      }
    }
    if($('reqList')) $('reqList').innerHTML = html || '<div style="color:var(--muted); font-size:13px">No requests.</div>';
  });
}
window.acceptReq = async function(from) {
  await set(ref(db, `friends/${currentUser.serial}/${from}`), { accepted: true, nickname: '' });
  await set(ref(db, `friends/${from}/${currentUser.serial}`), { accepted: true, nickname: '' });
  await remove(ref(db, `requests/${currentUser.serial}/${from}`));
  toast('Friend added!');
}

window.openFriendChat = function(fid, fName) {
  const chatId = [currentUser.serial, fid].sort().join('_');
  $('app').innerHTML = `
    <div class="screen active">
      <header><button onclick="showContact()" style="background:none;border:none;color:var(--accent);cursor:pointer;">← Back</button><span>${fName}</span></header>
      <div class="main-content" id="chatBox" style="height:calc(100vh - 160px);overflow-y:auto;"></div>
      <div class="bottom-nav" style="display:flex;gap:8px;padding:10px;">
        <input class="input" id="chatInput" style="margin:0"><button class="btn" onclick="sendFriendMsg('${chatId}','${fid}')" style="width:auto;margin:0">Send</button>
      </div>
    </div>
  `;
  onValue(ref(db, 'chats/' + chatId), snap => {
    if(snap.exists() && $('chatBox')) {
      $('chatBox').innerHTML = Object.values(snap.val()).map(m => `
        <div style="text-align:${m.from===currentUser.serial?'right':'left'};margin:8px;">
          <span style="background:${m.from===currentUser.serial?'var(--accent)':'var(--border)'}; color:${m.from===currentUser.serial?'#fff':'var(--text)'}; padding:8px 12px; border-radius:12px; display:inline-block;">${m.text}</span>
        </div>
      `).join('');
      $('chatBox').scrollTop = $('chatBox').scrollHeight;
    }
  });
}
window.sendFriendMsg = async function(chatId, fid) {
  const t = $('chatInput').value.trim(); if(!t) return;
  const now = Date.now();
  await push(ref(db, 'chats/' + chatId), { from: currentUser.serial, text: t, time: now });
  await update(ref(db, `friends/${currentUser.serial}/${fid}`), { lastMsgTime: now });
  await update(ref(db, `friends/${fid}/${currentUser.serial}`), { lastMsgTime: now });
  $('chatInput').value = '';
}

window.openGroupChat = async function(gId, gName) {
  const snap = await get(ref(db, `groups/${gId}`));
  const gData = snap.val();
  const myRole = gData.members[currentUser.serial];
  
  $('app').innerHTML = `
    <div class="screen active">
      <header>
        <button onclick="showContact()" style="background:none;border:none;color:var(--accent);cursor:pointer;">← Back</button>
        <span>${gName}</span>
        ${(myRole === 'leader' || myRole === 'co-leader') ? `<button onclick="manageGroupMembers('${gId}')" style="background:none;border:none;color:var(--accent);cursor:pointer;">⚙️ Add</button>` : '<span></span>'}
      </header>
      <div class="main-content" id="chatBox" style="height:calc(100vh - 160px);overflow-y:auto;"></div>
      <div class="bottom-nav" style="display:flex;gap:8px;padding:10px;">
        <input class="input" id="gChatInput" style="margin:0"><button class="btn btn-success" onclick="sendGroupMsg('${gId}')" style="width:auto;margin:0">Send</button>
      </div>
    </div>
  `;
  onValue(ref(db, 'group_chats/' + gId), msgs => {
    if(msgs.exists() && $('chatBox')) {
      $('chatBox').innerHTML = Object.values(msgs.val()).map(m => `
        <div style="text-align:${m.from===currentUser.serial?'right':'left'};margin:8px;">
          <small style="display:block;color:var(--muted);font-size:10px;">${m.senderName}</small>
          <span style="background:${m.from===currentUser.serial?'var(--success)':'var(--border)'}; color:${m.from===currentUser.serial?'#fff':'var(--text)'}; padding:8px 12px; border-radius:12px; display:inline-block;">${m.text}</span>
        </div>
      `).join('');
      $('chatBox').scrollTop = $('chatBox').scrollHeight;
    }
  });
}
window.sendGroupMsg = async function(gId) {
  const t = $('gChatInput').value.trim(); if(!t) return; const now = Date.now();
  await push(ref(db, 'group_chats/' + gId), { from: currentUser.serial, senderName: currentUser.name, text: t, time: now });
  await update(ref(db, `groups/${gId}`), { lastMsgTime: now });
  $('gChatInput').value = '';
}
window.manageGroupMembers = async function(gId) {
  const uId = prompt("Enter Serial Number of user to add:");
  if(uId) {
    await update(ref(db, `groups/${gId}/members`), { [uId]: 'member' });
    toast('User added to group!');
  }
}

window.openCOChat = function(){
  $('app').innerHTML = `
    <div class="screen active">
      <header><button onclick="showContact()" style="background:none;border:none;color:var(--accent);cursor:pointer;">← Back</button><span>Contact CO</span></header>
      <div class="main-content" id="chatBox" style="height:calc(100vh - 160px);overflow-y:auto;"></div>
      <div class="bottom-nav" style="display:flex;gap:8px;padding:10px;">
        <input class="input" id="coChatInp" style="margin:0"><button class="btn" onclick="sendToCO()" style="width:auto;margin:0">Send</button>
      </div>
    </div>
  `;
  onValue(ref(db, 'co_messages/' + currentUser.serial), snap => {

      $('chatBox').innerHTML = Object.values(snap.val()).map(m => `
        <div style="text-align:${m.sender===currentUser.serial?'right':'left'};margin:8px;">
          <span style="background:${m.sender===currentUser.serial?'var(--accent)':'var(--accent2)'}; color:#fff; padding:8px 12px; border-radius:12px; display:inline-block;">${m.text}</span>
        </div>
      `).join('');
      $('chatBox').scrollTop = $('chatBox').scrollHeight;
    }
  });
}
window.sendToCO = async function() {
  const t = $('coChatInp').value.trim(); if(!t) return;
  await push(ref(db, 'co_messages/' + currentUser.serial), { sender: currentUser.serial, userName: currentUser.name, text: t, time: Date.now() });
  $('coChatInp').value = '';
}

// ==========================================
// FEATURE 6: MCQ FIGHT (LIVE BATTLE)
// ==========================================
window.showBattle = function() {
  updateLastSeen('battles');
  $('app').innerHTML = `
    <div class="screen active">
      <header><button onclick="renderHome()" style="background:none;border:none;color:var(--accent);cursor:pointer;">← Back</button><span>Live Battle</span></header>
      <div class="main-content">
        <div id="battleList">Loading Battles & MCQ Fights...</div>
      </div>
    </div>
  `;
  onValue(ref(db, 'battles'), snap => {
    if(snap.exists() && $('battleList')){
      let arr = Object.entries(snap.val()).map(([id,b])=>({id,...b})).reverse(); // Newest top
      $('battleList').innerHTML = arr.map(b => {
        const remaining = b.endTimestamp - Date.now();
        if(remaining <= 0) return '';
        let h = Math.floor(remaining / 3600000), m = Math.floor((remaining%3600000)/60000), s = Math.floor((remaining%60000)/1000);
        
        if (b.type === 'mcq_fight') {
          return `
            <div class="card" style="border-top:4px solid var(--warning);">
              <h3 style="color:var(--warning)">⚡ MCQ Fight: ${b.title}</h3>
              <p style="font-size:12px;">Ends in: ${h}h ${m}m ${s}s</p>
              <button class="btn btn-warning" onclick="startMcqFight('${b.id}')">Start 15s/Q Fight</button>
            </div>
          `;
        }
      }).join('') || '<div class="card">No active battles.</div>';
    }
  });
}

window.startMcqFight = async function(bId) {
  const checkAns = await get(ref(db, `mcq_fight_submissions/${bId}/${currentUser.serial}`));
  if(checkAns.exists()) return alert('You have already completed this MCQ Fight!');

  const snap = await get(ref(db, `battles/${bId}`));
  window.currentFight = snap.val();
  window.currentFight.bId = bId;
  window.fightScore = 0;
  window.fightIdx = 0;
  renderNextMcqFightQ();
}

window.renderNextMcqFightQ = async function() {
  let b = window.currentFight;
  if(window.fightIdx >= b.questions.length) {
    // Finish
    await set(ref(db, `mcq_fight_submissions/${b.bId}/${currentUser.serial}`), { score: window.fightScore, time: Date.now() });
    await update(ref(db, `users/${currentUser.serial}`), { score: (currentUser.score || 0) + window.fightScore });
    alert(`Fight Over! You scored ${window.fightScore} points.`);
    return showBattle();
  }

  let q = b.questions[window.fightIdx];
  $('app').innerHTML = `
    <div class="screen active">
      <header><span style="color:var(--accent2); font-weight:bold;">⚡ Question ${window.fightIdx+1} / ${b.questions.length}</span></header>
      <div class="main-content">
        <h1 style="text-align:center; font-size:40px; color:var(--accent2);" id="fightTimer">15</h1>
        <div class="card" style="margin-top:20px;">
          <h3>${q.q}</h3>
          <button class="btn btn-secondary" onclick="submitFightAns('${q.o1}')">${q.o1}</button>
          <button class="btn btn-secondary" onclick="submitFightAns('${q.o2}')">${q.o2}</button>
          <button class="btn btn-secondary" onclick="submitFightAns('${q.o3}')">${q.o3}</button>
          <button class="btn btn-secondary" onclick="submitFightAns('${q.o4}')">${q.o4}</button>
        </div>
      </div>
    </div>
  `;

  let t = 15;
  window.fightInterval = setInterval(() => {
    t--; 
    if($('fightTimer')) $('fightTimer').textContent = t;
    if(t <= 0) {
      clearInterval(window.fightInterval);
      window.fightIdx++; renderNextMcqFightQ(); // Auto skip/fail
    }
  }, 1000);
}

window.submitFightAns = function(ans) {
  clearInterval(window.fightInterval);
  let q = window.currentFight.questions[window.fightIdx];
  if(ans.trim().toLowerCase() === q.a.trim().toLowerCase()) { window.fightScore += 10; toast('Correct! +10'); }
  else { window.fightScore -= 5; toast('Wrong! -5'); }
  window.fightIdx++;
  renderNextMcqFightQ();
}

// ==========================================
// GENERIC SECTIONS & CO PANEL UPDATES
// ==========================================
window.showQuest = function(){ renderGenericFeed('quests', 'Quest Board'); }
window.showGames = function(){ renderGenericFeed('custom_games', 'Games'); }
window.showTools = function(){ renderGenericFeed('custom_tools', 'Tools'); }
window.showLiterature = function(){ renderGenericFeed('literature', 'Literature'); }

function renderGenericFeed(node, title) {
  updateLastSeen(node);
  $('app').innerHTML = `<div class="screen active"><header><button onclick="renderHome()" style="background:none;border:none;color:var(--accent);cursor:pointer;">← Back</button><span>${title}</span></header><div class="main-content" id="feedList">Loading...</div></div>`;
  onValue(ref(db, node), snap => {
    if(snap.exists() && $('feedList')){
      // Sorting newest to top globally (Rule: Others 5)
      let arr = Object.entries(snap.val()).map(([id, d])=>({id,...d})).sort((a,b)=>b.createdAt - a.createdAt);
      $('feedList').innerHTML = arr.map(i => `
        <div class="card">
          <h3>${i.title || i.question || i.name || 'Item'}</h3>
          <p>${i.desc || i.type || ''}</p>
        </div>
      `).join('');
    } else if($('feedList')) { $('feedList').innerHTML = '<div class="card">No items found.</div>'; }
  });
}

window.showCOPanel = function() {
  if(!currentUser.isCO) return toast('Access Denied');
  $('app').innerHTML = `
    <div class="screen active">
      <header><button onclick="renderHome()" style="background:none;border:none;color:var(--accent);cursor:pointer;">← Back</button><span>CO Panel</span></header>
      <div class="main-content">
        <div class="card">
          <h3 style="color:var(--warning)">Create MCQ Fight ⚡</h3>
          <input class="input" id="mfTitle" placeholder="Fight Title">
          <input class="input" id="mfHours" type="number" placeholder="Hours to Expiry">
          <textarea class="input" id="mfRaw" rows="6" placeholder="Q|Opt1|Opt2|Opt3|Opt4|Answer"></textarea>
          <button class="btn btn-warning" onclick="publishMcqFight()">Publish MCQ Fight</button>
        </div>
        <div class="card">
          <h3>Add Standard Content</h3>
          <select id="coNodeType" class="input"><option value="quests">Quest</option><option value="custom_games">Game</option><option value="literature">Literature</option></select>
          <input class="input" id="coTitle" placeholder="Title / Question">
          <button class="btn" onclick="publishStandardContent()">Publish Content (Moves to Top)</button>
        </div>
      </div>
    </div>
  `;
}

window.publishMcqFight = async function() {
  const title = $('mfTitle').value; const hrs = parseInt($('mfHours').value);
  const raw = $('mfRaw').value.trim().split('\n');
  if(!title || !hrs || raw.length === 0) return toast('Fill all fields');
  
  let questions = [];
  raw.forEach(line => {
    let p = line.split('|');
    if(p.length === 6) questions.push({ q:p[0], o1:p[1], o2:p[2], o3:p[3], o4:p[4], a:p[5] });
  });
  
  await push(ref(db, 'battles'), {
    title, type: 'mcq_fight',
    endTimestamp: Date.now() + (hrs * 3600000),
    createdAt: Date.now(),
    questions
  });
  toast('MCQ Fight Published!');
}

window.publishStandardContent = async function() {
  const node = $('coNodeType').value;
  const title = $('coTitle').value.trim();
  if(!title) return;
  // Using createdAt ensures it moves to the very top in reverse-chronological render
  await push(ref(db, node), { title, question: title, name: title, createdAt: Date.now() });
  toast('Content Published at Top!');
}

</script>
