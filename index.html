*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-touch-callout:none;}
body{

.container{max-width:600px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);position: relative;}
header{

.network-dot{ width:10px;height:10px;border-radius:50%; background:#4caf50;display:inline-block;}
.network-dot.offline{background:#f44336}

.btn-warning{background:var(--warning)}

.input{

/* Blue Cut ফিল্টার এফেক্ট */

  position:fixed;top:0;left:0;right:0;bottom:0; background:rgba(245, 222, 179, 0.25);

.brightness-overlay {

.form-builder-row{ display:flex;align-items:center;gap:10px;margin-top:8px; }

function toast(msg){
  if(localStorage.getItem('yc_mute') === 'true') return; // Mute অন থাকলে পুশ মেসেজ ভাইব্রেশন টোস্ট হবে না
  let t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:10px 20px;border-radius:8px;z-index:1000;font-size:14px;box-shadow:0 4px 6px rgba(0,0,0,0.1);';
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2000);
}
window.toast = toast;

document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) {
    e.stopPropagation(); 
  }
}, true);

function checkTabLock(){
  const tabId = sessionStorage.getItem(TAB_KEY) || Math.random().toString(36);
  sessionStorage.setItem(TAB_KEY, tabId);
  localStorage.setItem(TAB_KEY, tabId);
  window.addEventListener('storage', (e)=>{
    if(e.key === TAB_KEY && e.newValue !== tabId){
      alert('তুমি অন্য ট্যাবে লগইন করেছো। এই ট্যাব বন্ধ হয়ে যাবে।');
      window.close();
    }
  });
}

function applySavedThemeAndBrightness() {
  const savedTheme = localStorage.getItem("yc_theme") || "light";
  document.documentElement.setAttribute("data-theme", savedTheme);
  
  const savedVal = localStorage.getItem("yc_brightness") || "100";
  const opacity = (100 - parseInt(savedVal)) / 100;
  if($('brightnessLayer')) $('brightnessLayer').style.backgroundColor = `rgba(0, 0, 0, ${opacity * 0.85})`;

  const blueCut = localStorage.getItem("yc_bluecut") || "false";
  if($('bluelight')) $('bluelight').style.display = (blueCut === "true") ? 'block' : 'none';
}

function getLevenshteinDistance(a, b) {
  if (a.length === 0) return b.length;
  if (b.length === 0) return a.length;
  const matrix = [];
  for (let i = 0; i <= b.length; i++) { matrix[i] = [i]; }
  for (let j = 0; j <= a.length; j++) { matrix[0][j] = j; }
  for (let i = 1; i <= b.length; i++) {
    for (let j = 1; j <= a.length; j++) {
      if (b.charAt(i - 1) === a.charAt(j - 1)) { matrix[i][j] = matrix[i - 1][j - 1]; }
      else {
        matrix[i][j] = Math.min(matrix[i - 1][j - 1] + 1, Math.min(matrix[i][j - 1] + 1, matrix[i - 1][j] + 1));
      }
    }
  }
  return matrix[b.length][a.length];
}

function checkAnswerSmart(userAns, correctAns) {
  if (!userAns || !correctAns) return false;
  let u = userAns.toLowerCase().trim().replace(/[\s.,\/#!$%\^&\*;:{}=\-_`~()]/g,"");
  let c = correctAns.toLowerCase().trim().replace(/[\s.,\/#!$%\^&\*;:{}=\-_`~()]/g,"");
  if (u === c) return true;
  let maxLen = Math.max(u.length, c.length);
  if (maxLen === 0) return false;
  let dist = getLevenshteinDistance(u, c);
  let similarity = (maxLen - dist) / maxLen;
  return similarity >= 0.78; 
}

// চ্যাট ডিলিট ইঞ্জিন (CO Panel ২০ দিন, বাকি চ্যাট ১০০ দিন)
async function runAutoExpiryCheck(){
  const now = Date.now();
  const todayStr = new Date().toISOString().split('T')[0];
  
  // ১. সিও চ্যাট মডারেশন মুছা (২০ দিন = ১৭২৮০০০০০০ ms)
  const coMsgsSnap = await get(ref(db, 'co_messages'));
  if(coMsgsSnap.exists()){
    Object.entries(coMsgsSnap.val()).forEach(([uSerial, group]) => {
      Object.entries(group).forEach(async ([msgId, m]) => {
        if(m.time && (now - m.time) > (20 * 24 * 60 * 60 * 1000)){
          await remove(ref(db, `co_messages/${uSerial}/${msgId}`));
        }
      });
    });
  }

  // ২. সাধারণ ফ্রেন্ড ও গ্রুপ চ্যাট ডিলিট (১০০ দিন = ৮৬৪০০০০০০০ ms)
  const hundredDays = 100 * 24 * 60 * 60 * 1000;
  const pChatsSnap = await get(ref(db, 'chats'));
  if(pChatsSnap.exists()){
    Object.entries(pChatsSnap.val()).forEach(([cId, g]) => {
      Object.entries(g).forEach(async ([mId, m]) => {
        if(m.time && (now - m.time) > hundredDays) await remove(ref(db, `chats/${cId}/${mId}`));
      });
    });
  }
  const gChatsSnap = await get(ref(db, 'group_chats'));
  if(gChatsSnap.exists()){
    Object.entries(gChatsSnap.val()).forEach(([gId, g]) => {
      Object.entries(g).forEach(async ([mId, m]) => {
        if(m.time && (now - m.time) > hundredDays) await remove(ref(db, `group_chats/${gId}/${mId}`));
      });
    });
  }

  // পূর্বের এক্সপায়ারি মেকানিজম অক্ষুণ্ণ রাখা হলো
  const tagSnap = await get(ref(db, 'scroll_tag'));
  if(tagSnap.exists() && tagSnap.val().lastDate && tagSnap.val().lastDate < todayStr) await remove(ref(db, 'scroll_tag'));
  const noticeSnap = await get(ref(db, 'notice_board'));
  if(noticeSnap.exists() && noticeSnap.val().lastDate && noticeSnap.val().lastDate < todayStr) await remove(ref(db, 'notice_board'));
}

  $('app').innerHTML = `

    </div>
  `;
}

window.toggleAuthMode = function(isRecovery){
  const card = $('authCard');
  if(isRecovery){
    card.innerHTML = `
      <h2 style="text-align:center;margin-bottom:20px;color:var(--accent);">Account Recovery</h2>
      <input type="text" class="input" id="recoverySerial" placeholder="Old Serial No (YC_XXXXXX)">
      <input type="password" class="input" id="recoveryPass" placeholder="Password">
      <button class="btn" onclick="recoverAccount()">Recover Account</button>
      <span class="switch-link" onclick="renderAuth()">নতুন অ্যাকাউন্ট তৈরি করো (Login)</span>
    `;
  }
}

window.login = async function(){
  const name = $('name').value.trim(); const password = $('password').value.trim();
  if(!name || !password){ toast('নাম এবং পাসওয়ার্ড দুটোই দেওয়া বাধ্যতামুলক!'); return; }
  try {
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789";
    let randomPart = ""; for(let i = 0; i < 6; i++) { randomPart += chars.charAt(Math.floor(Math.random() * chars.length)); }
    const generatedSerial = "YC_" + randomPart;
    currentUser = { name, serial: generatedSerial, password, isCO: false, score: 0, createdAt: Date.now(), isBlocked: false };
    await set(ref(db, 'users/' + generatedSerial), currentUser);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(currentUser));
    syncUserAndRender();
  } catch(e) { toast('কানেকশন এরর!'); }
}

window.recoverAccount = async function(){
  const serial = $('recoverySerial').value.trim(); const password = $('recoveryPass').value.trim();
  if(!serial || !password){ toast('সিরিয়াল এবং পাসওয়ার্ড দেওয়া বাধ্যতামুলক'); return; }
  try {
    const snap = await get(ref(db, 'users/' + serial));
    if(snap.exists()){
      let fetchedUser = snap.val();
      if(fetchedUser.password && fetchedUser.password !== password) { toast('ভুল পাসওয়ার্ড!'); return; }
      currentUser = fetchedUser;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(currentUser));
      syncUserAndRender();
    } else { toast('অ্যাকাউন্ট পাওয়া যায়নি!'); }
  } catch(e) { toast('কানেকশন এরর!'); }
}

async function syncUserAndRender() {
  if(!currentUser) return renderAuth();
  onValue(ref(db, 'users/' + currentUser.serial), snap => {
    if(snap.exists()) {
      currentUser = snap.val();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(currentUser));
      if(currentUser.isBlocked) renderBlockedScreen();
      else renderHome();
    } else {
      localStorage.removeItem(STORAGE_KEY);
      renderAuth();
    }
  });
  checkTabLock();
  applySavedThemeAndBrightness();
  listenGlobalRealtimeNotificationDots();
}

function renderBlockedScreen() {
  $('app').innerHTML = `<div class="screen active"><div class="card" style="margin-top:100px; text-align:center;"><h2 style="color:var(--accent2);">অ্যাকাউন্ট ব্লকড! 🛑</h2><button class="btn btn-secondary" onclick="localStorage.removeItem('${STORAGE_KEY}');location.reload();">Logout</button></div></div>`;
}

      <div class="nav-grid">

        <div class="nav-btn" onclick="showEvent()"><div class="icon">📅</div><div class="label">Event</div></div>
        <div class="nav-btn" onclick="showApp()"><div class="icon">📄</div><div class="label">Application</div></div>
        <div class="nav-btn" onclick="showKnowledge()"><div class="icon">🧠</div><div class="label">Knowledge</div></div>
        <div class="nav-btn" onclick="showLiterature()"><div class="icon">📖</div><div class="label">Literature</div></div>

      </div>

    <div class="bottom-nav">

// সিস্টেম ও ডিসপ্লে লাইভ হ্যান্ডলারসমূহ
window.toggleDarkThemeLive = function() {
  const current = document.documentElement.getAttribute("data-theme") || "light";
  const target = current === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", target);
  localStorage.setItem("yc_theme", target);
}
window.toggleBlueCutLive = function() {
  const status = localStorage.getItem("yc_bluecut") === "true";
  localStorage.setItem("yc_bluecut", !status);
  applySavedThemeAndBrightness();
  refreshControlButtonsUI();
}
window.toggleMuteLive = function() {

  refreshControlButtonsUI();
}
window.alterAppBrightnessLive = function(val) {

}
function refreshControlButtonsUI() {
  if($('blueCutBtn')) $('blueCutBtn').textContent = localStorage.getItem("yc_bluecut") === "true" ? "Blue-cut: ON" : "Blue-cut: OFF";

}

// --------------------- CONTACT SECTION (সম্পূর্ণ নতুন সংস্কার) ---------------------

window.renderContactTab = function(tabName) {

// ১. ফ্রেন্ড চ্যাট ও নাম এডিট মডিউল
function loadFriendsListContact() {
  onValue(ref(db, 'friends/' + currentUser.serial), async snap => {
    let html = '';
    if(snap.exists()) {
      for(let fid of Object.keys(snap.val())) {
        let savedCustomName = localStorage.getItem(`custom_name_${currentUser.serial}_${fid}`) || "";
        const uSnap = await get(ref(db, 'users/' + fid)); if(!uSnap.exists()) continue;
        let displayName = savedCustomName ? `${savedCustomName} (${uSnap.val().name})` : uSnap.val().name;
        
        // চ্যাট নোটিফিকেশন রিয়েলটাইম স্ন্যাপশট
        html += `
          <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
            <div onclick="openFriendChatRoom('${fid}', '${displayName}')" style="cursor:pointer; flex:1;">
              <span id="chatDot_${fid}"></span><strong>${displayName}</strong> <br><small style="color:var(--muted)">ID: ${fid}</small>
              <div id="lastMsg_${fid}" style="font-size:11px; color:var(--accent);"></div>
            </div>
            <button class="btn btn-secondary" style="width:auto; margin:0; padding:4px 8px; font-size:11px;" onclick="renameFriendPrompt('${fid}')">Nick Name</button>
          </div>
        `;
        listenLastMessageAndDots(`chats/${[currentUser.serial, fid].sort().join('_')}`, `chatDot_${fid}`, `lastMsg_${fid}`);
      }
    } else html = '<p style="color:var(--muted)">কোনো বন্ধু তালিকাভুক্ত নেই।</p>';
    if($('cFriendList')) $('cFriendList').innerHTML = html;
  });
}
window.renameFriendPrompt = function(fid) {
  let n = prompt("এই বন্ধুর জন্য একটি ডাকনাম দিন (এটি শুধু আপনিই দেখতে পাবেন):");
  if(n !== null) {
    localStorage.setItem(`custom_name_${currentUser.serial}_${fid}`, n.trim());
    loadFriendsListContact();
  }
}

// ২. গ্রুপ চ্যাট ও লিডার/কো-লিডার মডিউল
function loadGroupsListContact() {
  onValue(ref(db, 'groups'), snap => {
    let html = '';
    if(snap.exists()){
      Object.entries(snap.val()).forEach(([gId, g]) => {
        if(g.members && g.members[currentUser.serial]) {
          let role = "Member";
          if(g.creator === currentUser.serial) role = "Leader";
          else if(g.coLeaders && g.coLeaders[currentUser.serial]) role = "Co-Leader";

          html += `
            <div class="card">
              <div onclick="openGroupChatRoom('${gId}', '${g.name}')" style="cursor:pointer;">
                <strong>💬 ${g.name}</strong> <span class="status-tag">${role}</span>
                <div id="gLastMsg_${gId}" style="font-size:11px; color:var(--accent);"></div>
              </div>
              <div style="margin-top:8px; display:flex; gap:4px;">
                ${(role==='Leader' || role==='Co-Leader') ? `<button class="btn btn-success" style="padding:4px 8px; font-size:11px; margin:0; width:auto;" onclick="manageGroupMembersPrompt('${gId}')">Add Member</button>` : ''}
                ${role==='Leader' ? `<button class="btn btn-warning" style="padding:4px 8px; font-size:11px; margin:0; width:auto;" onclick="makeCoLeaderPrompt('${gId}')">Make Co-Leader</button>` : ''}
                ${role==='Leader' ? `<button class="btn btn-danger" style="padding:4px 8px; font-size:11px; margin:0; width:auto;" onclick="dissolveGroupLive('${gId}')">Delete Group</button>` : ''}
              </div>
            </div>
          `;
          listenLastMessageAndDots(`group_chats/${gId}`, `null`, `gLastMsg_${gId}`);
        }
      });
    }
    if($('cGroupList')) $('cGroupList').innerHTML = html || '<p style="color:var(--muted)">তুমি কোনো গ্রুপে জয়েন করোনি।</p>';
  });
}
window.showGroupCreateForm = function() {
  let gName = prompt("নতুন গ্রুপের নাম দিন:"); if(!gName) return;
  let mems = {}; mems[currentUser.serial] = true;
  let gRef = push(ref(db, 'groups'));
  set(gRef, { name: gName, creator: currentUser.serial, members: mems, createdAt: Date.now() });
  toast("গ্রুপ তৈরি সফল!");
}
window.manageGroupMembersPrompt = function(gId) {
  let targetId = prompt("যে মেম্বারকে অ্যাড করতে চান তার সিরিয়াল আইডি দিন:"); if(!targetId) return;
  get(ref(db, 'users/' + targetId.trim())).then(s => {
    if(s.exists()){
      update(ref(db, `groups/${gId}/members`), { [targetId.trim()]: true });
      toast("মেম্বার যুক্ত হয়েছে!");
    } else toast("ভুল আইডি!");
  });
}
window.makeCoLeaderPrompt = function(gId) {
  let targetId = prompt("কাকে কো-লিডার বানাতে চান তার আইডি দিন:"); if(!targetId) return;
  update(ref(db, `groups/${gId}/coLeaders`), { [targetId.trim()]: true });
  toast("কো-লিডার তৈরি করা হয়েছে!");
}
window.dissolveGroupLive = function(gId) {
  if(confirm("তুমি কি নিশ্চিত যে গ্রুপটি মুছে ফেলবে? ফায়ারবেস থেকে এর অস্তিত্ব মুছে যাবে!")){
    remove(ref(db, 'groups/' + gId)); remove(ref(db, 'group_chats/' + gId)); toast("গ্রুপ ডিলিট হয়েছে!");
  }
}

// ৩. ফাইন্ড ফ্রেন্ড সার্চ বার সহ ইঞ্জিন
async function loadFindFriendsContact() {
  const snap = await get(ref(db, 'users'));
  window.contactUsersCache = snap.exists() ? snap.val() : {};
  filterFindFriendsContact();
}
window.filterFindFriendsContact = function() {
  const queryText = ($('searchFKey') ? $('searchFKey').value.trim().toLowerCase() : "");
  let html = '';
  Object.entries(window.contactUsersCache || {}).forEach(([serial, u]) => {
    if(serial === currentUser.serial || u.isBlocked) return;
    if(queryText && !u.name.toLowerCase().includes(queryText) && !serial.toLowerCase().includes(queryText)) return;
    html += `
      <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
        <div><strong>${u.name}</strong> <br><small style="color:var(--muted)">Serial: ${serial}</small></div>
        <button class="btn" style="width:auto; padding:6px 12px; margin:0;" onclick="sendFriendReqContact('${serial}')">Request</button>
      </div>
    `;
  });
  if($('cFindList')) $('cFindList').innerHTML = html || '<div class="card">কোনো ইউজার পাওয়া যায়নি।</div>';
}
window.sendFriendReqContact = async function(tSerial) {
  await set(ref(db, `requests/${tSerial}/${currentUser.serial}`), 'pending'); toast("রিকোয়েস্ট পাঠানো হয়েছে!");
}

// ৪. ফ্রেন্ড রিকোয়েস্ট এক্সেপ্ট
function loadRequestsListContact() {
  onValue(ref(db, 'requests/' + currentUser.serial), async snap => {

    if(snap.exists()) {
      for(let fromId of Object.keys(snap.val())) {
        const uSnap = await get(ref(db, 'users/' + fromId)); if(!uSnap.exists()) continue;
        html += `

          </div>
        `;
      }
    } else html = '<p style="color:var(--muted)">কোনো পেন্ডিং রিকোয়েস্ট নেই।</p>';
    if($('cReqList')) $('cReqList').innerHTML = html;

window.acceptFriendReqContact = async function(fromId) {
  await set(ref(db, `friends/${currentUser.serial}/${fromId}`), true);
  await set(ref(db, `friends/${fromId}/${currentUser.serial}`), true);
  await remove(ref(db, `requests/${currentUser.serial}/${fromId}`));

window.openGroupChatRoom = function(gId, title) {

}

// রিয়েলটাইম মেসেজ নোটিফিকেশন ইঞ্জিন (সবুজ আলো, New এবং পুশ ট্রিগার)
function listenLastMessageAndDots(nodePath, dotId, txtId) {
  onValue(query(ref(db, nodePath), orderByChild('time')), snap => {
    if(snap.exists()) {
      let entries = Object.values(snap.val()); let lastMsg = entries[entries.length - 1];
      if($(txtId)) $(txtId).innerHTML = `<span class="green-dot"></span><span style="color:var(--success); font-weight:bold;">New</span> ${lastMsg.text.substring(0, 15)}...`;
      if($(dotId) && dotId !== 'null') $(dotId).innerHTML = `<span class="green-dot"></span>`;
      toast(`নতুন মেসেজ এসেছে চ্যাটে!`);
    }
  });
}

// ১. প্লেয়ার ব্যাটেল (পূর্বে থাকা ফিচার)
function loadPlayersBattleStream() {
  onValue(ref(db, 'battles'), snap => {
    let html = '';
    if(snap.exists()){
      Object.entries(snap.val()).forEach(([bId, b]) => {
        if(b.endTimestamp && Date.now() > b.endTimestamp) return;
        html += `
          <div class="card" style="border-left: 4px solid var(--accent2);">
            <h4>${b.title}</h4>
            <button class="btn btn-danger" style="padding:6px; font-size:12px;" onclick="enterLiveBattleSession('${bId}')">Enter Exam</button>
          </div>
        `;
      });
    }
    if($('pbList')) $('pbList').innerHTML = html || '<p>কোনো সেশন উপলব্ধ নেই।</p>';
  });
}

// ২. MCQ Fight (১৫ সেকেন্ড রিয়েলটাইম কাউন্টডাউন ও সিও মডারেশন)
function loadMCQFightArena() {
  onValue(ref(db, 'live_mcq_fight'), async snap => {
    const zone = $('mcqFightZone'); if(!zone) return;
    if(!snap.exists()) { zone.innerHTML = '<div class="card">বর্তমানে সিও প্যানেল থেকে কোনো লাইভ MCQ ফাইট দেওয়া হয়নি।</div>'; return; }
    
    const fight = snap.val();
    if(fight.expiryTimestamp && Date.now() > fight.expiryTimestamp) {
      zone.innerHTML = '<div class="card">এই ফাইটটির সময়সীমা শেষ হয়ে গেছে!</div>'; return;
    }

    // অলরেডি সাবমিটেড কিনা চেক
    const hasFought = localStorage.getItem(`mcq_fought_${fight.createdAt}`);
    if(hasFought) { zone.innerHTML = `<div class="card" style="color:var(--success)">তুমি এই MCQ ফাইটে উত্তর দিয়েছো! প্রাপ্তি লক করা হয়েছে।</div>`; return; }

    zone.innerHTML = `
      <div class="card" style="border: 2px solid var(--warning); background:var(--card);">
        <div style="float:right; font-weight:bold; color:var(--accent2);" id="fightTimer">15s</div>
        <strong>Question:</strong>
        <p style="font-size:16px; margin:8px 0; font-weight:bold;">${fight.question}</p>
        <div id="mcqFightOptions"></div>
      </div>
    `;

    fight.options.forEach(opt => {

function renderGroupBattleCoreGameplay(session) {
  const p = $('battleCorePanel'); if(!p) return;
  // সিও লাইভ কন্ট্রোল ডিসিশন অপশন
  if(currentUser.isCO) {
    p.innerHTML = `
      <div style="background:#efebe9; padding:8px; border-radius:6px;">
        <h5 style="color:var(--warning);">👨‍⚖️ CO Judge Control Desk</h5>
        <p>Current Turn: <b>Group ${session.currentTurn}</b></p>
        <p>Question Posted: ${session.currentQuestion || 'Waiting...'}</p>
        <p>Answer Posted: ${session.currentAnswer || 'Waiting...'}</p>
        <div class="flex-actions">
          <button class="btn btn-success" onclick="coJudgeDecision(true)">Decision: RIGHT (ঠিক)</button>
          <button class="btn btn-danger" onclick="coJudgeDecision(false)">Decision: WRONG (ভুল)</button>
        </div>
      </div>
    `;
    return;
  }

  // মেম্বারদের জন্য অ্যাকশন স্ক্রিন
  let myGroup = "None";
  if(session.membersA && session.membersA[currentUser.serial]) myGroup = session.groupA;
  if(session.membersB && session.membersB[currentUser.serial]) myGroup = session.groupB;

  if(myGroup === "None") {
    p.innerHTML = `<p style="color:var(--muted); text-align:center;">তুমি এই খেলায় পার্টিসিপেট করা কোনো গ্রুপের মেম্বার নও। দর্শক হিসেবে লাইভ দেখছো।</p>`;
    return;
  }

  if(session.currentTurn === myGroup) {
    // প্রশ্ন করার পালা
    if(!session.currentQuestion) {
      p.innerHTML = `
        <h5>Your Group Turn: প্রশ্ন করো ✍️</h5>
        <input class="input" id="gQuestionInp" placeholder="টাইপ ইউর কোয়েশ্চেন...">
        <button class="btn btn-danger" onclick="submitGroupBattleQuestion('${myGroup}')">পাবলিশ প্রশ্ন</button>
      `;
    } else {
      p.innerHTML = `
        <p>তোমার গ্রুপ প্রশ্ন সাবমিট করেছে: <b>${session.currentQuestion}</b></p>
        <p>প্রতিপক্ষ উত্তর দেওয়ার পর আপনার সিদ্ধান্ত দিন:</p>
        <div class="flex-actions">
          <button class="btn btn-success" onclick="groupLeaderDecision(true)">ঠিক হয়েছে</button>
          <button class="btn btn-danger" onclick="groupLeaderDecision(false)">ভুল হয়েছে</button>
        </div>
      `;
    }
  } else {
    // উত্তর দেওয়ার পালা
    if(session.currentQuestion) {
      p.innerHTML = `
        <h5>💥 বিপক্ষ দলের প্রশ্ন:</h5>
        <p style="font-size:16px; font-weight:bold; color:var(--accent2);">${session.currentQuestion}</p>
        <input class="input" id="gAnswerInp" placeholder="উত্তর টাইপ করুন...">
        <button class="btn btn-success" onclick="submitGroupBattleAnswer('${myGroup}')">উত্তর দিন</button>
      `;
    } else {
      p.innerHTML = `<p style="text-align:center; color:var(--warning);">বিপক্ষ দল প্রশ্ন তৈরি করছে... অপেক্ষা করুন।</p>`;
    }
  }
}

// সিও ফাইনাল ইভালুয়েশন ইঞ্জিন লজিক
window.coJudgeDecision = async function(coRight) {
  const snap = await get(ref(db, 'group_battle_session')); if(!snap.exists()) return;
  const s = snap.val();
  
  let pA = s.pointsA || 0; let pB = s.pointsB || 0;
  let gRight = s.groupDecision === true;

  // প্রশ্নকর্তা দল A হলে উত্তরদাতা B
  if(s.currentTurn === s.groupA) {
    if(gRight && coRight) pB += 10;
    else if(!gRight && !coRight) pA += 10;
    else { pA -= 10; pB += 10; }
  } else { // টার্ন B হলে উত্তরদাতা A
    if(gRight && coRight) pA += 10;
    else if(!gRight && !coRight) pB += 10;
    else { pB -= 10; pA += 10; }
  }

  // অল্টারনেট টার্ন স্যুইচিং মেকানিজম
  let nextTurn = (s.currentTurn === s.groupA) ? s.groupB : s.groupA;
  await update(ref(db, 'group_battle_session'), {
    pointsA: pA, pointsB: pB, currentTurn: nextTurn,
    currentQuestion: null, currentAnswer: null, groupDecision: null
  });
  toast("পয়েন্ট হিসেব করে পরবর্তী রাউন্ড চালু করা হয়েছে!");
}

  let opts = prompt("অপশনসমূহ কমা (,) দিয়ে আলাদা করে লিখুন:"); if(!opts) return;
  let ans = prompt("সঠিক উত্তরটি হুবহু লিখুন:"); if(!ans) return;
  let hours = prompt("কত ঘন্টা পর এটি স্বয়ংক্রিয়ভাবে মুছে যাবে?"); if(!hours) return;

  let expiryTimestamp = Date.now() + (parseFloat(hours) * 60 * 60 * 1000);
  set(ref(db, 'live_mcq_fight'), {
    question: q, options: opts.split(','), answer: ans.trim(),
    expiryTimestamp, createdAt: Date.now(), points: 10
  });
  toast("লাইভ MCQ ফাইট ডিপ্লয় করা হয়েছে!");
}

// গ্রুপ ব্যাটেল লাইভ স্টার্টার কন্ট্রোল
window.coStartGroupBattleLive = async function() {
  const gA = $('gAName').value.trim(); const gB = $('gBName').value.trim();
  if(!gA || !gB) return toast("দুটো গ্রুপের নামই এন্টার করো!");
  
  // ডায়নামিক মেম্বার কালেকশন লজিক
  let memsA = {}; let memsB = {};
  let gSnap = await get(ref(db, 'groups'));
  if(gSnap.exists()) {
    Object.values(gSnap.val()).forEach(g => {
      if(g.name.toLowerCase() === gA.toLowerCase()) memsA = g.members || {};
      if(g.name.toLowerCase() === gB.toLowerCase()) memsB = g.members || {};
    });
  }

  await set(ref(db, 'group_battle_session'), {
    active: true, groupA: gA, groupB: gB, pointsA: 0, pointsB: 0,
    currentTurn: gA, stage: "questioning", membersA: memsA, membersB: memsB, createdAt: Date.now()
  });
  toast("গ্রুপ ব্যাটল ম্যাচ সেশন সফলভাবে শুরু হয়েছে!");
}
window.coStopGroupBattleLive = async function() {
  const snap = await get(ref(db, 'group_battle_session')); if(!snap.exists()) return;
  const s = snap.val();
  let winMsg = "Match Tied!";
  if(s.pointsA > s.pointsB) winMsg = `Winner: Group ${s.groupA}! +50 Score added to every member.`;
  else if(s.pointsB > s.pointsA) winMsg = `Winner: Group ${s.groupB}! +50 Score added to every member.`;

  // বিজয়ী দলের প্রত্যেক মেম্বারকে +৫০ পয়েন্ট ডিস্ট্রিবিউট করা
  let winGroupMembers = s.pointsA > s.pointsB ? s.membersA : (s.pointsB > s.pointsA ? s.membersB : {});
  for(let mId of Object.keys(winGroupMembers)) {
    let uRef = ref(db, `users/${mId}`); let uS = await get(uRef);
    if(uS.exists()) await update(uRef, { score: (uS.val().score || 0) + 50 });
  }

  await remove(ref(db, 'group_battle_session'));
  alert(`🛑 খেলা সমাপ্ত ঘোষণা করা হলো!\n\n${winMsg}`);
}

function applySavedThemeAndBrightness() {
  const savedTheme = localStorage.getItem("yc_theme") || "light";

  const savedVal = localStorage.getItem("yc_brightness") || "100";

}

function getLevenshteinDistance(a, b) {
  if (a.length === 0) return b.length;
  if (b.length === 0) return a.length;
  const matrix = [];
  for (let i = 0; i <= b.length; i++) { matrix[i] = [i]; }
  for (let j = 0; j <= a.length; j++) { matrix[0][j] = j; }
  for (let i = 1; i <= b.length; i++) {
    for (let j = 1; j <= a.length; j++) {
      if (b.charAt(i - 1) === a.charAt(j - 1)) { matrix[i][j] = matrix[i - 1][j - 1]; }
      else {
        matrix[i][j] = Math.min(matrix[i - 1][j - 1] + 1, Math.min(matrix[i][j - 1] + 1, matrix[i - 1][j] + 1));
      }
    }
  }
  return matrix[b.length][a.length];
}

function checkAnswerSmart(userAns, correctAns) {
  if (!userAns || !correctAns) return false;
  let u = userAns.toLowerCase().trim().replace(/[\s.,\/#!$%\^&\*;:{}=\-_`~()]/g,"");
  let c = correctAns.toLowerCase().trim().replace(/[\s.,\/#!$%\^&\*;:{}=\-_`~()]/g,"");
  if (u === c) return true;
  let maxLen = Math.max(u.length, c.length);
  if (maxLen === 0) return false;
  let dist = getLevenshteinDistance(u, c);
  let similarity = (maxLen - dist) / maxLen;
  return similarity >= 0.78; 
}

// চ্যাট ডিলিট ইঞ্জিন (CO Panel ২০ দিন, বাকি চ্যাট ১০০ দিন)
async function runAutoExpiryCheck(){
  const now = Date.now();
  const todayStr = new Date().toISOString().split('T')[0];
  
  // ১. সিও চ্যাট মডারেশন মুছা (২০ দিন = ১৭২৮০০০০০০ ms)
  const coMsgsSnap = await get(ref(db, 'co_messages'));
  if(coMsgsSnap.exists()){
    Object.entries(coMsgsSnap.val()).forEach(([uSerial, group]) => {
      Object.entries(group).forEach(async ([msgId, m]) => {
        if(m.time && (now - m.time) > (20 * 24 * 60 * 60 * 1000)){
          await remove(ref(db, `co_messages/${uSerial}/${msgId}`));
        }
      });
    });
  }

  // ২. সাধারণ ফ্রেন্ড ও গ্রুপ চ্যাট ডিলিট (১০০ দিন = ৮৬৪০০০০০০০ ms)
  const hundredDays = 100 * 24 * 60 * 60 * 1000;
  const pChatsSnap = await get(ref(db, 'chats'));
  if(pChatsSnap.exists()){
    Object.entries(pChatsSnap.val()).forEach(([cId, g]) => {
      Object.entries(g).forEach(async ([mId, m]) => {
        if(m.time && (now - m.time) > hundredDays) await remove(ref(db, `chats/${cId}/${mId}`));
      });
    });
  }
  const gChatsSnap = await get(ref(db, 'group_chats'));
  if(gChatsSnap.exists()){
    Object.entries(gChatsSnap.val()).forEach(([gId, g]) => {
      Object.entries(g).forEach(async ([mId, m]) => {
        if(m.time && (now - m.time) > hundredDays) await remove(ref(db, `group_chats/${gId}/${mId}`));
      });
    });
  }

  // পূর্বের এক্সপায়ারি মেকানিজম অক্ষুণ্ণ রাখা হলো
  const tagSnap = await get(ref(db, 'scroll_tag'));
  if(tagSnap.exists() && tagSnap.val().lastDate && tagSnap.val().lastDate < todayStr) await remove(ref(db, 'scroll_tag'));
  const noticeSnap = await get(ref(db, 'notice_board'));
  if(noticeSnap.exists() && noticeSnap.val().lastDate && noticeSnap.val().lastDate < todayStr) await remove(ref(db, 'notice_board'));
}

function renderAuth(){
  $('app').innerHTML = `

}

window.login = async function(){
  const name = $('name').value.trim(); const password = $('password').value.trim();
  if(!name || !password){ toast('নাম এবং পাসওয়ার্ড দুটোই দেওয়া বাধ্যতামুলক!'); return; }
  try {
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789";
    let randomPart = ""; for(let i = 0; i < 6; i++) { randomPart += chars.charAt(Math.floor(Math.random() * chars.length)); }
    const generatedSerial = "YC_" + randomPart;
    currentUser = { name, serial: generatedSerial, password, isCO: false, score: 0, createdAt: Date.now(), isBlocked: false };

window.recoverAccount = async function(){
  const serial = $('recoverySerial').value.trim(); const password = $('recoveryPass').value.trim();
  if(!serial || !password){ toast('সিরিয়াল এবং পাসওয়ার্ড দেওয়া বাধ্যতামুলক'); return; }
  try {
    const snap = await get(ref(db, 'users/' + serial));
    if(snap.exists()){
      let fetchedUser = snap.val();
      if(fetchedUser.password && fetchedUser.password !== password) { toast('ভুল পাসওয়ার্ড!'); return; }
      currentUser = fetchedUser;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(currentUser));
      syncUserAndRender();
    } else { toast('অ্যাকাউন্ট পাওয়া যায়নি!'); }
  } catch(e) { toast('কানেকশন এরর!'); }
}

async function syncUserAndRender() {
  if(!currentUser) return renderAuth();
  onValue(ref(db, 'users/' + currentUser.serial), snap => {
    if(snap.exists()) {
      currentUser = snap.val();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(currentUser));
      if(currentUser.isBlocked) renderBlockedScreen();
      else renderHome();
    } else {
      localStorage.removeItem(STORAGE_KEY);
      renderAuth();
    }
  });
  checkTabLock();
  applySavedThemeAndBrightness();
  listenGlobalRealtimeNotificationDots();
}

function renderBlockedScreen() {
  $('app').innerHTML = `<div class="screen active"><div class="card" style="margin-top:100px; text-align:center;"><h2 style="color:var(--accent2);">অ্যাকাউন্ট ব্লকড! 🛑</h2><button class="btn btn-secondary" onclick="localStorage.removeItem('${STORAGE_KEY}');location.reload();">Logout</button></div></div>`;
}

// সিস্টেম ও ডিসপ্লে লাইভ হ্যান্ডলারসমূহ
window.toggleDarkThemeLive = function() {
  const current = document.documentElement.getAttribute("data-theme") || "light";
  const target = current === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", target);
  localStorage.setItem("yc_theme", target);
}
window.toggleBlueCutLive = function() {
  const status = localStorage.getItem("yc_bluecut") === "true";
  localStorage.setItem("yc_bluecut", !status);
  applySavedThemeAndBrightness();
  refreshControlButtonsUI();
}
window.toggleMuteLive = function() {
  const status = localStorage.getItem("yc_mute") === "true";
  localStorage.setItem("yc_mute", !status);
  refreshControlButtonsUI();
}
window.alterAppBrightnessLive = function(val) {
  localStorage.setItem("yc_brightness", val);
  const opacity = (100 - parseInt(val)) / 100;
  if($('brightnessLayer')) $('brightnessLayer').style.backgroundColor = `rgba(0, 0, 0, ${opacity * 0.85})`;
}
function refreshControlButtonsUI() {
  if($('blueCutBtn')) $('blueCutBtn').textContent = localStorage.getItem("yc_bluecut") === "true" ? "Blue-cut: ON" : "Blue-cut: OFF";
  if($('muteBtn')) $('muteBtn').textContent = localStorage.getItem("yc_mute") === "true" ? "Mute: ON" : "Mute: OFF";
}

// গ্লোবাল রিয়েলটাইম নোটিফিকেশন সিস্টেম (লাল বিন্দু ট্রিগার)
function listenGlobalRealtimeNotificationDots() {
  onValue(ref(db, 'quests'), s => { if(s.exists() && $('dot_quest')) $('dot_quest').style.display = 'block'; });
  onValue(ref(db, 'battles'), s => { if(s.exists() && $('dot_live_battle')) $('dot_live_battle').style.display = 'block'; });
}

// --------------------- CONTACT SECTION (সম্পূর্ণ নতুন সংস্কার) ---------------------
window.showContact = function() {
  if(currentUser?.isBlocked) return renderBlockedScreen();
  $('app').innerHTML = `
    <div class="screen active">
      <header><button onclick="renderHome()" style="background:none;border:none;color:var(--accent);font-size:16px;cursor:pointer;">← Back</button><span>Contact Desk</span></header>
      <div class="main-content">
        <!-- কন্টাক্ট সাব-মেনু বাটন গ্রিড -->
        <div class="nav-grid" style="margin-bottom:20px;">
          <button class="btn btn-success" onclick="renderContactTab('friends_view')">1. Friends</button>
          <button class="btn btn-success" onclick="renderContactTab('groups_view')">2. Groups</button>
          <button class="btn btn-success" onclick="renderContactTab('find_view')">3. Find Friend</button>
          <button class="btn btn-success" onclick="renderContactTab('req_view')">4. Request</button>
          <button class="btn btn-danger" onclick="renderContactTab('co_view')">5. Contact CO</button>
        </div>
        <div id="contactTabContent"></div>
      </div>
    </div>
  `;
  renderContactTab('friends_view');
}

window.renderContactTab = function(tabName) {
  const area = $('contactTabContent'); if(!area) return;
  if(tabName === 'friends_view') {
    area.innerHTML = `<h3>Friend List (চ্যাট করতে ক্লিক করো)</h3><div id="cFriendList">Loading...</div>`;
    loadFriendsListContact();
  } else if(tabName === 'groups_view') {
    area.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <h3>গ্রুপসমূহ</h3><button class="btn" style="width:auto; margin:0; padding:6px 12px;" onclick="showGroupCreateForm()">+ Create Group</button>
      </div>
      <div id="cGroupList">Loading...</div>
    `;
    loadGroupsListContact();
  } else if(tabName === 'find_view') {
    area.innerHTML = `<h3>Find Friend</h3><input class="input" id="searchFKey" placeholder="সিরিয়াল বা নাম সার্চ করুন..." oninput="filterFindFriendsContact()"><div id="cFindList" style="margin-top:10px;"></div>`;
    loadFindFriendsContact();
  } else if(tabName === 'req_view') {
    area.innerHTML = `<h3>আগত ফ্রেন্ড রিকোয়েস্ট</h3><div id="cReqList">Loading...</div>`;
    loadRequestsListContact();
  } else if(tabName === 'co_view') {
    openCOChatContactView();
  }
}

// ১. ফ্রেন্ড চ্যাট ও নাম এডিট মডিউল
function loadFriendsListContact() {
  onValue(ref(db, 'friends/' + currentUser.serial), async snap => {
    let html = '';
    if(snap.exists()) {
      for(let fid of Object.keys(snap.val())) {
        let savedCustomName = localStorage.getItem(`custom_name_${currentUser.serial}_${fid}`) || "";
        const uSnap = await get(ref(db, 'users/' + fid)); if(!uSnap.exists()) continue;
        let displayName = savedCustomName ? `${savedCustomName} (${uSnap.val().name})` : uSnap.val().name;
        
        // চ্যাট নোটিফিকেশন রিয়েলটাইম স্ন্যাপশট
        html += `
          <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
            <div onclick="openFriendChatRoom('${fid}', '${displayName}')" style="cursor:pointer; flex:1;">
              <span id="chatDot_${fid}"></span><strong>${displayName}</strong> <br><small style="color:var(--muted)">ID: ${fid}</small>
              <div id="lastMsg_${fid}" style="font-size:11px; color:var(--accent);"></div>
            </div>
            <button class="btn btn-secondary" style="width:auto; margin:0; padding:4px 8px; font-size:11px;" onclick="renameFriendPrompt('${fid}')">Nick Name</button>
          </div>
        `;
        listenLastMessageAndDots(`chats/${[currentUser.serial, fid].sort().join('_')}`, `chatDot_${fid}`, `lastMsg_${fid}`);
      }
    } else html = '<p style="color:var(--muted)">কোনো বন্ধু তালিকাভুক্ত নেই।</p>';
    if($('cFriendList')) $('cFriendList').innerHTML = html;
  });
}
window.renameFriendPrompt = function(fid) {
  let n = prompt("এই বন্ধুর জন্য একটি ডাকনাম দিন (এটি শুধু আপনিই দেখতে পাবেন):");
  if(n !== null) {
    localStorage.setItem(`custom_name_${currentUser.serial}_${fid}`, n.trim());
    loadFriendsListContact();
  }
}

// ২. গ্রুপ চ্যাট ও লিডার/কো-লিডার মডিউল
function loadGroupsListContact() {
  onValue(ref(db, 'groups'), snap => {
    let html = '';
    if(snap.exists()){
      Object.entries(snap.val()).forEach(([gId, g]) => {
        if(g.members && g.members[currentUser.serial]) {
          let role = "Member";
          if(g.creator === currentUser.serial) role = "Leader";
          else if(g.coLeaders && g.coLeaders[currentUser.serial]) role = "Co-Leader";

          html += `
            <div class="card">
              <div onclick="openGroupChatRoom('${gId}', '${g.name}')" style="cursor:pointer;">
                <strong>💬 ${g.name}</strong> <span class="status-tag">${role}</span>
                <div id="gLastMsg_${gId}" style="font-size:11px; color:var(--accent);"></div>
              </div>
              <div style="margin-top:8px; display:flex; gap:4px;">
                ${(role==='Leader' || role==='Co-Leader') ? `<button class="btn btn-success" style="padding:4px 8px; font-size:11px; margin:0; width:auto;" onclick="manageGroupMembersPrompt('${gId}')">Add Member</button>` : ''}
                ${role==='Leader' ? `<button class="btn btn-warning" style="padding:4px 8px; font-size:11px; margin:0; width:auto;" onclick="makeCoLeaderPrompt('${gId}')">Make Co-Leader</button>` : ''}
                ${role==='Leader' ? `<button class="btn btn-danger" style="padding:4px 8px; font-size:11px; margin:0; width:auto;" onclick="dissolveGroupLive('${gId}')">Delete Group</button>` : ''}
              </div>
            </div>
          `;
          listenLastMessageAndDots(`group_chats/${gId}`, `null`, `gLastMsg_${gId}`);
        }
      });
    }
    if($('cGroupList')) $('cGroupList').innerHTML = html || '<p style="color:var(--muted)">তুমি কোনো গ্রুপে জয়েন করোনি।</p>';
  });
}
window.showGroupCreateForm = function() {
  let gName = prompt("নতুন গ্রুপের নাম দিন:"); if(!gName) return;
  let mems = {}; mems[currentUser.serial] = true;
  let gRef = push(ref(db, 'groups'));
  set(gRef, { name: gName, creator: currentUser.serial, members: mems, createdAt: Date.now() });
  toast("গ্রুপ তৈরি সফল!");
}
window.manageGroupMembersPrompt = function(gId) {
  let targetId = prompt("যে মেম্বারকে অ্যাড করতে চান তার সিরিয়াল আইডি দিন:"); if(!targetId) return;
  get(ref(db, 'users/' + targetId.trim())).then(s => {
    if(s.exists()){
      update(ref(db, `groups/${gId}/members`), { [targetId.trim()]: true });
      toast("মেম্বার যুক্ত হয়েছে!");
    } else toast("ভুল আইডি!");
  });
}
window.makeCoLeaderPrompt = function(gId) {
  let targetId = prompt("কাকে কো-লিডার বানাতে চান তার আইডি দিন:"); if(!targetId) return;
  update(ref(db, `groups/${gId}/coLeaders`), { [targetId.trim()]: true });
  toast("কো-লিডার তৈরি করা হয়েছে!");
}
window.dissolveGroupLive = function(gId) {
  if(confirm("তুমি কি নিশ্চিত যে গ্রুপটি মুছে ফেলবে? ফায়ারবেস থেকে এর অস্তিত্ব মুছে যাবে!")){
    remove(ref(db, 'groups/' + gId)); remove(ref(db, 'group_chats/' + gId)); toast("গ্রুপ ডিলিট হয়েছে!");
  }
}

// ৩. ফাইন্ড ফ্রেন্ড সার্চ বার সহ ইঞ্জিন
async function loadFindFriendsContact() {
  const snap = await get(ref(db, 'users'));
  window.contactUsersCache = snap.exists() ? snap.val() : {};
  filterFindFriendsContact();
}
window.filterFindFriendsContact = function() {
  const queryText = ($('searchFKey') ? $('searchFKey').value.trim().toLowerCase() : "");
  let html = '';
  Object.entries(window.contactUsersCache || {}).forEach(([serial, u]) => {
    if(serial === currentUser.serial || u.isBlocked) return;
    if(queryText && !u.name.toLowerCase().includes(queryText) && !serial.toLowerCase().includes(queryText)) return;
    html += `
      <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
        <div><strong>${u.name}</strong> <br><small style="color:var(--muted)">Serial: ${serial}</small></div>
        <button class="btn" style="width:auto; padding:6px 12px; margin:0;" onclick="sendFriendReqContact('${serial}')">Request</button>
      </div>
    `;
  });
  if($('cFindList')) $('cFindList').innerHTML = html || '<div class="card">কোনো ইউজার পাওয়া যায়নি।</div>';
}
window.sendFriendReqContact = async function(tSerial) {
  await set(ref(db, `requests/${tSerial}/${currentUser.serial}`), 'pending'); toast("রিকোয়েস্ট পাঠানো হয়েছে!");
}

// ৪. ফ্রেন্ড রিকোয়েস্ট এক্সেপ্ট
function loadRequestsListContact() {
  onValue(ref(db, 'requests/' + currentUser.serial), async snap => {
    let html = '';
    if(snap.exists()) {
      for(let fromId of Object.keys(snap.val())) {
        const uSnap = await get(ref(db, 'users/' + fromId)); if(!uSnap.exists()) continue;
        html += `
          <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
            <div><strong>${uSnap.val().name}</strong></div>
            <button class="btn btn-success" style="width:auto; margin:0; padding:6px 12px;" onclick="acceptFriendReqContact('${fromId}')">Accept</button>
          </div>
        `;
      }
    } else html = '<p style="color:var(--muted)">কোনো পেন্ডিং রিকোয়েস্ট নেই।</p>';
    if($('cReqList')) $('cReqList').innerHTML = html;
  });
}
window.acceptFriendReqContact = async function(fromId) {
  await set(ref(db, `friends/${currentUser.serial}/${fromId}`), true);
  await set(ref(db, `friends/${fromId}/${currentUser.serial}`), true);
  await remove(ref(db, `requests/${currentUser.serial}/${fromId}`));
  toast("তোমরা এখন বন্ধু!");
}

// ৫. কন্টাক্ট সিও চ্যাট ভিউ
function openCOChatContactView() {
  $('contactTabContent').innerHTML = `
    <div class="card" id="chatBox" style="height:300px; overflow-y:auto; background:var(--bg);"></div>
    <div style="display:flex; gap:6px;"><input class="input" id="coInp" placeholder="সিও-কে সরাসরি লিখুন..." style="margin:0;"><button class="btn" style="width:auto; margin:0;" onclick="sendCOContactMsg()">Send</button></div>
  `;
  onValue(ref(db, 'co_messages/' + currentUser.serial), snap => {
    let html = ''; if(snap.exists()){ Object.values(snap.val()).forEach(m => { let isMe = m.sender === currentUser.serial; html += `<div style="text-align:${isMe?'right':'left'}; margin:6px;"><span><b>${isMe?'তুমি':'CO'}:</b> ${m.text}</span></div>`; }); }
    if($('chatBox')) { $('chatBox').innerHTML = html; $('chatBox').scrollTop = $('chatBox').scrollHeight; }
  });
}
window.sendCOContactMsg = async function() {
  const t = $('coInp').value.trim(); if(!t) return;
  await push(ref(db, 'co_messages/' + currentUser.serial), { sender: currentUser.serial, text: t, time: Date.now(), userName: currentUser.name });
  $('coInp').value = '';
}

// চ্যাটিং স্ক্রিন ওপেনার্স (Friends & Groups)
window.openFriendChatRoom = function(fid, title) {
  const chatId = [currentUser.serial, fid].sort().join('_');
  $('app').innerHTML = `
    <div class="screen active">
      <header><button onclick="showContact()" style="background:none;border:none;color:var(--accent);font-size:16px;cursor:pointer;">← Back</button><span>${title}</span></header>
      <div class="main-content" id="chatBox" style="height:calc(100vh - 160px); overflow-y:auto;"></div>
      <div style="position:fixed;bottom:0;left:0;right:0;max-width:600px;margin:0 auto;padding:10px;background:var(--card);display:flex;gap:8px;border-top:1px solid var(--border)">
        <input class="input" id="fInp" placeholder="বার্তা পাঠান..." style="margin:0"><button class="btn" style="width:auto; margin:0;" onclick="submitFriendMsgContact('${chatId}')">Send</button>
      </div>
    </div>
  `;
  onValue(ref(db, 'chats/' + chatId), snap => {
    let html = ''; if(snap.exists()) { Object.values(snap.val()).forEach(m => { let isMe = m.from === currentUser.serial; html += `<div style="text-align:${isMe?'right':'left'}; margin:8px;"><span><b>${isMe?'তুমি':'বন্ধু'}:</b> ${m.text}</span></div>`; }); }
    if($('chatBox')) { $('chatBox').innerHTML = html; $('chatBox').scrollTop = $('chatBox').scrollHeight; }
  });
}
window.submitFriendMsgContact = async function(chatId) {
  const t = $('fInp').value.trim(); if(!t) return;
  await push(ref(db, 'chats/' + chatId), { from: currentUser.serial, text: t, time: Date.now() });
  $('fInp').value = '';
}

window.openGroupChatRoom = function(gId, title) {
  $('app').innerHTML = `
    <div class="screen active">

function loadMCQFightArena() {
  onValue(ref(db, 'live_mcq_fight'), async snap => {
    const zone = $('mcqFightZone'); if(!zone) return;
    if(!snap.exists()) { zone.innerHTML = '<div class="card">বর্তমানে সিও প্যানেল থেকে কোনো লাইভ MCQ ফাইট দেওয়া হয়নি।</div>'; return; }
    
    const fight = snap.val();
    if(fight.expiryTimestamp && Date.now() > fight.expiryTimestamp) {
      zone.innerHTML = '<div class="card">এই ফাইটটির সময়সীমা শেষ হয়ে গেছে!</div>'; return;
    }

    // অলরেডি সাবমিটেড কিনা চেক
    const hasFought = localStorage.getItem(`mcq_fought_${fight.createdAt}`);
    if(hasFought) { zone.innerHTML = `<div class="card" style="color:var(--success)">তুমি এই MCQ ফাইটে উত্তর দিয়েছো! প্রাপ্তি লক করা হয়েছে।</div>`; return; }

    zone.innerHTML = `
      <div class="card" style="border: 2px solid var(--warning); background:var(--card);">
        <div style="float:right; font-weight:bold; color:var(--accent2);" id="fightTimer">15s</div>
        <strong>Question:</strong>
        <p style="font-size:16px; margin:8px 0; font-weight:bold;">${fight.question}</p>
        <div id="mcqFightOptions"></div>
      </div>
    `;

    fight.options.forEach(opt => {
      let b = document.createElement('button'); b.className = 'btn btn-secondary'; b.style.marginTop = "6px";
      b.textContent = opt.trim();
      b.onclick = () => submitMCQFightAnsLive(opt.trim(), fight.answer, fight.points || 10);
      $('mcqFightOptions').appendChild(b);
    });

    // ১৫ সেকেন্ডের কাউন্টডাউন টাইমার
    let timeLeft = 15;
    window.fightIntervalId = setInterval(() => {
      timeLeft--;
      if($('fightTimer')) $('fightTimer').textContent = timeLeft + "s";
      if(timeLeft <= 0) {
        clearInterval(window.fightIntervalId);
        localStorage.setItem(`mcq_fought_${fight.createdAt}`, "true");
        alert("⏱️ সময় শেষ! ১৫ সেকেন্ড অতিক্রম হয়ে গেছে।");
        loadMCQFightArena();
      }
    }, 1000);
  });
}
async function submitMCQFightAnsLive(userAns, correctAns, pts) {
  clearInterval(window.fightIntervalId);
  const snap = await get(ref(db, 'live_mcq_fight')); if(!snap.exists()) return;
  localStorage.setItem(`mcq_fought_${snap.val().createdAt}`, "true");

  let isCorrect = (userAns.toLowerCase().trim() === correctAns.toLowerCase().trim());
  if(isCorrect) {
    let uSnap = await get(ref(db, 'users/' + currentUser.serial));
    let newScore = (uSnap.val().score || 0) + parseInt(pts);
    await update(ref(db, 'users/' + currentUser.serial), { score: newScore });
    alert(`🎉 সঠিক উত্তর! তুমি প্লাস ${pts} স্কোর পেয়েছো।`);
  } else {
    alert("❌ ভুল উত্তর! কোনো স্কোর যোগ হলো না।");
  }
  loadMCQFightArena();
}

function renderGroupBattleCoreGameplay(session) {
  const p = $('battleCorePanel'); if(!p) return;
  // সিও লাইভ কন্ট্রোল ডিসিশন অপশন
  if(currentUser.isCO) {
    p.innerHTML = `
      <div style="background:#efebe9; padding:8px; border-radius:6px;">
        <h5 style="color:var(--warning);">👨‍⚖️ CO Judge Control Desk</h5>
        <p>Current Turn: <b>Group ${session.currentTurn}</b></p>
        <p>Question Posted: ${session.currentQuestion || 'Waiting...'}</p>
        <p>Answer Posted: ${session.currentAnswer || 'Waiting...'}</p>
        <div class="flex-actions">
          <button class="btn btn-success" onclick="coJudgeDecision(true)">Decision: RIGHT (ঠিক)</button>
          <button class="btn btn-danger" onclick="coJudgeDecision(false)">Decision: WRONG (ভুল)</button>
        </div>
      </div>
    `;
    return;
  }

  // মেম্বারদের জন্য অ্যাকশন স্ক্রিন
  let myGroup = "None";
  if(session.membersA && session.membersA[currentUser.serial]) myGroup = session.groupA;
  if(session.membersB && session.membersB[currentUser.serial]) myGroup = session.groupB;

  if(myGroup === "None") {
    p.innerHTML = `<p style="color:var(--muted); text-align:center;">তুমি এই খেলায় পার্টিসিপেট করা কোনো গ্রুপের মেম্বার নও। দর্শক হিসেবে লাইভ দেখছো।</p>`;
    return;
  }

  if(session.currentTurn === myGroup) {
    // প্রশ্ন করার পালা
    if(!session.currentQuestion) {
      p.innerHTML = `
        <h5>Your Group Turn: প্রশ্ন করো ✍️</h5>
        <input class="input" id="gQuestionInp" placeholder="টাইপ ইউর কোয়েশ্চেন...">
        <button class="btn btn-danger" onclick="submitGroupBattleQuestion('${myGroup}')">পাবলিশ প্রশ্ন</button>
      `;
    } else {
      p.innerHTML = `
        <p>তোমার গ্রুপ প্রশ্ন সাবমিট করেছে: <b>${session.currentQuestion}</b></p>
        <p>প্রতিপক্ষ উত্তর দেওয়ার পর আপনার সিদ্ধান্ত দিন:</p>
        <div class="flex-actions">
          <button class="btn btn-success" onclick="groupLeaderDecision(true)">ঠিক হয়েছে</button>
          <button class="btn btn-danger" onclick="groupLeaderDecision(false)">ভুল হয়েছে</button>
        </div>
      `;
    }
  } else {
    // উত্তর দেওয়ার পালা
    if(session.currentQuestion) {
      p.innerHTML = `
        <h5>💥 বিপক্ষ দলের প্রশ্ন:</h5>
        <p style="font-size:16px; font-weight:bold; color:var(--accent2);">${session.currentQuestion}</p>
        <input class="input" id="gAnswerInp" placeholder="উত্তর টাইপ করুন...">
        <button class="btn btn-success" onclick="submitGroupBattleAnswer('${myGroup}')">উত্তর দিন</button>
      `;
    } else {
      p.innerHTML = `<p style="text-align:center; color:var(--warning);">বিপক্ষ দল প্রশ্ন তৈরি করছে... অপেক্ষা করুন।</p>`;
    }
  }
}

// সিও ফাইনাল ইভালুয়েশন ইঞ্জিন লজিক
window.coJudgeDecision = async function(coRight) {
  const snap = await get(ref(db, 'group_battle_session')); if(!snap.exists()) return;
  const s = snap.val();
  
  let pA = s.pointsA || 0; let pB = s.pointsB || 0;
  let gRight = s.groupDecision === true;

  // প্রশ্নকর্তা দল A হলে উত্তরদাতা B
  if(s.currentTurn === s.groupA) {
    if(gRight && coRight) pB += 10;
    else if(!gRight && !coRight) pA += 10;
    else { pA -= 10; pB += 10; }
  } else { // টার্ন B হলে উত্তরদাতা A
    if(gRight && coRight) pA += 10;
    else if(!gRight && !coRight) pB += 10;
    else { pB -= 10; pA += 10; }
  }

  // অল্টারনেট টার্ন স্যুইচিং মেকানিজম
  let nextTurn = (s.currentTurn === s.groupA) ? s.groupB : s.groupA;
  await update(ref(db, 'group_battle_session'), {
    pointsA: pA, pointsB: pB, currentTurn: nextTurn,
    currentQuestion: null, currentAnswer: null, groupDecision: null
  });
  toast("পয়েন্ট হিসেব করে পরবর্তী রাউন্ড চালু করা হয়েছে!");
}

window.enterLiveBattleSession = async function(battleId) {

    } else { html += `<input class="input b-txt-ans" data-idx="${i}" placeholder="উত্তর লিখুন">`; }
    html += `</div>`;
  });
  html += `<button class="btn btn-danger" onclick="submitOldBattlePaper('${battleId}')">Submit Paper</button>`;
  $('app').innerHTML = `<div class="screen active"><header><button onclick="showBattle()" style="background:none;border:none;color:var(--accent);cursor:pointer;">← Cancel</button></header><div class="main-content">${html}</div></div>`;

window.submitOldBattlePaper = async function(battleId) {
  const snap = await get(ref(db, 'battles/' + battleId)); if(!snap.exists()) return;
  const b = snap.val(); let total = 0;
  b.questions.forEach((q, i) => {
    let ans = ""; if(q.type === 'mcq') { let r = document.querySelector(`input[name="bq_${i}"]:checked`); if(r) ans = r.value; }
    else { let inp = document.querySelector(`.b-txt-ans[data-idx="${i}"]`); if(inp) ans = inp.value.trim(); }
    let isCorrect = q.type === 'mcq' ? (ans.toLowerCase().trim() === q.answer.toLowerCase().trim()) : checkAnswerSmart(ans, q.answer);
    if(ans) total += isCorrect ? parseInt(q.points) : -parseInt(q.negative);
  });
  let uSnap = await get(ref(db, 'users/' + currentUser.serial));
  await update(ref(db, 'users/' + currentUser.serial), { score: (uSnap.val().score || 0) + total });
  alert(`পরীক্ষা সমাপ্ত! প্রাপ্ত নেট স্কোর পরিবর্তন: ${total}`); showBattle();
}

  loadDynamicContent('custom_games', 'gamesGrid', 'গেম');
}
window.showTools = function(){
  $('app').innerHTML = `<div class="screen active"><header><button onclick="renderHome()" style="background:none;border:none;color:var(--accent);font-size:16px;cursor:pointer;">← Back</button><span>Tools Box</span></header><div class="main-content"><div class="nav-grid" id="toolsGrid"></div></div></div>`;
  loadDynamicContent('custom_tools', 'toolsGrid', 'টুলস');
}
function loadDynamicContent(node, gridId, label){
  onValue(ref(db, node), snap=>{
    const grid = $(gridId); if(!grid) return; grid.innerHTML = '';
    if(snap.exists()){
      Object.entries(snap.val()).forEach(([id, item]) => {
        const btn = document.createElement('div'); btn.className = 'nav-btn';
        btn.innerHTML = `<div class="icon">${item.icon || '⚙️'}</div><div class="label">${item.name}</div>`;
        btn.onclick = () => { launchEngineDynamicSandbox(item.name, item.code); };
        grid.appendChild(btn);
      });
    } else grid.innerHTML = '<p>কোনো কনটেন্ট নেই।</p>';
  });
}
function launchEngineDynamicSandbox(title, codeString) {
  $('app').innerHTML = `
    <div class="screen active" style="background:#fff; min-height:100vh;">
      <header><button onclick="renderHome()" style="background:none;border:none;color:var(--accent);cursor:pointer;">← Exit Engine</button><strong>${title}</strong></header>
      <div id="sandboxArea" style="padding:10px;"></div>
    </div>
  `;
  $('sandboxArea').innerHTML = codeString;
}

window.showEvent = function(){ displayContentScreen('events', 'Events'); }
window.showKnowledge = function(){ displayContentScreen('knowledge', 'Knowledge Feed'); }

function displayContentScreen(type, title){
  $('app').innerHTML = `<div class="screen active"><header><button onclick="renderHome()" style="background:none;border:none;color:var(--accent);cursor:pointer;">← Back</button><span>${title}</span></header><div class="main-content" id="contentList"></div></div>`;
  onValue(ref(db, type), snap=>{
    let html = ''; if(snap.exists()){
      Object.entries(snap.val()).forEach(([id, c])=>{ html += `<div class="card"><h3>${c.title || c.name}</h3><p>${c.desc || c.text || ''}</p></div>`; });
    } else html = '<div class="card">কোনো ডেটা নেই।</div>';
    if($('contentList')) $('contentList').innerHTML = html;
  });
}

function updateNetworkStatus(){
  const dot = $('netDot'); if(!dot) return;
  window.addEventListener('online', ()=>dot.style.background='#4caf50');
  window.addEventListener('offline', ()=>dot.style.background='#f44336');
}
function loadScrollTagAndNotice(){
  onValue(ref(db, 'scroll_tag'), snap=>{ if(snap.exists() && $('noticeText')) $('noticeText').textContent = snap.val().text; });
  onValue(ref(db, 'notice_board'), snap=>{ if(snap.exists() && $('boardNoticeText')) $('boardNoticeText').textContent = snap.val().text; });
}

// --------------------- CO PANEL CONTROL SECTOR (বাটন ও লেআউট সিঙ্কড) ---------------------

      <div class="main-content">

          <div class="nav-btn" onclick="coAddDynamic('custom_games', 'Game')"><div class="icon">🎮</div><div class="label">Add Game</div></div>
          <div class="nav-btn" onclick="coAddDynamic('custom_tools', 'Tool')"><div class="icon">🛠️</div><div class="label">Add Tool</div></div>

          <div class="nav-btn" onclick="coAddContent()"><div class="icon">✍️</div><div class="label">Add Content</div></div>
          <div class="nav-btn" onclick="coShareLinkScreen()"><div class="icon">🔗</div><div class="label">Share URL Link</div></div>
        </div>

        <!-- সিও প্যানেলের জন্য স্পেশাল লাইভ ব্যাটেল অ্যাক্টিভেশন কন্ট্রোল -->
        <div class="card" style="margin-top:15px; border:2px dashed var(--accent2);">
          <h3 style="color:var(--accent2)">🔧 Live Battle Trigger Zone</h3>
          <button class="btn btn-warning" onclick="coDeployLiveMCQFightPrompt()">Deploy Live MCQ Fight</button>
          <hr style="margin:8px 0;">
          <input class="input" id="gAName" placeholder="Group A Name" style="margin-bottom:4px;">

          <div style="display:flex; gap:4px;">
            <button class="btn btn-success" style="margin:0;" onclick="coStartGroupBattleLive()">Start Group Battle</button>

// MCQ Fight ডিপ্লয়মেন্ট উইন্ডো
window.coDeployLiveMCQFightPrompt = function() {
  let q = prompt("MCQ প্রশ্নটি লিখুন:"); if(!q) return;
  let opts = prompt("অপশনসমূহ কমা (,) দিয়ে আলাদা করে লিখুন:"); if(!opts) return;
  let ans = prompt("সঠিক উত্তরটি হুবহু লিখুন:"); if(!ans) return;
  let hours = prompt("কত ঘন্টা পর এটি স্বয়ংক্রিয়ভাবে মুছে যাবে?"); if(!hours) return;

  let expiryTimestamp = Date.now() + (parseFloat(hours) * 60 * 60 * 1000);
  set(ref(db, 'live_mcq_fight'), {
    question: q, options: opts.split(','), answer: ans.trim(),
    expiryTimestamp, createdAt: Date.now(), points: 10
  });
  toast("লাইভ MCQ ফাইট ডিপ্লয় করা হয়েছে!");
}

// গ্রুপ ব্যাটেল লাইভ স্টার্টার কন্ট্রোল
window.coStartGroupBattleLive = async function() {
  const gA = $('gAName').value.trim(); const gB = $('gBName').value.trim();
  if(!gA || !gB) return toast("দুটো গ্রুপের নামই এন্টার করো!");
  
  // ডায়নামিক মেম্বার কালেকশন লজিক
  let memsA = {}; let memsB = {};
  let gSnap = await get(ref(db, 'groups'));
  if(gSnap.exists()) {
    Object.values(gSnap.val()).forEach(g => {
      if(g.name.toLowerCase() === gA.toLowerCase()) memsA = g.members || {};
      if(g.name.toLowerCase() === gB.toLowerCase()) memsB = g.members || {};
    });
  }

  await set(ref(db, 'group_battle_session'), {
    active: true, groupA: gA, groupB: gB, pointsA: 0, pointsB: 0,
    currentTurn: gA, stage: "questioning", membersA: memsA, membersB: memsB, createdAt: Date.now()
  });
  toast("গ্রুপ ব্যাটল ম্যাচ সেশন সফলভাবে শুরু হয়েছে!");
}
window.coStopGroupBattleLive = async function() {
  const snap = await get(ref(db, 'group_battle_session')); if(!snap.exists()) return;
  const s = snap.val();
  let winMsg = "Match Tied!";
  if(s.pointsA > s.pointsB) winMsg = `Winner: Group ${s.groupA}! +50 Score added to every member.`;
  else if(s.pointsB > s.pointsA) winMsg = `Winner: Group ${s.groupB}! +50 Score added to every member.`;

  // বিজয়ী দলের প্রত্যেক মেম্বারকে +৫০ পয়েন্ট ডিস্ট্রিবিউট করা
  let winGroupMembers = s.pointsA > s.pointsB ? s.membersA : (s.pointsB > s.pointsA ? s.membersB : {});
  for(let mId of Object.keys(winGroupMembers)) {
    let uRef = ref(db, `users/${mId}`); let uS = await get(uRef);
    if(uS.exists()) await update(uRef, { score: (uS.val().score || 0) + 50 });
  }

  await remove(ref(db, 'group_battle_session'));
  alert(`🛑 খেলা সমাপ্ত ঘোষণা করা হলো!\n\n${winMsg}`);
}

window.coAddDynamic = function(node, label) {
  let name = prompt(`Enter ${label} Name:`); let code = prompt("Enter Entire Engine HTML/JS Code String:");
  if(name && code) set(push(ref(db, node)), { name, code, createdAt: Date.now() });
}
window.coManageUsers = function() {
  $('app').innerHTML = `<div class="screen active"><header><button onclick="showCOPanel()" style="background:none;border:none;color:var(--accent);cursor:pointer;">← Back</button><h3>মেম্বার লিস্ট</h3></header><div class="main-content" id="usrsM"></div></div>`;
  get(ref(db, 'users')).then(snap => {
    let h = ''; snap.exists() && Object.entries(snap.val()).forEach(([serial, u]) => {
      h += `
        <div class="card">
          <b>${u.name}</b> (${serial}) | Score: ${u.score || 0}
          <div style="margin-top:4px;">
            <button class="score-control-btn" onclick="alterScoreLiveCO('${serial}', 1)">+1</button>
            <button class="score-control-btn" onclick="alterScoreLiveCO('${serial}', -1)">-1</button>
          </div>
        </div>
      `;
    });
    $('usrsM').innerHTML = h;
  });
}
window.alterScoreLiveCO = async function(serial, amt) {
  let uRef = ref(db, `users/${serial}`); let s = await get(uRef);
  if(s.exists()) await update(uRef, { score: (s.val().score || 0) + amt });
  window.coManageUsers();
}
