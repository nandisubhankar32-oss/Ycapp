<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>YourChoice - Ultimate Edition</title>
<style>
:root{ --bg:#f5f5f5; --card:#ffffff; --text:#1a1a1a; --accent:#0288d1; --accent2:#d32f2f; --muted:#757575; --border:#e0e0e0; --success:#388e3c; --warning:#f57c00; --new-badge:#4caf50; }
[data-theme="dark"] { --bg:#121212; --card:#1e1e1e; --text:#f5f5f5; --border:#333333; --muted:#aaaaaa; }
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-touch-callout:none;}
body{font-family:'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--text); transition:background 0.3s,color 0.3s; overflow-x:hidden;}
.allow-copy, .allow-copy *, #chatBox, #chatBox *, .literature-text, .literature-text *, .copyable, input, textarea, select { -webkit-user-select:text !important;-moz-user-select:text !important;-ms-user-select:text !important;user-select:text !important; }
.container{max-width:600px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);position: relative;}
header{background:var(--card); padding:12px 16px; border-bottom:1px solid var(--border); position:sticky;top:0;z-index:100; display: flex; flex-direction: column; gap: 6px;}
.header-top{display:flex;justify-content:space-between;align-items:center;}
.profile-info{display:flex;align-items:center;gap:10px;font-size:14px;flex-wrap:wrap;}
.profile-info .serial{color:var(--accent);font-weight:600}
.profile-info .score-tag{color:var(--success);font-weight:600}
.profile-info .status-tag{background:var(--accent);color:#fff;padding:2px 6px;border-radius:4px;font-size:11px;font-weight:bold;}
.profile-info .status-tag.co{background:var(--warning);}
.notice-ticker{background:var(--accent2); color:#fff; padding:6px 12px; font-size:13px; white-space:nowrap; overflow:hidden; border-radius:6px;}
.notice-ticker span{display:inline-block;padding-left:100%;animation:scroll 15s linear infinite}
@keyframes scroll{to{transform:translateX(-100%)}}
.main-content{flex:1;padding:16px;padding-bottom:100px}
.nav-grid{ display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px }
.nav-btn{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:20px 10px; text-align:center; cursor:pointer; position:relative;}
.nav-btn:active{transform:scale(0.95)}
.nav-btn .icon{font-size:28px;margin-bottom:6px}
.nav-btn .label{font-size:12px;color:var(--text);font-weight:500;}
.screen{display:none} .screen.active{display:block}
.card{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:12px; position: relative;}
.btn{background:var(--accent); color:#fff; border:none; padding:12px 20px; border-radius:8px; font-size:14px; cursor:pointer; width:100%; margin-top:8px; font-weight: 500; text-align: center;}
.btn-secondary{background:var(--muted)} .btn-danger{background:var(--accent2)} .btn-warning{background:var(--warning)} .btn-success{background:var(--success)}
.input{width:100%;padding:12px; background:var(--card); border:1px solid var(--border); border-radius:8px; color:var(--text); font-size:14px; margin-top:8px;}
textarea.input { resize: vertical; min-height: 80px; }
.bottom-nav{position:fixed;bottom:0;left:0;right:0; background:var(--card); border-top:1px solid var(--border); display:flex;justify-content:space-around; padding:8px 0; max-width: 600px; margin: 0 auto; z-index: 99;}
.bottom-nav-btn{background:none;border:none;color:var(--muted); font-size:12px;cursor:pointer;padding:4px 8px; font-weight: 500;}
.bottom-nav-btn.active{color:var(--accent)}
.brightness-overlay {position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0); pointer-events: none; z-index: 9998;}
.bluecut-overlay {position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 204, 0, 0.15); pointer-events: none; z-index: 9997; display:none;}
.switch-link{ display:block;text-align:center;margin-top:15px;color:var(--accent); font-size:13px;text-decoration:underline;cursor:pointer; }
.delete-inline-btn {position: absolute; top: 10px; right: 10px; background: var(--accent2); color: #fff; border: none; border-radius: 4px; padding: 4px 8px; font-size: 11px; cursor: pointer; z-index: 5;}
.score-control-btn {padding: 6px 10px; font-size: 12px; cursor: pointer; border-radius: 4px; border: 1px solid var(--border); background: var(--card); color: var(--text);}
.red-dot { position:absolute; top:5px; right:5px; width:10px; height:10px; background:red; border-radius:50%; display:none; }
.chat-container { display: flex; flex-direction: column; height: 350px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; margin-top: 10px; }
.chat-messages { flex: 1; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
.chat-input-area { display: flex; padding: 8px; gap: 6px; background: var(--card); border-top: 1px solid var(--border); }
.msg { max-width: 80%; padding: 8px 12px; border-radius: 8px; font-size: 13px; word-break: break-word; }
.msg.sent { background: var(--accent); color: #fff; align-self: flex-end; }
.msg.received { background: var(--card); color: var(--text); border: 1px solid var(--border); align-self: flex-start; }
</style>
</head>
<body>
<div class="bluecut-overlay" id="bluecutLayer"></div>
<div class="brightness-overlay" id="brightnessLayer"></div>
<div class="container" id="app"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getDatabase, ref, set, get, push, onValue, update, remove } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDbFaMS-WtEYho-rUG1b1YNnfcE44u3VXI",
  authDomain: "your-choice-4b2aa.firebaseapp.com",
  databaseURL: "https://your-choice-4b2aa-default-rtdb.firebaseio.com",
  projectId: "your-choice-4b2aa",
  storageBucket: "your-choice-4b2aa.firebasestorage.app",
  messagingSenderId: "287190219191",
  appId: "1:287190219191:web:71797e26ea4065f2521032"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let currentUser = null;
const STORAGE_KEY = "yourchoice_user";
let isMuted = localStorage.getItem('yc_muted') === 'true';
let isBlueCut = localStorage.getItem('yc_bluecut') === 'true';

function $(id){return document.getElementById(id)}
window.$ = $;

function toast(msg){
  let t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:10px 20px;border-radius:8px;z-index:1000;font-size:14px;box-shadow:0 4px 6px rgba(0,0,0,0.1);';
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2000);
}
window.toast = toast;

// --- SYSTEM INITIALIZATION & THEME ---
window.applySavedThemeAndBrightness = function() {
  document.documentElement.setAttribute("data-theme", localStorage.getItem("yc_theme") || "light");
  const opacity = (100 - parseInt(localStorage.getItem("yc_brightness") || "100")) / 100;
  if($('brightnessLayer')) $('brightnessLayer').style.backgroundColor = `rgba(0, 0, 0, ${opacity * 0.85})`;
  if($('bluecutLayer')) $('bluecutLayer').style.display = isBlueCut ? 'block' : 'none';
}
window.toggleDarkThemeLive = function() {
  const target = (document.documentElement.getAttribute("data-theme") || "light") === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", target); localStorage.setItem("yc_theme", target);
}
window.alterAppBrightnessLive = function(val) {
  localStorage.setItem("yc_brightness", val);
  if($('brightnessLayer')) $('brightnessLayer').style.backgroundColor = `rgba(0, 0, 0, ${(100 - parseInt(val)) / 100 * 0.85})`;
}
window.toggleBlueCut = function() {
  isBlueCut = !isBlueCut; localStorage.setItem('yc_bluecut', isBlueCut);
  if($('bluecutLayer')) $('bluecutLayer').style.display = isBlueCut ? 'block' : 'none';
}
window.toggleMute = function() {
  isMuted = !isMuted; localStorage.setItem('yc_muted', isMuted);
  toast(isMuted ? 'নোটিফিকেশন মিউট করা হলো' : 'নোটিফিকেশন চালু হলো');
  renderHome();
}

async function runAutoExpiryCheck(){
  const now = Date.now();
  const hundredDaysMs = 100 * 24 * 60 * 60 * 1000;
  const twentyDaysMs = 20 * 24 * 60 * 60 * 1000;

  ['chats', 'group_chats'].forEach(async (path) => {
    const snap = await get(ref(db, path));
    if(snap.exists()) {
      Object.entries(snap.val()).forEach(([id, messages]) => {
        Object.entries(messages).forEach(async ([mId, mData]) => {
          if(now - mData.time > hundredDaysMs) await remove(ref(db, `${path}/${id}/${mId}`));
        });
      });
    }
  });
  const coSnap = await get(ref(db, 'co_messages'));
  if(coSnap.exists()){
    Object.entries(coSnap.val()).forEach(([uId, messages]) => {
      Object.entries(messages).forEach(async ([mId, mData]) => {
         if(now - mData.time > twentyDaysMs) await remove(ref(db, `co_messages/${uId}/${mId}`));
      });
    });
  }
}

// --- AUTHENTICATION ---
function renderAuth(){
  $('app').innerHTML = `
    <div class="screen active" id="auth">
      <div class="card" style="margin-top:60px" id="authCard">
        <h2 style="text-align:center;margin-bottom:20px;color:var(--accent);">YourChoice</h2>
        <input type="text" class="input" id="name" placeholder="তোমার নাম">
        <input type="password" class="input" id="password" placeholder="একটি পাসওয়ার্ড তৈরি করো">
        <button class="btn" onclick="login()">Login / Register</button>
        <span class="switch-link" onclick="toggleAuthMode(true)">পুরনো অ্যাকাউন্ট রিকভার করো</span>
      </div>
    </div>
  `;
}
window.toggleAuthMode = function(isRecovery){
  if(isRecovery){
    $('authCard').innerHTML = `
      <h2 style="text-align:center;margin-bottom:20px;color:var(--accent);">Account Recovery</h2>
      <input type="text" class="input" id="recoverySerial" placeholder="Old Serial No (YC_XXXXXX)">
      <input type="password" class="input" id="recoveryPass" placeholder="Password">
      <button class="btn" onclick="recoverAccount()">Recover Account</button>
      <span class="switch-link" onclick="renderAuth()">নতুন অ্যাকাউন্ট তৈরি করো</span>
    `;
  }
}
window.login = async function(){
  const name = $('name').value.trim(); const password = $('password').value.trim();
  if(!name || !password) return toast('নাম এবং পাসওয়ার্ড দুটোই দেওয়া বাধ্যতামুলক!');
  toast('অ্যাকাউন্ট তৈরি হচ্ছে...');
  const generatedSerial = "YC_" + Array.from({length:6}, ()=>"ABCDEFGHJKLMNPQRSTUVWXYZ23456789".charAt(Math.floor(Math.random()*32))).join('');
  currentUser = { name, serial: generatedSerial, password, isCO: false, score: 0, createdAt: Date.now(), isBlocked: false };
  await set(ref(db, 'users/' + generatedSerial), currentUser);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(currentUser)); syncUserAndRender();
}
window.recoverAccount = async function(){
  const serial = $('recoverySerial').value.trim(); const password = $('recoveryPass').value.trim();
  if(!serial || !password) return toast('সিরিয়াল এবং পাসওয়ার্ড দাও');
  const snap = await get(ref(db, 'users/' + serial));
  if(snap.exists() && snap.val().password === password){
    currentUser = snap.val(); localStorage.setItem(STORAGE_KEY, JSON.stringify(currentUser)); syncUserAndRender();
  } else toast('ভুল তথ্য!');
}
async function syncUserAndRender() {
  if(!currentUser) return renderAuth();
  onValue(ref(db, 'users/' + currentUser.serial), snap => {
    if(snap.exists()) {
      currentUser = snap.val(); localStorage.setItem(STORAGE_KEY, JSON.stringify(currentUser));
      if(currentUser.isBlocked) return $('app').innerHTML = `<div class="screen active"><div class="card" style="margin-top:100px;text-align:center;color:red;"><h2>অ্যাকাউন্ট ব্লকড!</h2></div></div>`;
      renderHome();
    } else renderAuth();
  });
  applySavedThemeAndBrightness(); runAutoExpiryCheck(); listenToGlobalNotice();
}

function listenToGlobalNotice() {
  onValue(ref(db, 'global_scroll_notice'), snap => {
    if($('noticeText')) $('noticeText').textContent = snap.exists() ? snap.val() : "Welcome to YourChoice Application Arena!";
  });
}

// --- HOME SCREEN ---
window.renderHome = function(){
  const u = currentUser; if(!u) return;
  $('app').innerHTML = `
    <header>
      <div class="header-top">
        <div class="profile-info"><strong>${u.name}</strong> <span>S: ${u.serial}</span> <span class="score-tag">Score: ${u.score||0}</span> <span class="status-tag ${u.isCO?'co':''}">${u.isCO?'CO':'Member'}</span></div>
      </div>
      <div class="notice-ticker"><span id="noticeText">Loading notices...</span></div>
    </header>
    
    <div class="main-content">
      <div class="card">
        <h4 style="font-size:13px; margin-bottom:6px;">🌓 Display Settings & Sound</h4>
        <div style="display:flex; justify-content:space-between; align-items:center; gap:5px; flex-wrap:wrap;">
          <button class="btn btn-secondary" style="margin:0; padding:6px 10px; width:auto; font-size:11px;" onclick="toggleDarkThemeLive()">Dark Mode</button>
          <button class="btn btn-warning" style="margin:0; padding:6px 10px; width:auto; font-size:11px;" onclick="toggleBlueCut()">Blue-Cut 🟡</button>
          <button class="btn btn-danger" style="margin:0; padding:6px 10px; width:auto; font-size:11px;" onclick="toggleMute()">${isMuted ? 'Unmute 🔕' : 'Mute 🔔'}</button>
          <div style="display:flex; align-items:center; gap:6px;">
            <span style="font-size:11px;">🔆:</span><input type="range" min="15" max="100" value="${localStorage.getItem('yc_brightness')||100}" oninput="alterAppBrightnessLive(this.value)" style="width:70px;">
          </div>
        </div>
      </div>

      <div class="nav-grid">
        <div class="nav-btn" onclick="showQuest()"><div class="icon">📚</div><div class="label">1. Quest</div></div>
        <div class="nav-btn" onclick="showDynamicList('custom_games', 'Games')"><div class="icon">🎮</div><div class="label">2. Game</div></div>
        <div class="nav-btn" onclick="showDynamicList('applications', 'Applications')"><div class="icon">📄</div><div class="label">3. Application</div></div>
        <div class="nav-btn" onclick="showDynamicList('knowledge', 'Knowledge')"><div class="icon">🧠</div><div class="label">4. Knowledge</div></div>
        <div class="nav-btn" onclick="showDynamicList('literature', 'Literature')"><div class="icon">📖</div><div class="label">5. Literature</div></div>
        <div class="nav-btn" onclick="showContact()"><div class="icon">👥</div><div class="label">6. Contact</div></div>
        <div class="nav-btn" onclick="showDynamicList('notice', 'Notice Board')"><div class="icon">📌</div><div class="label">7. Notice board</div></div>
        <div class="nav-btn" onclick="showUserProfileScreen()"><div class="icon">👤</div><div class="label">9. Profile</div></div>
        <div class="nav-btn" onclick="showDynamicList('links', 'Important Links')"><div class="icon">🔗</div><div class="label">10. Link</div></div>
        <div class="nav-btn" onclick="showDynamicList('custom_tools', 'Tools')"><div class="icon">🛠️</div><div class="label">11. Tools</div></div>
        <div class="nav-btn" onclick="showBattle()"><div class="icon">⚔️</div><div class="label">Live Battle</div></div>
      </div>
    </div>
    
    <div class="bottom-nav">
      <button class="bottom-nav-btn active" onclick="renderHome()">Home</button>
      ${u.isCO ? `<button class="bottom-nav-btn" onclick="showCOPanel()">CO Panel</button>` : ''}
    </div>
  `;
}

// --- DYNAMIC CONTENT RENDERER (Universal Renderer for Lists) ---
window.showDynamicList = function(node, title) {
  $('app').innerHTML = `
    <div class="screen active">
      <header><button onclick="renderHome()" style="background:none;border:none;color:var(--accent);">← Back</button> <span>${title}</span></header>
      <div class="main-content" id="dynamicContentArea">Loading content...</div>
    </div>
  `;
  onValue(ref(db, node), snap => {
    let html = '';
    if(snap.exists()){
      Object.entries(snap.val()).forEach(([id, item]) => {
        html += `<div class="card ${node === 'literature' ? 'allow-copy literature-text' : 'copyable'}">
          <h3 style="color:var(--accent);">${item.title || 'No Title'}</h3>
          <p style="margin-top:6px; font-size:14px; white-space: pre-wrap;">${item.desc || item.content || ''}</p>
          ${item.url ? `<a class="btn" href="${item.url}" target="_blank" style="display:inline-block; text-decoration:none; margin-top:8px; text-align:center;">Open Link / Form</a>` : ''}
        </div>`;
      });
    }
    $('dynamicContentArea').innerHTML = html || `<p style="text-align:center;color:var(--muted);">কোনো তথ্য পাওয়া যায়নি।</p>`;
  });
}

// --- QUEST MODULE ---
window.showQuest = function() {
  $('app').innerHTML = `
    <div class="screen active">
      <header><button onclick="renderHome()" style="background:none;border:none;color:var(--accent);">← Back</button> <span>Quest Board</span></header>
      <div class="main-content" id="questArea">Loading Quests...</div>
    </div>
  `;
  onValue(ref(db, 'quests'), snap => {
    let html = '';
    if(snap.exists()){
      Object.entries(snap.val()).forEach(([id, q]) => {
        html += `<div class="card">
          <span class="status-tag" style="float:right; background:var(--warning);">Points: ${q.points || 10}</span>
          <h3>${q.title}</h3>
          <p style="margin:8px 0; font-size:14px;">${q.question}</p>
          <input type="text" class="input" id="ans_${id}" placeholder="তোমার উত্তরটি এখানে লেখো">
          <button class="btn btn-success" onclick="submitQuestAnswer('${id}', '${q.correctAnswer}', ${q.points || 10})">Submit Answer</button>
        </div>`;
      });
    }
    $('questArea').innerHTML = html || '<p style="text-align:center;">আপাতত কোনো কোয়েস্ট লাইভ নেই।</p>';
  });
}
window.submitQuestAnswer = async function(id, correctAns, points) {
  const userAns = $(`ans_${id}`).value.trim();
  if(!userAns) return toast('উত্তর ফাঁকা রাখা যাবে না!');
  if(userAns.toLowerCase() === correctAns.toLowerCase()) {
    const newScore = (currentUser.score || 0) + parseInt(points);
    await update(ref(db, `users/${currentUser.serial}`), { score: newScore });
    toast(`সঠিক উত্তর! আপনি পেয়েছেন ${points} পয়েন্ট।`);
    showQuest();
  } else {
    toast('ভুল উত্তর! আবার চেষ্টা করো।');
  }
}

// --- PROFILE & EXTRA SCREENS ---
window.showUserProfileScreen = function() {
  $('app').innerHTML = `
    <div class="screen active">
      <header><button onclick="renderHome()" style="background:none;border:none;color:var(--accent);">← Back</button> <span>My Profile</span></header>
      <div class="main-content">
        <div class="card" style="text-align:center;">
          <div style="font-size:50px;">👤</div>
          <h2>${currentUser.name}</h2>
          <p style="color:var(--muted); margin:4px 0;">Serial Number: ${currentUser.serial}</p>
          <div class="score-tag" style="font-size:20px; margin-top:10px;">Total Score: ${currentUser.score || 0}</div>
        </div>
        <button class="btn btn-danger" onclick="localStorage.removeItem('${STORAGE_KEY}'); location.reload();">Log Out Account</button>
      </div>
    </div>
  `;
}

// --- CONTACTS, NICKNAMES & GROUP SYSTEM ---
window.showContact = function(){
  $('app').innerHTML = `
    <div class="screen active">
      <header><button onclick="renderHome()" style="background:none;border:none;color:var(--accent);">← Back</button> <span>Contact Room</span> <button onclick="showFindFriend()" style="background:none;border:none;color:var(--accent);">+ Find Friend</button></header>
      <div class="main-content">
        <button class="btn btn-danger" style="margin-bottom:12px;" onclick="openCOChat()">📞 Emergency Chat with CO</button>
        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:center;"><h3>My Groups</h3><button class="btn btn-success" style="width:auto;margin:0;padding:4px 10px;font-size:12px;" onclick="createGroupUI()">+ Create Group</button></div>
          <div id="groupList" style="margin-top:10px;">Loading...</div>
        </div>
        <div class="card"><h3>Friends List</h3><div id="friendList" style="margin-top:10px;">Loading...</div></div>
        <div class="card"><h3>Friend Requests</h3><div id="reqList" style="margin-top:10px;">Loading...</div></div>
      </div>
    </div>
  `;
  loadFriendsList(); loadGroupList(); loadReqList();
}
async function loadFriendsList(){
  onValue(ref(db, 'friends/' + currentUser.serial), async snap => {
    let html = '';
    if(snap.exists()){
      const nickSnap = await get(ref(db, `user_nicknames/${currentUser.serial}`));
      const nicks = nickSnap.exists() ? nickSnap.val() : {};
      for(let fid of Object.keys(snap.val())) {
        const uSnap = await get(ref(db, 'users/' + fid));
        if(!uSnap.exists()) continue;
        let displayName = nicks[fid] || uSnap.val().name;
        html += `<div class="card" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;padding:10px;">
          <div onclick="openFriendChat('${fid}', '${displayName}')" style="cursor:pointer;flex:1;">👤 <b>${displayName}</b> <small style="color:var(--muted);">(${fid})</small></div>
          <button class="score-control-btn" onclick="setNickName('${fid}')">Rename</button>
        </div>`;
      }
    } else html = '<p style="color:var(--muted);">কোনো বন্ধু তালিকাভুক্ত নেই।</p>';
    if($('friendList')) $('friendList').innerHTML = html;
  });

  const snap = await get(ref(db, `users/${s}`));
  if(snap.exists()){
    let ns = (snap.val().score || 0) + amt;
    await update(ref(db, `users/${s}`), { score: ns }); toast('পয়েন্ট আপডেট হয়েছে');
    coManageMembers();
  }
}
window.blkUser = async function(s, status) {
  await update(ref(db, `users/${s}`), { isBlocked: status }); toast(status ? 'ইউজার ব্লকড!' : 'ইউজার আনব্লকড');
  coManageMembers();
}
window.delUser = async function(s) {
  if(confirm("অ্যাকাউন্টটি কি চিরতরে মুছে দিতে চান?")) {
     await remove(ref(db, `users/${s}`)); toast('ইউজার ডিলিট সম্পন্ন!');
     coManageMembers();
  }
}

window.coPromoteSys = function() {
  let target = prompt("যাকে CO বানাতে চান তার সঠিক Serial No দিন:");
  if(target) {
     update(ref(db, `users/${target}`), { isCO: true }).then(() => {
        toast('সফলভাবে CO পদে উন্নীত করা হয়েছে!');
     }).catch(() => toast('ত্রুটি! সিরিয়াল নম্বর পরীক্ষা করুন।'));
  }
}

window.coNukeSystem = async function() {
  if(confirm("🚨 চূড়ান্ত সতর্কবার্তা: এটি সমস্ত ডেটা এবং সমস্ত ইউজারের স্কোর শূন্য করে দেবে। করতে চান?")) {
    await remove(ref(db, 'quests'));
    const uSnap = await get(ref(db, 'users'));
    if(uSnap.exists()) {
      let updates = {};
      Object.keys(uSnap.val()).forEach(s => { updates[`users/${s}/score`] = 0; });
      await update(ref(db), updates);
    }
    toast('সিস্টেম সফলভাবে রিলিজ ও রিসেট করা হয়েছে!');
    showCOPanel();
  }
}

window.coSetupGroupBattleUI = function() {
  $('app').innerHTML = `
    <div class="screen active">
      <header><button onclick="showCOPanel()" style="background:none;border:none;color:var(--accent);">← Back</button> <span>Launch War Arena</span></header>
      <div class="main-content">
         <div class="card">
           <input class="input" id="co_gb_title" placeholder="Arena Title (Ex: Mega Sunday Clash)">
           <input class="input" id="co_gb_t1" placeholder="Team Blue Name">
           <input class="input" id="co_gb_t2" placeholder="Team Red Name">
           <button class="btn btn-danger" onclick="executeGroupBattleLaunch()">Initialize Warzone Arena</button>
         </div>
      </div>
    </div>
  `;
}
window.executeGroupBattleLaunch = async function() {
  const title = $('co_gb_title').value.trim();
  const t1 = $('co_gb_t1').value.trim() || 'Team A';
  const t2 = $('co_gb_t2').value.trim() || 'Team B';
  if(!title) return toast('শিরোনাম দাও');
  
  const bRef = push(ref(db, 'group_battles'));
  await set(bRef, { title, groupA_name: t1, groupB_name: t2, scoreA: 0, scoreB: 0, turn: 'Blue', phase: 'active', time: Date.now() });
  toast('গ্রুপ ব্যাটেল রুম রেডি!');
  showCOPanel();
}

window.coSetupMCQFightUI = function() {
  $('app').innerHTML = `
    <div class="screen active">
      <header><button onclick="showCOPanel()" style="background:none;border:none;color:var(--accent);">← Back</button> <span>Launch MCQ Battle</span></header>
      <div class="main-content">
         <div class="card">
           <input class="input" id="co_m_title" placeholder="Fight Title">
           <input class="input" id="co_m_q" placeholder="Enter Question">
           <input class="input" id="co_m_ans" placeholder="Correct Option Name Exactly">
           <input class="input" id="co_m_opts" placeholder="Options separated by commas (Ex: Red,Green,Blue,White)">
           <input class="input" id="co_m_hrs" placeholder="Active Duration (in hours)">
           <button class="btn btn-success" onclick="executeMCQFightLaunch()">Inject MCQ Fight Arena</button>
         </div>
      </div>
    </div>
  `;
}
window.executeMCQFightLaunch = async function() {
  const title = $('co_m_title').value.trim();
  const q = $('co_m_q').value.trim();
  const ans = $('co_m_ans').value.trim();
  const optsRaw = $('co_m_opts').value.trim();
  const hrs = parseFloat($('co_m_hrs').value.trim()) || 1;
  if(!title || !q || !ans || !optsRaw) return toast('সব তথ্য দাও');

  const fRef = push(ref(db, 'mcq_fights'));
  await set(fRef, { title, q, ans, opts: optsRaw.split(','), expiry: Date.now() + (hrs * 3600000) });
  toast('এমসিকিউ ফাইট লাইভ করা হয়েছে!');
  showCOPanel();
}

// --- INITIALIZER BOOTSTRAP ---
let initApp = async () => {
  const saved = localStorage.getItem(STORAGE_KEY);
  if(saved) {
    currentUser = JSON.parse(saved);
    syncUserAndRender();
  } else {
    renderAuth();
  }
};
initApp();
</script>
