<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
<link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png">
<title>YourChoice</title>
<style>
:root{
  --bg:#0a0a0a;
  --card:#1a1a1a;
  --text:#e0e0e0;
  --accent:#4fc3f7;
  --accent2:#ff6b6b;
  --muted:#666;
  --border:#2a2a2a;
}
[data-theme="light"]{
  --bg:#f5f5f5;
  --card:#ffffff;
  --text:#1a1a1a;
  --accent:#0288d1;
  --accent2:#d32f2f;
  --muted:#888;
  --border:#ddd;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none}
body{
  font-family:'Segoe UI',Roboto,sans-serif;
  background:var(--bg);
  color:var(--text);
  transition:background 0.3s,color 0.3s;
  overflow-x:hidden;
}
.container{max-width:600px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{
  background:var(--card);
  padding:12px 16px;
  border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:100;
}
.header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.profile-info{display:flex;align-items:center;gap:10px;font-size:14px}
.profile-info .serial{color:var(--accent);font-weight:600}
.profile-info .rank{color:var(--accent2);font-weight:600}
.network-dot{
  width:10px;height:10px;border-radius:50%;
  background:#4caf50;display:inline-block;
}
.network-dot.offline{background:#f44336}
.notice-ticker{
  background:var(--accent2);
  color:#fff;
  padding:6px 12px;
  font-size:13px;
  white-space:nowrap;
  overflow:hidden;
  border-radius:6px;
}
.notice-ticker span{display:inline-block;padding-left:100%;animation:scroll 15s linear infinite}
@keyframes scroll{to{transform:translateX(-100%)}}
.main-content{flex:1;padding:16px;padding-bottom:80px}
.nav-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px
}
.nav-btn{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:20px 10px;
  text-align:center;
  cursor:pointer;
  transition:transform 0.2s,border-color 0.2s;
}
.nav-btn:active{transform:scale(0.95)}
.nav-btn:hover{border-color:var(--accent)}
.nav-btn .icon{font-size:28px;margin-bottom:6px}
.nav-btn .label{font-size:12px;color:var(--text)}
.screen{display:none}
.screen.active{display:block}
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:16px;
  margin-bottom:12px;
}
.btn{
  background:var(--accent);
  color:#fff;
  border:none;
  padding:12px 20px;
  border-radius:8px;
  font-size:14px;
  cursor:pointer;
  width:100%;
  margin-top:8px;
}
.btn-secondary{background:var(--muted)}
.input{
  width:100%;padding:12px;
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:8px;
  color:var(--text);
  font-size:14px;
  margin-top:8px;
}
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--card);
  border-top:1px solid var(--border);
  display:flex;justify-content:space-around;
  padding:8px 0;
}
.bottom-nav-btn{
  background:none;border:none;color:var(--muted);
  font-size:11px;cursor:pointer;padding:4px 8px;
}
.bottom-nav-btn.active{color:var(--accent)}
.bluelight-filter{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(255,140,0,0.15);
  pointer-events:none;z-index:999;display:none;
}
.switch-link{
  display:block;text-align:center;margin-top:15px;color:var(--accent);
  font-size:13px;text-decoration:underline;cursor:pointer;
}
</style>
</head>
<body>
<div class="bluelight-filter" id="bluelight"></div>
<div class="container" id="app"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getDatabase, ref, set, get, push, onValue, update, remove, query, orderByChild, runTransaction } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js";

// ==== FIREBASE CONFIG ====
const firebaseConfig = {
  apiKey: "AIzaSyDbFaMS-WtEYho-rUG1b1YNnfcE44u3VXI",
  authDomain: "your-choice-4b2aa.firebaseapp.com",
  databaseURL: "https://your-choice-4b2aa-default-rtdb.firebaseio.com",
  projectId: "your-choice-4b2aa",
  storageBucket: "your-choice-4b2aa.firebasestorage.app",
  messagingSenderId: "287190219191",
  appId: "1:287190219191:web:71797e26ea4065f2521032",
  measurementId: "G-VDJQ2L7KH5"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

window.db = db; window.ref = ref; window.set = set; window.get = get; window.push = push; 
window.onValue = onValue; window.update = update; window.remove = remove; window.query = query; 
window.orderByChild = orderByChild; window.runTransaction = runTransaction;

let currentUser = null;
const STORAGE_KEY = "yourchoice_user";
const TAB_KEY = "yourchoice_tab_lock";

function $(id){return document.getElementById(id)}
window.$ = $;

function toast(msg){
  let t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:10px 20px;border-radius:8px;z-index:1000;font-size:14px';
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2000);
}
window.toast = toast;

function checkTabLock(){
  const tabId = sessionStorage.getItem(TAB_KEY) || Math.random().toString(36);
  sessionStorage.setItem(TAB_KEY, tabId);
  localStorage.setItem(TAB_KEY, tabId);
  window.addEventListener('storage', (e)=>{
    if(e.key === TAB_KEY && e.newValue !== tabId){
      alert('তুমি অন্য ট্যাবে লগইন করেছো। এই ট্যাব বন্ধ হয়ে যাবে।');
      window.close();
    }
  });
}

function checkBlueLight(){
  const hour = new Date().getHours();
  const filter = $('bluelight');
  if(filter) filter.style.display = (hour >= 18 || hour < 6) ? 'block' : 'none';
}

function isValidURL(url){
  try{ const u = new URL(url); return u.protocol === 'http:' || u.protocol === 'https:'; }catch{return false}
}

// ==== AUTH & ACCOUNT RECOVERY SYSTEM ====
function renderAuth(){
  $('app').innerHTML = `
    <div class="screen active" id="auth">
      <div class="card" style="margin-top:60px" id="authCard">
        <h2 style="text-align:center;margin-bottom:20px">YourChoice</h2>
        <input type="text" class="input" id="name" placeholder="তোমার নাম">
        <button class="btn" onclick="login()">Login / Register</button>
        <span class="switch-link" onclick="toggleAuthMode(true)">পুরনো অ্যাকাউন্ট রিকভার করো (Recovery)</span>
      </div>
    </div>
  `;
}

window.toggleAuthMode = function(isRecovery){
  const card = $('authCard');
  if(isRecovery){
    card.innerHTML = `
      <h2 style="text-align:center;margin-bottom:20px">Account Recovery</h2>
      <p style="font-size:12px; color:var(--muted); text-align:center; margin-bottom:10px;">তোমার পুরনো সিরিয়াল নাম্বারটি নিচে বসাও</p>
      <input type="text" class="input" id="recoverySerial" placeholder="Old Serial No">
      <button class="btn" onclick="recoverAccount()">Recover Account</button>
      <span class="switch-link" onclick="renderAuth()">নতুন অ্যাকাউন্ট তৈরি করো (Login)</span>
    `;
  }
}

window.login = async function(){
  const name = $('name').value.trim();
  if(!name){
    toast('নতুন অ্যাকাউন্ট তৈরির জন্য নাম অবশ্যই লিখতে হবে');
    return;
  }
  
  toast('অ্যাকাউন্ট তৈরি হচ্ছে...');
  try {
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789";
    let randomPart = "";
    for(let i = 0; i < 6; i++) {
      randomPart += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    
    const generatedSerial = "YC_" + randomPart;
    
    currentUser = {
      name: name, 
      serial: generatedSerial,
      isCO: false, score: 0, rank: 0,
      createdAt: Date.now(), lastActive: Date.now()
    };
    
    await set(ref(db, 'users/' + generatedSerial), currentUser);
    toast('রেজিস্ট্রেশন সফল হয়েছে!');
    
    localStorage.setItem(STORAGE_KEY, JSON.stringify(currentUser));
    renderHome();
    checkTabLock();
    checkBlueLight();
  } catch(e) {
    console.error(e);
    toast('কানেকশন এরর!');
  }
}

window.recoverAccount = async function(){
  const serial = $('recoverySerial').value.trim();
  if(!serial){
    toast('সিরিয়াল নাম্বার দেওয়া বাধ্যতামূলক');
    return;
  }
  
  toast('অ্যাকাউন্ট খোঁজা হচ্ছে...');
  try {
    const userRef = ref(db, 'users/' + serial);
    const snap = await get(userRef);
    
    if(snap.exists()){
      currentUser = snap.val();
      toast('স্বাগতম ফিরে আসার জন্য, ' + currentUser.name);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(currentUser));
      renderHome();
      checkTabLock();
      checkBlueLight();
    } else {
      toast('এই সিরিয়াল নাম্বারের কোনো অ্যাকাউন্ট পাওয়া যায়নি!');
    }
  } catch(e) {
    console.error(e);
    toast('কানেকশন এরর!');
  }
}

// ==== HOME SCREEN ====
function renderHome(){
  const u = currentUser;
  if(!u) return renderAuth();

  $('app').innerHTML = `
    <header>
      <div class="header-top">
        <div class="profile-info">
          <span>${u.name}</span>
          <span class="serial" title="ফায়ারবেস দ্বারা সংরক্ষিত সিরিয়াল">S:${u.serial}</span>
          <span class="rank">Rank:${u.rank || 0}</span>
        </div>
        <span class="network-dot" id="netDot"></span>
      </div>
      <div class="notice-ticker"><span id="noticeText">Welcome to YourChoice!</span></div>
    </header>
    
    <div class="main-content">
      <div class="nav-grid">
        <div class="nav-btn" onclick="showQuest()"><div class="icon">📚</div><div class="label">Quest</div></div>
        <div class="nav-btn" onclick="showContact()"><div class="icon">👥</div><div class="label">Contact</div></div>
        <div class="nav-btn" onclick="showBattle()"><div class="icon">⚔️</div><div class="label">Battle</div></div>
        <div class="nav-btn" onclick="showGames()"><div class="icon">🎮</div><div class="label">Games</div></div>
        <div class="nav-btn" onclick="showTools()"><div class="icon">🛠️</div><div class="label">Tools</div></div>
        <div class="nav-btn" onclick="showEvent()"><div class="icon">📅</div><div class="label">Event</div></div>
        <div class="nav-btn" onclick="showApp()"><div class="icon">📄</div><div class="label">Application</div></div>
        <div class="nav-btn" onclick="showKnowledge()"><div class="icon">🧠</div><div class="label">Knowledge</div></div>
        <div class="nav-btn" onclick="showLiterature()"><div class="icon">📖</div><div class="label">Literature</div></div>
      </div>
    </div>
    
    <div class="bottom-nav">
      <button class="bottom-nav-btn active" onclick="renderHome()">Home</button>
      <button class="bottom-nav-btn" onclick="showCOPanel()">CO Panel</button>
      <button class="bottom-nav-btn" onclick="logoutWithNotice()">Logout</button>
    </div>
  `;
  
  updateNetworkStatus();
  loadNotice();
  checkCOSetup();
}
window.renderHome = renderHome;

function updateNetworkStatus(){
  const dot = $('netDot');
  if(!dot) return;
  window.addEventListener('online', ()=>dot.classList.remove('offline'));
  window.addEventListener('offline', ()=>dot.classList.add('offline'));
  if(!navigator.onLine) dot.classList.add('offline');
}

function loadNotice(){
  onValue(ref(db, 'notice'), snap=>{
    const data = snap.val();
    const element = $('noticeText');
    if(data && element) element.textContent = data.text || 'Welcome!';
  });
}

// ==== QUEST SYSTEM ====
window.showQuest = function(){
  $('app').innerHTML = `
    <div class="screen active" id="quest">
      <header>
        <div class="header-top">
          <button onclick="renderHome()" style="background:none;border:none;color:var(--accent);font-size:16px">← Back</button>
          <span>Quest</span>
          <span></span>
        </div>
      </header>
      <div class="main-content" id="questList"></div>
    </div>
  `;
  loadQuests();
}

function loadQuests(){
  onValue(query(ref(db, 'quests'), orderByChild('createdAt')), snap=>{
    const data = snap.val();
    let html = '<div class="card"><h3>Available Quests</h3></div>';
    if(data){
      Object.entries(data).reverse().forEach(([id,q])=>{
        html += `
          <div class="card" onclick="startQuest('${id}')">
            <div style="font-size:12px;color:var(--muted)">${q.type.toUpperCase()}</div>
            <div style="margin:8px 0;font-weight:600">${q.type === 'picture' ? 'Picture Quest' : q.question}</div>
            <div style="font-size:12px;color:var(--accent)">+${q.points} points</div>
          </div>
        `;
      });
    }else{ html += '<div class="card">No quests yet!</div>'; }
    const qList = $('questList'); if(qList) qList.innerHTML = html;
  });
}

window.startQuest = async function(id){
  const snap = await get(ref(db, 'quests/' + id)); if(!snap.exists()) return;
  const q = snap.val();
  const ansSnap = await get(ref(db, 'quest_answers/' + currentUser.serial + '/' + id));
  const alreadyAnswered = ansSnap.exists();
  
  let contentHTML = '';
  if(q.type === 'picture'){
    contentHTML = isValidURL(q.question) ? `<img src="${q.question}" style="width:100%;max-height:300px;object-fit:contain;border-radius:8px;margin:10px 0">` : 'Invalid Image';
  }else{ contentHTML = `<h3 style="margin:10px 0">${q.question}</h3>`; }
  
  let answerHTML = '';
  if(alreadyAnswered){
    answerHTML = `<div class="card">Your Answer: ${ansSnap.val().answer} (Score: ${ansSnap.val().score})</div>`;
  }else{
    if(q.type === 'mcq'){
      q.options.forEach(opt=>{ answerHTML += `<button class="btn btn-secondary" style="margin-top:5px" onclick="submitQuestAnswer('${id}','${opt}')">${opt}</button>`; });
    }else if(q.type === 'break_hint'){
      answerHTML = `<div id="hintBox" style="color:var(--accent);font-size:12px"></div><input class="input" id="qAns" placeholder="Answer"><button class="btn" onclick="unlockBreakHint('${id}')">Hint (<span id="hintPoints">10</span> pts)</button><button class="btn" onclick="submitQuestAnswer('${id}',$('qAns').value)">Submit</button>`;
      window.hintStep = 0; window.hintList = q.hints ? q.hints.split('|') : [];
    }else{
      answerHTML = `<input class="input" id="qAns" placeholder="Type answer"><button class="btn" onclick="submitQuestAnswer('${id}',$('qAns').value)">Submit</button>`;
    }
  }
  $('app').innerHTML = `<div class="screen active"><header><button onclick="showQuest()" style="background:none;border:none;color:var(--accent)">← Back</button></header><div class="main-content"><div class="card">${contentHTML}${answerHTML}</div></div></div>`;
}

window.unlockBreakHint = function(id){
  if(window.hintStep >= 10) return toast('No more hints!');
  $('hintBox').innerHTML += `<div>Hint ${window.hintStep+1}: ${window.hintList[window.hintStep] || 'None'}</div>`;
  window.hintStep++;
}

window.submitQuestAnswer = async function(id, ans){
  const qSnap = await get(ref(db, 'quests/' + id)); const q = qSnap.val();
  let isCorrect = ans.toLowerCase().trim() === (q.coAnswer || q.answer || '').toLowerCase().trim();
  let score = isCorrect ? q.points : -5;
  await set(ref(db, 'quest_answers/' + currentUser.serial + '/' + id), { answer: ans, score: score });
  currentUser.score = (currentUser.score || 0) + score;
  await update(ref(db, 'users/' + currentUser.serial), { score: currentUser.score });
  localStorage.setItem(STORAGE_KEY, JSON.stringify(currentUser));
  toast(isCorrect ? 'Correct!' : 'Wrong!');
  showQuest();
}

// ==== CONTACT & CHAT SYSTEM ====
window.showContact = function(){
  $('app').innerHTML = `<div class="screen active"><header><button onclick="renderHome()" style="background:none;border:none;color:var(--accent)">← Back</button><span>Contact</span><button onclick="showFindUser()" style="background:none;border:none;color:var(--accent)">+ Add</button></header><div class="main-content"><div class="card"><h3>Friends</h3><div id="friendList"></div></div><div class="card"><h3>Requests</h3><div id="reqList"></div></div></div></div>`;
  loadFriends(); loadRequests();
}
function loadFriends(){
  onValue(ref(db, 'friends/' + currentUser.serial), snap=>{
    let html = ''; if(snap.exists()){ Object.keys(snap.val()).forEach(fid=>{ html += `<div class="card" onclick="openChat('${fid}')">👤 ${fid}</div>`; }); } else html = 'No friends';
    if($('friendList')) $('friendList').innerHTML = html;
  });
}
function loadRequests(){
  onValue(ref(db, 'requests/' + currentUser.serial), snap=>{
    let html = ''; if(snap.exists()){ Object.keys(snap.val()).forEach(from=>{ html += `<div class="card">${from} <button class="btn" style="width:auto;padding:4px 8px" onclick="acceptReq('${from}')">Accept</button></div>`; }); } else html = 'No requests';
    if($('reqList')) $('reqList').innerHTML = html;
  });
}
window.showFindUser = function(){
  $('app').innerHTML = `<div class="screen active"><header><button onclick="showContact()" style="background:none;border:none;color:var(--accent)">← Back</button></header><div class="main-content"><input class="input" id="findSerial" placeholder="Serial No"><button class="btn" onclick="sendFriendReq()">Add Friend</button></div></div>`;
}
window.sendFriendReq = async function(){
  const s = $('findSerial').value.trim(); if(!s || s===currentUser.serial) return toast('Invalid');
  await set(ref(db, 'requests/' + s + '/' + currentUser.serial), 'pending'); toast('Sent!'); showContact();
}
window.acceptReq = async function(from){
  await set(ref(db, 'friends/' + currentUser.serial + '/' + from), true);
  await set(ref(db, 'friends/' + from + '/' + currentUser.serial), true);
  await remove(ref(db, 'requests/' + currentUser.serial + '/' + from)); showContact();
}
window.openChat = function(fid){
  const chatId = [currentUser.serial, fid].sort().join('_');
  $('app').innerHTML = `<div class="screen active"><header><button onclick="showContact()" style="background:none;border:none;color:var(--accent)">← Back</button><span>${fid}</span></header><div class="main-content" id="chatBox" style="height:calc(100vh - 160px);overflow-y:auto"></div><div style="position:fixed;bottom:0;left:0;right:0;padding:10px;background:var(--card);display:flex;gap:8px"><input class="input" id="chatInput" placeholder="Message" style="margin:0"><button class="btn" onclick="sendMsg('${chatId}','${fid}')" style="width:auto;margin:0">Send</button></div></div>`;
  onValue(ref(db, 'chats/' + chatId), snap=>{
    let html = ''; if(snap.exists()){ Object.values(snap.val()).forEach(m=>{ html += `<div style="text-align:${m.from===currentUser.serial?'right':'left'};margin:5px"><span style="background:var(--border);padding:6px 12px;border-radius:8px;display:inline-block">${m.text}</span></div>`; }); }
    if($('chatBox')){ $('chatBox').innerHTML = html; $('chatBox').scrollTop = $('chatBox').scrollHeight; }
  });
}
window.sendMsg = async function(chatId, fid){
  const txt = $('chatInput').value.trim(); if(!txt) return;
  await push(ref(db, 'chats/' + chatId), { from: currentUser.serial, text: txt, time: Date.now() });
  $('chatInput').value = '';
}

// ==== BATTLE SYSTEM ====
window.showBattle = function(){
  $('app').innerHTML = `<div class="screen active"><header><button onclick="renderHome()" style="background:none;border:none;color:var(--accent)">← Back</button><span>Battle</span></header><div class="main-content"><div class="card">No Active Live Battles.</div></div></div>`;
}

// ==== DYNAMIC GAMES SYSTEM ====
window.showGames = function(){
  $('app').innerHTML = `
    <div class="screen active">
      <header><button onclick="renderHome()" style="background:none;border:none;color:var(--accent)">← Back</button><span>Games</span></header>
      <div class="main-content">
        <div class="nav-grid" id="gamesGrid"></div>
        <div id="gameArea" style="margin-top:20px"></div>
      </div>
    </div>
  `;
  loadDynamicContent('custom_games', 'gamesGrid');
}

// ==== DYNAMIC TOOLS SYSTEM ====
window.showTools = function(){
  $('app').innerHTML = `
    <div class="screen active">
      <header><button onclick="renderHome()" style="background:none;border:none;color:var(--accent)">← Back</button><span>Tools</span></header>
      <div class="main-content">
        <div class="nav-grid" id="toolsGrid"></div>
        <div id="toolArea" style="margin-top:20px"></div>
      </div>
    </div>
  `;
  loadDynamicContent('custom_tools', 'toolsGrid');
}

function loadDynamicContent(node, gridId){
  get(ref(db, node)).then(snap=>{
    const grid = $(gridId);
    if(!grid) return;
    
    if(snap.exists()){
      grid.innerHTML = ''; 
      Object.entries(snap.val()).forEach(([id, item])=>{
        const btn = document.createElement('div');
        btn.className = 'nav-btn';
        btn.innerHTML = `<div class="icon">${item.icon || '⚙️'}</div><div class="label">${item.name}</div>`;
        btn.onclick = () => { try { eval(item.code); } catch(e) { alert('কোডে ভুল আছে: ' + e.message); } };
        grid.appendChild(btn);
      });
    } else {
      grid.innerHTML = '<div style="color:var(--muted); font-size:14px; grid-column: span 3; text-align:center; padding: 20px;">কোনো কন্টেন্ট নেই। CO প্যানেল থেকে অ্যাড করুন।</div>';
    }
  });
}

// ==== KNOWLEDGE, LITERATURE, EVENTS ====
window.showEvent = function(){ displayContentScreen('events', 'Events'); }
window.showApp = function(){ displayContentScreen('applications', 'Applications'); }
window.showKnowledge = function(){ displayContentScreen('knowledge', 'Knowledge'); }
window.showLiterature = function(){ displayContentScreen('literature', 'Literature'); }

function displayContentScreen(type, title){
  $('app').innerHTML = `<div class="screen active"><header><button onclick="renderHome()" style="background:none;border:none;color:var(--accent)">← Back</button><span>${title}</span></header><div class="main-content" id="contentList">Loading...</div></div>`;
  onValue(ref(db, type), snap=>{
    let html = ''; if(snap.exists()){ Object.values(snap.val()).forEach(c=>{ html += `<div class="card"><h3>${c.title}</h3><p>${c.desc}</p></div>`; }); } else html = 'No data';
    if($('contentList')) $('contentList').innerHTML = html;
  });
}

// ==== CO PANEL SYSTEM ====
window.showCOPanel = function(){
  if(!currentUser?.isCO) return toast('Only CO can access');
  $('app').innerHTML = `
    <div class="screen active">
      <header><button onclick="renderHome()" style="background:none;border:none;color:var(--accent)">← Back</button><span>CO Panel</span></header>
      <div class="main-content">
        <div class="nav-grid">
          <div class="nav-btn" onclick="coAddQuest()"><div class="icon">📚</div><div class="label">Add Quest</div></div>
          <div class="nav-btn" onclick="coAddDynamic('custom_games', 'Game')"><div class="icon">🎮</div><div class="label">Add Custom Game</div></div>
          <div class="nav-btn" onclick="coAddDynamic('custom_tools', 'Tool')"><div class="icon">🛠️</div><div class="label">Add Custom Tool</div></div>
          <div class="nav-btn" onclick="coAddApplication()"><div class="icon">📄</div><div class="label">Add Application</div></div>
          <div class="nav-btn" onclick="coManageUsers()"><div class="icon">👥</div><div class="label">Manage Users</div></div>
        </div>
      </div>
    </div>
  `;
}

window.coAddQuest = function(){
  $('app').innerHTML = `
    <div class="screen active">
      <header><button onclick="showCOPanel()" style="background:none;border:none;color:var(--accent)">← Back</button><span>Add Quest</span></header>
      <div class="main-content">
        <select class="input" id="qType"><option value="mcq">MCQ</option><option value="vsaq">VSAQ</option><option value="break_hint">Break Hint</option><option value="picture">Picture URL</option></select>
        <input class="input" id="qQ" placeholder="Question/URL"><input class="input" id="qCoAns" placeholder="Answer"><input class="input" id="qOpt" placeholder="Options (comma separated)"><input class="input" id="qPoints" type="number" value="10">
        <button class="btn" onclick="saveQuest()">Save Quest</button>
      </div>
    </div>
  `;
}
window.saveQuest = async function(){
  await push(ref(db, 'quests'), { type:$('qType').value, question:$('qQ').value, coAnswer:$('qCoAns').value, options:$('qOpt').value.split(','), points:parseInt($('qPoints').value), createdAt:Date.now() });
  toast('Quest Added!'); showCOPanel();
}

window.coAddDynamic = function(node, label){
  $('app').innerHTML = `
    <div class="screen active">
      <header><button onclick="showCOPanel()" style="background:none;border:none;color:var(--accent)">← Back</button><span>Add Custom ${label}</span></header>
      <div class="main-content">
        <input class="input" id="dynName" placeholder="${label} Name">
        <input class="input" id="dynIcon" placeholder="Emoji Icon (🧩 বা 🔧)">
        <textarea class="input" id="dynCode" rows="8" placeholder="JavaScript Code লিখুন" style="height:150px; font-family:monospace;"></textarea>
        <button class="btn" onclick="saveDynamic('${node}')">Publish ${label}</button>
      </div>
    </div>
  `;
}

window.saveDynamic = async function(node){
  const name = $('dynName').value.trim();
  const icon = $('dynIcon').value.trim();
  const code = $('dynCode').value.trim();
  if(!name || !code) return toast('নাম এবং কোড দুটোই দিতে হবে');
  
  await push(ref(db, node), { name, icon, code, createdAt: Date.now() });
  toast('লাইভ পাবলিশ হয়েছে!');
  showCOPanel();
}

window.coAddApplication = function(){
  $('app').innerHTML = `
    <div class="screen active">
      <header><button onclick="showCOPanel()" style="background:none;border:none;color:var(--accent)">← Back</button><span>Add Application</span></header>
      <div class="main-content">
        <input class="input" id="appTitle" placeholder="অ্যাপ্লিকেশনের শিরোনাম (Title)">
        <textarea class="input" id="appDesc" rows="6" placeholder="বিস্তারিত বিবরণ বা নোটিশ (Description)" style="height:120px; color:var(--text); background:var(--bg); border:1px solid var(--border); border-radius:8px; width:100%; padding:12px; margin-top:8px; font-family:inherit; font-size:14px;"></textarea>
        <button class="btn" onclick="saveApplication()">Publish Application</button>
      </div>
    </div>
  `;
}

window.saveApplication = async function(){
  const title = $('appTitle').value.trim();
  const desc = $('appDesc').value.trim();
  if(!title || !desc) return toast('শিরোনাম এবং বিবরণ দুটোই লিখতে হবে');
  
  await push(ref(db, 'applications'), { title, desc, createdAt: Date.now() });
  toast('অ্যাপ্লিকেশন সফলভাবে পাবলিশ হয়েছে!');
  showCOPanel();
}

window.coManageUsers = async function(){
  const snap = await get(ref(db,'users')); let html = '';
  if(snap.exists()){ Object.entries(snap.val()).forEach(([s,u])=>{ html += `<div class="card">${u.name} (S:${s}) <button class="btn" style="width:auto;padding:4px 8px" onclick="deleteUser('${s}')">Delete</button></div>`; }); }
  $('app').innerHTML = `<div class="screen active"><header><button onclick="showCOPanel()" style="background:none;border:none;color:var(--accent)">← Back</button></header><div class="main-content">${html}</div></div>`;
}
window.deleteUser = async function(s){ if(confirm('Delete?')){ await remove(ref(db,'users/'+s)); coManageUsers(); } }

// ==== SECURITY & CO SETUP ====
async function checkCOSetup(){
  const snap = await get(ref(db,'users')); let hasCO = snap.exists() && Object.values(snap.val()).some(u=>u.isCO);
  if(!hasCO && currentUser){
    let div = document.createElement('div'); div.className='card'; div.innerHTML=`<h3>Claim CO</h3><input type="password" class="input" id="coPass"><button class="btn" onclick="claimCO()">Claim</button>`;
    const mc = document.querySelector('.main-content'); if(mc) mc.appendChild(div);
  }
}
window.claimCO = async function(){
  if($('coPass').value === 'SNANDI2009'){
    await update(ref(db,'users/'+currentUser.serial),{isCO:true}); currentUser.isCO = true;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(currentUser)); toast('You are CO!'); renderHome();
  } else toast('Wrong!');
}

// ==== LOGOUT WITH NOTICE ====
window.logoutWithNotice = function(){
  const confirmLogout = confirm("⚠️ তুমি কি নিশ্চিত যে লগআউট করতে চাও?\n\nলগআউট করলে এই ডিভাইস থেকে তোমার চ্যানেল/অ্যাকাউন্ট সাময়িকভাবে ডিলিট হয়ে যাবে! পরবর্তীতে ফিরে আসতে চাইলে তোমার Serial No দিয়ে Recovery করতে হবে।");
  if(confirmLogout){
    localStorage.removeItem(STORAGE_KEY); 
    sessionStorage.removeItem(TAB_KEY); 
    currentUser = null; 
    renderAuth();
    toast('সফলভাবে লগআউট করা হয়েছে!');
  }
}

// ==== INITIALIZE APP ====
const localUser = localStorage.getItem(STORAGE_KEY);
if(localUser){
  currentUser = JSON.parse(localUser);
  renderHome();
  checkTabLock();
  checkBlueLight();
} else {
  renderAuth();
}
</script>
</body>
</html>
