<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>YourChoice</title>
<style>
:root{ --bg:#f5f5f5; --card:#ffffff; --text:#1a1a1a; --accent:#0288d1; --accent2:#d32f2f; --muted:#757575; --border:#e0e0e0; --success:#388e3c; --warning:#f57c00; --new-badge:#4caf50; }
[data-theme="dark"] { --bg:#121212; --card:#1e1e1e; --text:#f5f5f5; --border:#333333; --muted:#aaaaaa; }
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-touch-callout:none;}
body{font-family:'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--text); transition:background 0.3s,color 0.3s; overflow-x:hidden;}
.allow-copy, .allow-copy *, #chatBox, #chatBox *, .literature-text, .literature-text *, .copyable, input, textarea, select { -webkit-user-select:text !important;-moz-user-select:text !important;-ms-user-select:text !important;user-select:text !important; }
.container{max-width:600px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);position: relative;}
header{background:var(--card); padding:12px 16px; border-bottom:1px solid var(--border); position:sticky;top:0;z-index:100;}
.header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.profile-info{display:flex;align-items:center;gap:10px;font-size:14px;flex-wrap:wrap;}
.profile-info .serial{color:var(--accent);font-weight:600}
.profile-info .score-tag{color:var(--success);font-weight:600}
.profile-info .status-tag{background:var(--accent);color:#fff;padding:2px 6px;border-radius:4px;font-size:11px;font-weight:bold;}
.profile-info .status-tag.co{background:var(--warning);}
.network-dot{ width:10px;height:10px;border-radius:50%; background:#4caf50;display:inline-block;}
.network-dot.offline{background:#f44336}
.notice-ticker{background:var(--accent2); color:#fff; padding:6px 12px; font-size:13px; white-space:nowrap; overflow:hidden; border-radius:6px;}
.notice-ticker span{display:inline-block;padding-left:100%;animation:scroll 15s linear infinite}
@keyframes scroll{to{transform:translateX(-100%)}}
.main-content{flex:1;padding:16px;padding-bottom:100px}
.nav-grid{ display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px }
.nav-btn{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:20px 10px; text-align:center; cursor:pointer; position:relative;}
.nav-btn:active{transform:scale(0.95)}
.nav-btn .icon{font-size:28px;margin-bottom:6px}
.nav-btn .label{font-size:12px;color:var(--text);font-weight:500;}
.screen{display:none} .screen.active{display:block}
.card{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:12px; position: relative;}
.btn{background:var(--accent); color:#fff; border:none; padding:12px 20px; border-radius:8px; font-size:14px; cursor:pointer; width:100%; margin-top:8px; font-weight: 500;}
.btn-secondary{background:var(--muted)} .btn-danger{background:var(--accent2)} .btn-warning{background:var(--warning)} .btn-success{background:var(--success)}
.input{width:100%;padding:12px; background:var(--card); border:1px solid var(--border); border-radius:8px; color:var(--text); font-size:14px; margin-top:8px;}
textarea.input { resize: vertical; }
.bottom-nav{position:fixed;bottom:0;left:0;right:0; background:var(--card); border-top:1px solid var(--border); display:flex;justify-content:space-around; padding:8px 0; max-width: 600px; margin: 0 auto; z-index: 99;}
.bottom-nav-btn{background:none;border:none;color:var(--muted); font-size:12px;cursor:pointer;padding:4px 8px; font-weight: 500;}
.bottom-nav-btn.active{color:var(--accent)}
.bluelight-filter{position:fixed;top:0;left:0;right:0;bottom:0; background:rgba(255,140,0,0.1); pointer-events:none;z-index:999;display:none;}
.brightness-overlay {position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0); pointer-events: none; z-index: 9998;}
.bluecut-overlay {position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 204, 0, 0.15); pointer-events: none; z-index: 9997; display:none;}
.switch-link{ display:block;text-align:center;margin-top:15px;color:var(--accent); font-size:13px;text-decoration:underline;cursor:pointer; }
.delete-inline-btn {position: absolute; top: 10px; right: 10px; background: var(--accent2); color: #fff; border: none; border-radius: 4px; padding: 4px 8px; font-size: 11px; cursor: pointer; z-index: 5;}
.score-control-btn {padding: 4px 8px; font-size: 11px; cursor: pointer; border-radius: 4px; border: 1px solid var(--border);}
.red-dot { position:absolute; top:-5px; right:-5px; width:12px; height:12px; background:red; border-radius:50%; display:none; }
.green-dot { display:inline-block; width:10px; height:10px; background:var(--new-badge); border-radius:50%; margin-left:5px; }
.new-badge { background:var(--new-badge); color:#fff; font-size:10px; padding:2px 4px; border-radius:4px; margin-left:5px; vertical-align:middle; }
</style>
</head>
<body>
<div class="bluelight-filter" id="bluelight"></div>
<div class="bluecut-overlay" id="bluecutLayer"></div>
<div class="brightness-overlay" id="brightnessLayer"></div>
<div class="container" id="app"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getDatabase, ref, set, get, push, onValue, update, remove, query, orderByChild } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDbFaMS-WtEYho-rUG1b1YNnfcE44u3VXI",
  authDomain: "your-choice-4b2aa.firebaseapp.com",
  databaseURL: "https://your-choice-4b2aa-default-rtdb.firebaseio.com",
  projectId: "your-choice-4b2aa",
  storageBucket: "your-choice-4b2aa.firebasestorage.app",
  messagingSenderId: "287190219191",
  appId: "1:287190219191:web:71797e26ea4065f2521032"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let currentUser = null;
const STORAGE_KEY = "yourchoice_user";
let isMuted = localStorage.getItem('yc_muted') === 'true';
let isBlueCut = localStorage.getItem('yc_bluecut') === 'true';

function $(id){return document.getElementById(id)}
window.$ = $;

function toast(msg){
  let t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:10px 20px;border-radius:8px;z-index:1000;font-size:14px;box-shadow:0 4px 6px rgba(0,0,0,0.1);';
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2000);
}
window.toast = toast;

function notify(title, body) {
  if (isMuted) return;
  if (Notification.permission === "granted") {
    new Notification(title, { body: body });
  } else if (Notification.permission !== "denied") {
    Notification.requestPermission().then(permission => {
      if (permission === "granted") new Notification(title, { body: body });
    });
  }
}

// Enter Key Logic (Newline instead of submit unless intended)
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    if(e.target.tagName === 'TEXTAREA') {
      // Allow default newline behavior in textarea
      e.stopPropagation();
    }
  }
}, true);

// Display Settings
window.applySavedThemeAndBrightness = function() {
  document.documentElement.setAttribute("data-theme", localStorage.getItem("yc_theme") || "light");
  const opacity = (100 - parseInt(localStorage.getItem("yc_brightness") || "100")) / 100;
  if($('brightnessLayer')) $('brightnessLayer').style.backgroundColor = `rgba(0, 0, 0, ${opacity * 0.85})`;
  if($('bluecutLayer')) $('bluecutLayer').style.display = isBlueCut ? 'block' : 'none';
}
window.toggleDarkThemeLive = function() {
  const target = (document.documentElement.getAttribute("data-theme") || "light") === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", target); localStorage.setItem("yc_theme", target);
}
window.alterAppBrightnessLive = function(val) {
  localStorage.setItem("yc_brightness", val);
  if($('brightnessLayer')) $('brightnessLayer').style.backgroundColor = `rgba(0, 0, 0, ${(100 - parseInt(val)) / 100 * 0.85})`;
}
window.toggleBlueCut = function() {
  isBlueCut = !isBlueCut; localStorage.setItem('yc_bluecut', isBlueCut);
  if($('bluecutLayer')) $('bluecutLayer').style.display = isBlueCut ? 'block' : 'none';
}
window.toggleMute = function() {
  isMuted = !isMuted; localStorage.setItem('yc_muted', isMuted);
  toast(isMuted ? 'নোটিফিকেশন মিউট করা হলো' : 'নোটিফিকেশন চালু হলো');
  renderHome();
}

// Auto Expiry Check (Chats and general items)
async function runAutoExpiryCheck(){
  const now = Date.now();
  const todayStr = new Date().toISOString().split('T')[0];
  
  // 100 days for general chats, 20 days for CO chat
  const hundredDaysMs = 100 * 24 * 60 * 60 * 1000;
  const twentyDaysMs = 20 * 24 * 60 * 60 * 1000;

  ['chats', 'group_chats'].forEach(async (path) => {
    const snap = await get(ref(db, path));
    if(snap.exists()) {
      Object.entries(snap.val()).forEach(async ([id, messages]) => {
        Object.entries(messages).forEach(async ([mId, mData]) => {
          if(now - mData.time > hundredDaysMs) await remove(ref(db, `${path}/${id}/${mId}`));
        });
      });
    }
  });

  const coSnap = await get(ref(db, 'co_messages'));
  if(coSnap.exists()){
    Object.entries(coSnap.val()).forEach(async ([uId, messages]) => {
      Object.entries(messages).forEach(async ([mId, mData]) => {
         if(now - mData.time > twentyDaysMs) await remove(ref(db, `co_messages/${uId}/${mId}`));
      });
    });
  }
}

// Authentication 
function renderAuth(){
  $('app').innerHTML = `
    <div class="screen active" id="auth">
      <div class="card" style="margin-top:60px" id="authCard">
        <h2 style="text-align:center;margin-bottom:20px;color:var(--accent);">YourChoice</h2>
        <input type="text" class="input" id="name" placeholder="তোমার নাম">
        <input type="password" class="input" id="password" placeholder="একটি পাসওয়ার্ড তৈরি করো">
        <button class="btn" onclick="login()">Login / Register</button>
        <span class="switch-link" onclick="toggleAuthMode(true)">পুরনো অ্যাকাউন্ট রিকভার করো</span>
      </div>
    </div>
  `;
}
window.toggleAuthMode = function(isRecovery){
  if(isRecovery){
    $('authCard').innerHTML = `
      <h2 style="text-align:center;margin-bottom:20px;color:var(--accent);">Account Recovery</h2>
      <input type="text" class="input" id="recoverySerial" placeholder="Old Serial No (YC_XXXXXX)">
      <input type="password" class="input" id="recoveryPass" placeholder="Password">
      <button class="btn" onclick="recoverAccount()">Recover Account</button>
      <span class="switch-link" onclick="renderAuth()">নতুন অ্যাকাউন্ট তৈরি করো</span>
    `;
  }
}

window.login = async function(){
  const name = $('name').value.trim(); const password = $('password').value.trim();
  if(!name || !password) return toast('নাম এবং পাসওয়ার্ড দুটোই দেওয়া বাধ্যতামুলক!');
  toast('অ্যাকাউন্ট তৈরি হচ্ছে...');
  const generatedSerial = "YC_" + Array.from({length:6}, ()=>"ABCDEFGHJKLMNPQRSTUVWXYZ23456789".charAt(Math.floor(Math.random()*32))).join('');
  currentUser = { name, serial: generatedSerial, password, isCO: false, score: 0, createdAt: Date.now(), isBlocked: false };
  await set(ref(db, 'users/' + generatedSerial), currentUser);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(currentUser)); syncUserAndRender();
}

window.recoverAccount = async function(){
  const serial = $('recoverySerial').value.trim(); const password = $('recoveryPass').value.trim();
  if(!serial || !password) return toast('সিরিয়াল এবং পাসওয়ার্ড দাও');
  const snap = await get(ref(db, 'users/' + serial));
  if(snap.exists() && snap.val().password === password){
    currentUser = snap.val(); localStorage.setItem(STORAGE_KEY, JSON.stringify(currentUser)); syncUserAndRender();
  } else toast('ভুল তথ্য!');
}

async function syncUserAndRender() {
  if(!currentUser) return renderAuth();
  onValue(ref(db, 'users/' + currentUser.serial), snap => {
    if(snap.exists()) {
      currentUser = snap.val(); localStorage.setItem(STORAGE_KEY, JSON.stringify(currentUser));
      if(currentUser.isBlocked) return $('app').innerHTML = `<div class="screen active"><div class="card" style="margin-top:100px;text-align:center;color:red;"><h2>অ্যাকাউন্ট ব্লকড!</h2></div></div>`;
      renderHome();
    } else renderAuth();
  });
  applySavedThemeAndBrightness(); runAutoExpiryCheck();
}

// ---------------- HOME PAGE ----------------
window.renderHome = function(){
  const u = currentUser; if(!u) return;
  $('app').innerHTML = `
    <header>
      <div class="header-top">
        <div class="profile-info"><strong>${u.name}</strong> <span>S: ${u.serial}</span> <span class="score-tag">Score: ${u.score||0}</span> <span class="status-tag ${u.isCO?'co':''}">${u.isCO?'CO':'Member'}</span></div>
      </div>
      <div class="notice-ticker"><span id="noticeText">Welcome!</span></div>
    </header>
    
    <div class="main-content">
      <div class="card">
        <h4 style="font-size:13px; margin-bottom:6px;">🌓 Display Settings & Sound</h4>
        <div style="display:flex; justify-content:space-between; align-items:center; gap:5px; flex-wrap:wrap;">
          <button class="btn btn-secondary" style="margin:0; padding:6px 10px; width:auto; font-size:11px;" onclick="toggleDarkThemeLive()">Dark Mode</button>
          <button class="btn btn-warning" style="margin:0; padding:6px 10px; width:auto; font-size:11px;" onclick="toggleBlueCut()">Blue-Cut 🟡</button>
          <button class="btn btn-danger" style="margin:0; padding:6px 10px; width:auto; font-size:11px;" onclick="toggleMute()">${isMuted ? 'Unmute 🔕' : 'Mute 🔔'}</button>
          <div style="display:flex; align-items:center; gap:6px;">
            <span style="font-size:11px;">🔆:</span><input type="range" min="15" max="100" value="${localStorage.getItem('yc_brightness')||100}" oninput="alterAppBrightnessLive(this.value)" style="width:70px;">
          </div>
        </div>
      </div>

      <div class="nav-grid">
        <div class="nav-btn" onclick="showQuest()"><div class="red-dot" id="dot_quest"></div><div class="icon">📚</div><div class="label">1. Quest</div></div>
        <div class="nav-btn" onclick="showDynamicList('custom_games', 'Games')"><div class="icon">🎮</div><div class="label">2. Game</div></div>
        <div class="nav-btn" onclick="showApp()"><div class="icon">📄</div><div class="label">3. Application</div></div>
        <div class="nav-btn" onclick="showDynamicList('knowledge', 'Knowledge')"><div class="icon">🧠</div><div class="label">4. Knowledge</div></div>
        <div class="nav-btn" onclick="showDynamicList('literature', 'Literature')"><div class="icon">📖</div><div class="label">5. Literature</div></div>
        <div class="nav-btn" onclick="showContact()"><div class="red-dot" id="dot_contact"></div><div class="icon">👥</div><div class="label">6. Contact</div></div>
        <div class="nav-btn" onclick="showDynamicList('notice', 'Notice Board')"><div class="icon">📌</div><div class="label">7. Notice board</div></div>
        <div class="nav-btn" onclick="showUserProfileScreen()"><div class="icon">👤</div><div class="label">9. Profile</div></div>
        <div class="nav-btn" onclick="showLinksScreen()"><div class="icon">🔗</div><div class="label">10. Link</div></div>
        <div class="nav-btn" onclick="showDynamicList('custom_tools', 'Tools')"><div class="icon">🛠️</div><div class="label">11. Tools</div></div>
        <div class="nav-btn" onclick="showBattle()"><div class="red-dot" id="dot_battle"></div><div class="icon">⚔️</div><div class="label">Live Battle</div></div>
      </div>
    </div>
    
    <div class="bottom-nav">
      <button class="bottom-nav-btn active" onclick="renderHome()">Home</button>
      ${u.isCO ? `<button class="bottom-nav-btn" onclick="showCOPanel()">CO Panel</button>` : ''}
    </div>
  `;
}

// ---------------- CONTACT SYSTEM (Friends, Groups, Co-Leaders) ----------------
window.showContact = function(){
  $('app').innerHTML = `
    <div class="screen active">
      <header><button onclick="renderHome()" style="background:none;border:none;color:var(--accent);">← Back</button> <span>Contact</span> <button onclick="showFindFriend()" style="background:none;border:none;color:var(--accent);">+ Find</button></header>
      <div class="main-content">
        <button class="btn btn-danger" onclick="openCOChat()">📞 Contact CO</button>
        <div class="card">
          <div style="display:flex; justify-content:space-between;"><h3>Groups</h3><button class="btn btn-success" style="width:auto;margin:0;padding:4px 8px;font-size:12px;" onclick="createGroupUI()">+ Create</button></div>
          <div id="groupList">Loading...</div>
        </div>
        <div class="card"><h3>Friends</h3><div id="friendList">Loading...</div></div>
        <div class="card"><h3>Requests</h3><div id="reqList">Loading...</div></div>
      </div>
    </div>
  `;
  loadFriendsList(); loadGroupList(); loadReqList();
}

// Friend Nicknames System added
async function loadFriendsList(){
  onValue(ref(db, 'friends/' + currentUser.serial), async snap => {
    let html = '';
    if(snap.exists()){
      const nickSnap = await get(ref(db, `user_nicknames/${currentUser.serial}`));
      const nicks = nickSnap.exists() ? nickSnap.val() : {};
      
      for(let fid of Object.keys(snap.val())) {
        const uSnap = await get(ref(db, 'users/' + fid));
        if(!uSnap.exists()) continue;
        let displayName = nicks[fid] || uSnap.val().name; // Use custom name if set
        html += `<div class="card" style="display:flex;justify-content:space-between;align-items:center;">
          <div onclick="openFriendChat('${fid}', '${displayName}')" style="cursor:pointer;flex:1;">👤 <b>${displayName}</b></div>
          <button class="btn btn-secondary" style="width:auto;padding:4px 8px;margin:0;font-size:11px;" onclick="setNickName('${fid}')">Set Name</button>
        </div>`;
      }
    } else html = '<p>No friends yet.</p>';
    if($('friendList')) $('friendList').innerHTML = html;
  });
}

window.setNickName = async function(fid) {
  let customName = prompt("বন্ধুর জন্য তোমার পছন্দের নাম দাও (এটি শুধু তুমি দেখতে পাবে):");
  if(customName && customName.trim() !== "") {
    await set(ref(db, `user_nicknames/${currentUser.serial}/${fid}`), customName.trim());
    toast('নাম সেট হয়েছে!'); loadFriendsList();
  }
}

// Group Leader / Co-Leader System
window.createGroupUI = function(){
  let gName = prompt("গ্রুপের নাম কী হবে?");
  if(gName){
    const newGroupRef = push(ref(db, 'groups'));
    set(newGroupRef, { name: gName, creator: currentUser.serial, members: { [currentUser.serial]: 'leader' }});
    toast('Group Created!');
  }
}

function loadGroupList(){
  onValue(ref(db, 'groups'), snap => {
    let html = '';
    if(snap.exists()){
      Object.entries(snap.val()).forEach(([gId, gData]) => {
        if(gData.members && gData.members[currentUser.serial]){
          let role = gData.members[currentUser.serial];
          html += `<div class="card">
            <div onclick="openGroupChat('${gId}','${gData.name}','${role}')" style="cursor:pointer;">💬 <b>${gData.name}</b> <small>(${role})</small></div>
            ${role === 'leader' ? `<button class="delete-inline-btn" onclick="deleteGroup('${gId}')">Delete Group</button>` : ''}
          </div>`;
        }
      });
    }
    if($('groupList')) $('groupList').innerHTML = html || '<p>No groups.</p>';
  });
}

window.deleteGroup = async function(gId) {
  if(confirm("সত্যিই গ্রুপ ডিলিট করতে চাও?")) {
    await remove(ref(db, 'groups/' + gId));
    await remove(ref(db, 'group_chats/' + gId));
    toast('Group deleted!');
  }
}

// Find Friends (Search by name or serial)
window.showFindFriend = function(){
  $('app').innerHTML = `<div class="screen active"><header><button onclick="showContact()" style="background:none;border:none;color:var(--accent);">← Back</button> <span>Find Users</span></header><div class="main-content"><input class="input" id="searchUser" placeholder="Search Name or Serial..." oninput="doSearchUser()"><div id="sResult" style="margin-top:15px;"></div></div></div>`;
}
window.doSearchUser = async function(){
  const q = $('searchUser').value.trim().toLowerCase();
  const snap = await get(ref(db, 'users'));
  let html = '';
  if(snap.exists()){
    Object.entries(snap.val()).forEach(([serial, u])=>{
      if(serial !== currentUser.serial && (u.name.toLowerCase().includes(q) || serial.toLowerCase().includes(q))){
        html += `<div class="card" style="display:flex;justify-content:space-between;"><div>${u.name}<br><small>${serial}</small></div><button class="btn" style="width:auto;margin:0;padding:6px;" onclick="sendReq('${serial}')">Send Request</button></div>`;
      }
    });
  }
  $('sResult').innerHTML = html;
}
window.sendReq = async function(target){ await set(ref(db, `requests/${target}/${currentUser.serial}`), true); toast('Request Sent!'); }
function loadReqList(){
  onValue(ref(db, `requests/${currentUser.serial}`), async snap => {
    let html=''; if(snap.exists()){
      for(let fid of Object.keys(snap.val())){
        const u = (await get(ref(db, `users/${fid}`))).val();
        if(u) html += `<div class="card">${u.name} <button class="btn btn-success" style="width:auto;padding:4px;" onclick="acceptReq('${fid}')">Accept</button></div>`;
      }
    }
    if($('reqList')) $('reqList').innerHTML = html || 'No requests';
  });
}
window.acceptReq = async function(fid) {
  await set(ref(db, `friends/${currentUser.serial}/${fid}`), true);
  await set(ref(db, `friends/${fid}/${currentUser.serial}`), true);
  await remove(ref(db, `requests/${currentUser.serial}/${fid}`));
  toast('Accepted!');
}

// ---------------- LIVE BATTLE (Players, MCQ Fight, Group Battle) ----------------
window.showBattle = function() {
  $('app').innerHTML = `
    <div class="screen active">
      <header><button onclick="renderHome()" style="background:none;border:none;color:var(--accent);">← Back</button> <span>Live Battle Menu</span></header>
      <div class="main-content">
        <button class="btn" onclick="openPlayersBattle()">1. Players Battle (Classic)</button>
        <button class="btn btn-warning" onclick="openMCQFight()">2. MCQ Fight (Time Attack)</button>
        <button class="btn btn-success" onclick="openGroupBattle()">3. Group Battle (Contact Groups)</button>
      </div>
    </div>
  `;
}

window.openMCQFight = function() {
  $('app').innerHTML = `<div class="screen active"><header><button onclick="showBattle()" style="background:none;border:none;color:var(--accent);">← Back</button> <span>MCQ Fight</span></header><div class="main-content" id="mcqList">Loading Live MCQs...</div></div>`;
  onValue(ref(db, 'mcq_fights'), snap => {
    let html = '';
    if(snap.exists()){
      Object.entries(snap.val()).forEach(([id, b]) => {
         // Check expiry
         if(Date.now() > b.expiry) return;
         html += `<div class="card"><h3>${b.title}</h3><p>15s per question!</p><button class="btn btn-danger" onclick="startMCQSession('${id}')">Start Fight</button></div>`;
      });
    }
    $('mcqList').innerHTML = html || 'No active MCQ fights.';
  });
}

// Group Battle Logic (Complex)
window.openGroupBattle = function() {
  $('app').innerHTML = `<div class="screen active"><header><button onclick="showBattle()" style="background:none;border:none;color:var(--accent);">← Back</button> <span>Group Battle Arena</span></header><div class="main-content" id="gbList">Loading Arenas...</div></div>`;
  onValue(ref(db, 'group_battles'), snap => {
    let html = '';
    if(snap.exists()){
      Object.entries(snap.val()).forEach(([id, gb]) => {
        html += `<div class="card" style="border:2px solid var(--accent2)">
          <h3>${gb.title}</h3>
          <p>Group A: ${gb.groupA_name || 'Waiting...'} | Group B: ${gb.groupB_name || 'Waiting...'}</p>
          <p>Score A: ${gb.scoreA} | Score B: ${gb.scoreB}</p>
          <button class="btn btn-warning" onclick="enterGBArena('${id}')">Enter Arena</button>
        </div>`;
      });
    }
    $('gbList').innerHTML = html || '<p>সিও এখনো কোনো গ্রুপ ব্যাটেল শুরু করেনি।</p>';
  });
}

window.enterGBArena = async function(gbId) {
  // Join logic and view logic for Group Battle (highly condensed due to limits)
  const snap = await get(ref(db, `group_battles/${gbId}`)); if(!snap.exists()) return;
  const gb = snap.val();
  
  $('app').innerHTML = `
    <div class="screen active" style="background:#e8f5e9;">
      <header><button onclick="openGroupBattle()" style="background:none;border:none;color:var(--accent);">← Exit Arena</button> <span>Arena: ${gb.title}</span></header>
      <div class="main-content">
        <div class="card" style="text-align:center;">
           <h3>${gb.groupA_name || 'Team A'} vs ${gb.groupB_name || 'Team B'}</h3>
           <h2>${gb.scoreA} - ${gb.scoreB}</h2>
           <p style="color:var(--accent2);font-weight:bold;">Current Turn: Team ${gb.turn}</p>
        </div>
        <div id="gbActionArea" class="card">
           <textarea class="input" id="gbInput" placeholder="Type Question / Answer here..."></textarea>
           <button class="btn" onclick="submitGBAction('${gbId}')">Submit</button>
        </div>
        <div class="card"><h4>Arena Chat</h4><div id="gbChatBox"></div></div>
      </div>
    </div>
  `;
}

// ---------------- CO PANEL ----------------
window.showCOPanel = function(){
  if(!currentUser?.isCO) return;
  $('app').innerHTML = `
    <div class="screen active">
      <header><button onclick="renderHome()" style="background:none;border:none;color:var(--accent);">← Home</button> <span>CO Control Panel</span></header>
      <div class="main-content">
        <div class="nav-grid" style="grid-template-columns: repeat(2, 1fr);">
          <button class="btn" onclick="uiCoAddDynamic('quests','Add Quest Type')">1. Add Quest</button>
          <button class="btn" onclick="uiCoAddDynamic('custom_games','Add Game')">2. Add Game</button>
          <button class="btn" onclick="uiCoAddDynamic('custom_tools','Add Tool')">3. Add Tool</button>
          <button class="btn" onclick="uiCoAddDynamic('knowledge','Add Knowledge')">4. Add Knowledge</button>
          <button class="btn" onclick="uiCoAddDynamic('literature','Add Literature')">5. Add Literature</button>
          <button class="btn" onclick="uiCoAddDynamic('applications','Add App Form')">6. Add App Form</button>
          <button class="btn btn-warning" onclick="coManageMembers()">7. Manage Members</button>
          <button class="btn btn-warning" onclick="coPromote()">8. Promote CO</button>
          <button class="btn btn-success" onclick="uiCoAddNotice()">9. Add Notice</button>
          <button class="btn btn-success" onclick="uiCoAddLink()">10. Add Link</button>
          <button class="btn btn-danger" onclick="uiCoAddRedTag()">11. Add Red Tag (Scroll)</button>
          <button class="btn btn-danger" onclick="coNukeSystem()">12. Reset All Scores/Quests</button>
          <button class="btn" onclick="coSearchProfile()">13. Search Profile</button>
          <button class="btn" onclick="coAddQuestType()">14. Add Quest Type (Custom)</button>
          <button class="btn btn-warning" style="grid-column: span 2;" onclick="coStartGroupBattle()">Start Group Battle Session</button>
          <button class="btn btn-warning" style="grid-column: span 2;" onclick="coStartMCQFight()">Start MCQ Fight</button>
        </div>
      </div>
    </div>
  `;
}

// CO Panel Actions
window.coManageMembers = async function() {
  const snap = await get(ref(db, 'users'));
  let html = '';
  if(snap.exists()){
    Object.entries(snap.val()).forEach(([serial, u]) => {
      html += `<div class="card">
        <strong>${u.name}</strong> (${serial}) - Score: ${u.score}
        <div style="display:flex; gap:4px; flex-wrap:wrap; margin-top:8px;">
          <button class="score-control-btn" onclick="adjScr('${serial}',1)">+1</button>
          <button class="score-control-btn" onclick="adjScr('${serial}',5)">+5</button>
          <button class="score-control-btn" onclick="adjScr('${serial}',10)">+10</button>
          <button class="score-control-btn" onclick="adjScr('${serial}',25)">+25</button>
          <button class="score-control-btn" onclick="adjScr('${serial}',-1)">-1</button>
          <button class="score-control-btn" onclick="adjScr('${serial}',-5)">-5</button>
          <button class="score-control-btn" onclick="adjScr('${serial}',-10)">-10</button>
          <button class="score-control-btn" onclick="adjScr('${serial}',-25)">-25</button>
        </div>
        <div style="margin-top:8px;">
           <button class="btn btn-secondary" style="width:auto;padding:4px;" onclick="msgUser('${serial}')">Message</button>
           <button class="btn btn-warning" style="width:auto;padding:4px;" onclick="blkUser('${serial}', ${!u.isBlocked})">${u.isBlocked?'Unblock':'Block'}</button>
           <button class="btn btn-danger" style="width:auto;padding:4px;" onclick="delUser('${serial}')">Delete</button>
        </div>
      </div>`;
    });
  }
  $('app').innerHTML = `<div class="screen active"><header><button onclick="showCOPanel()" style="background:none;border:none;color:var(--accent);">← Back</button></header><div class="main-content">${html}</div></div>`;
}

window.adjScr = async function(s, amt) {
  const snap = await get(ref(db, `users/${s}`));
  if(snap.exists()){
    let ns = (snap.val().score || 0) + amt;
    await update(ref(db, `users/${s}`), {score: ns}); toast('Score updated');
    coManageMembers();
  }
}

window.coNukeSystem = async function() {
  if(confirm("সতর্কতা: সমস্ত ইউজারের স্কোর 0 হবে এবং সব Quest মুছে যাবে! তুমি কি নিশ্চিত?")) {
    await remove(ref(db, 'quests'));
    const uSnap = await get(ref(db, 'users'));
    if(uSnap.exists()) {
      let updates = {};
      Object.keys(uSnap.val()).forEach(s => { updates[`users/${s}/score`] = 0; });
      await update(ref(db), updates);
    }
    toast('System Nuked!');
  }
}

window.coStartGroupBattle = async function() {
  let title = prompt("Group Battle Title:");
  if(title) {
    await push(ref(db, 'group_battles'), { title: title, scoreA: 0, scoreB: 0, turn: 'A', phase: 'join' });
    toast('Battle Started! Groups can join now.');
  }
}

window.coStartMCQFight = async function() {
  let raw = prompt("Format: Q|Ans|Opt1,Opt2|Hrs\nEx: Sky color?|Blue|Red,Blue,Green|2");
  if(raw) {
    let p = raw.split('|');
    await push(ref(db, 'mcq_fights'), { title: "MCQ Time Attack", q: p[0], ans: p[1], opts: p[2].split(','), expiry: Date.now() + (parseInt(p[3])*3600000) });
    toast('MCQ Fight Live!');
  }
}

// Initial Auth Hook
let initApp = async () => {
  const saved = localStorage.getItem(STORAGE_KEY);
  if(saved) {
    currentUser = JSON.parse(saved);
    syncUserAndRender();
  } else {
    renderAuth();
  }
};
initApp();
</script>
