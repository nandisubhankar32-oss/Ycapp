function toast(msg){
  let t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:10px 20px;border-radius:8px;z-index:10000;font-size:14px;box-shadow:0 4px 6px rgba(0,0,0,0.1);';

// নোটিফিকেশন মেকানিজম
function triggerNotification(title, body) {
  if (isMuted) return;
  if (Notification.permission === "granted") {
    new Notification(title, { body });

}

// গ্লোবাল এন্টার কি ম্যানেজমেন্ট (টেক্সট এরিয়া বা ইনপুটে এন্টার মারলে নতুন লাইন হবে, সাবমিট হবে না)
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
      e.stopPropagation();
    }
  }
}, true);

function checkTabLock(){
  const tabId = sessionStorage.getItem(TAB_KEY) || Math.random().toString(36);
  sessionStorage.setItem(TAB_KEY, tabId);
  localStorage.setItem(TAB_KEY, tabId);
  window.addEventListener('storage', (e)=>{
    if(e.key === TAB_KEY && e.newValue !== tabId){
      alert('তুমি অন্য ট্যাবে লগইন করেছো। এই ট্যাব বন্ধ হয়ে যাবে।');
      window.close();
    }
  });
}

function applySavedThemeAndBrightness() {
  const savedTheme = localStorage.getItem("yc_theme") || "light";
  document.documentElement.setAttribute("data-theme", savedTheme);
  
  const savedVal = localStorage.getItem("yc_brightness") || "100";
  const opacity = (100 - parseInt(savedVal)) / 100;
  if($('brightnessLayer')) $('brightnessLayer').style.backgroundColor = `rgba(0, 0, 0, ${opacity * 0.85})`;

  const bc = localStorage.getItem("yc_bluecut") || "false";
  if(bc === "true") {
    document.body.classList.add("bluecut-active");
  } else {
    document.body.classList.remove("bluecut-active");
  }
}

// লেভেনস্টাইন স্মার্ট ইভালুয়েশন
function getLevenshteinDistance(a, b) {
  if (a.length === 0) return b.length; if (b.length === 0) return a.length;
  const matrix = [];
  for (let i = 0; i <= b.length; i++) { matrix[i] = [i]; }
  for (let j = 0; j <= a.length; j++) { matrix[0][j] = j; }
  for (let i = 1; i <= b.length; i++) {
    for (let j = 1; j <= a.length; j++) {
      if (b.charAt(i - 1) === a.charAt(j - 1)) matrix[i][j] = matrix[i - 1][j - 1];
      else matrix[i][j] = Math.min(matrix[i - 1][j - 1] + 1, Math.min(matrix[i][j - 1] + 1, matrix[i - 1][j] + 1));
    }
  }
  return matrix[b.length][a.length];
}

function checkAnswerSmart(userAns, correctAns) {
  if (!userAns || !correctAns) return false;
  let u = userAns.toLowerCase().trim().replace(/[\s.,\/#!$%\^&\*;:{}=\-_`~()]/g,"");
  let c = correctAns.toLowerCase().trim().replace(/[\s.,\/#!$%\^&\*;:{}=\-_`~()]/g,"");
  if (u === c) return true;
  let maxLen = Math.max(u.length, c.length); if (maxLen === 0) return false;
  return ((maxLen - getLevenshteinDistance(u, c)) / maxLen) >= 0.78;
}

// চ্যাট ডিলিট লজিক (সিও প্যানেল ২০ দিন, বাকি সব ১০০ দিন)
async function cleanOldChats() {
  const now = Date.now();
  const coExpiry = 20 * 24 * 60 * 60 * 1000;
  const generalExpiry = 100 * 24 * 60 * 60 * 1000;

  // CO Chats
  const coSnap = await get(ref(db, 'co_messages'));
  if (coSnap.exists()) {
    Object.entries(coSnap.val()).forEach(([userId, msgs]) => {
      Object.entries(msgs).forEach(([msgId, m]) => {
        if (m.time && (now - m.time) > coExpiry) remove(ref(db, `co_messages/${userId}/${msgId}`));
      });
    });
  }
  // Personal Chats
  const personalSnap = await get(ref(db, 'chats'));
  if (personalSnap.exists()) {
    Object.entries(personalSnap.val()).forEach(([chatId, msgs]) => {
      Object.entries(msgs).forEach(([msgId, m]) => {
        if (m.time && (now - m.time) > generalExpiry) remove(ref(db, `chats/${chatId}/${msgId}`));
      });
    });
  }
  // Group Chats
  const groupSnap = await get(ref(db, 'group_chats'));
  if (groupSnap.exists()) {
    Object.entries(groupSnap.val()).forEach(([gId, msgs]) => {
      Object.entries(msgs).forEach(([msgId, m]) => {
        if (m.time && (now - m.time) > generalExpiry) remove(ref(db, `group_chats/${gId}/${msgId}`));
      });
    });
  }
}

  const saved = localStorage.getItem(STORAGE_KEY);
  if(saved) {
    currentUser = JSON.parse(saved);
    syncUserAndRender();
  } else {
    renderAuth();
  }
});

    <div class="screen active" style="padding:20px;">
      <div class="card" style="margin-top:60px">
        <h2 style="text-align:center;margin-bottom:20px;color:var(--accent);">YourChoice Pro</h2>
        <input type="text" class="input" id="name" placeholder="তোমার নাম">
        <input type="password" class="input" id="password" placeholder="একটি পাসওয়ার্ড তৈরি করো">
        <button class="btn" id="btnLogin">Login / Register</button>
      </div>
    </div>
  `;
  $('btnLogin').onclick = login;
}

async function login(){
  const name = $('name').value.trim(); const password = $('password').value.trim();
  if(!name || !password) return toast('সব ঘর পূরণ করো!');
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let randomPart = "";
  for(let i=0; i<6; i++) randomPart += chars.charAt(Math.floor(Math.random() * chars.length));
  const serial = "YC_" + randomPart;
  currentUser = { name, serial, password, isCO: false, score: 0, createdAt: Date.now(), isBlocked: false };
  await set(ref(db, 'users/' + serial), currentUser);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(currentUser));
  syncUserAndRender();
}

async function syncUserAndRender() {
  onValue(ref(db, 'users/' + currentUser.serial), snap => {
    if(snap.exists()) {
      currentUser = snap.val();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(currentUser));
      if(currentUser.isBlocked) return renderBlockedScreen();
      renderHome();
    } else {
      renderAuth();
    }
  });
  checkTabLock();
  applySavedThemeAndBrightness();
  cleanOldChats();
  listenGlobalDots();
}

}

  $('muteToggle').onclick = () => {

  $('brightRange').oninput = (e) => {

window.startBattleExamSession = async function(bId) {
  let snap = await get(ref(db, 'battles/' + bId)); if(!snap.exists()) return;
  let b = snap.val();
  let qHtml = '';
  b.questions.forEach((q, idx) => {
    let inputs = '';
    if(q.type === 'mcq') {
      q.options.forEach(o => {
        inputs += `<label style="display:block; margin:4px 0;"><input type="radio" name="bq_${idx}" value="${o.trim()}"> ${o.trim()}</label>`;
      });
    } else {
      inputs = `<input type="text" class="input vsaq-battle-input" data-idx="${idx}" placeholder="উত্তর টাইপ করো...">`;
    }
    qHtml += `<div class="battle-q-card"><b>Q${idx+1}: ${q.question}</b><div style="margin-top:6px;">${inputs}</div></div>`;
  });
  $('app').innerHTML = `
    <header><h3>🔴 Live Exam: ${b.title}</h3></header>
    <div class="main-content">${qHtml}<button class="btn btn-danger" id="submitBExam">Submit Exam Sheets</button></div>
  `;
  $('submitBExam').onclick = async () => {
    let totalSc = 0;
    b.questions.forEach((q, idx) => {
      let uAns = '';
      if(q.type === 'mcq') {
        let selected = document.querySelector(`input[name="bq_${idx}"]:checked`);
        if(selected) uAns = selected.value;
      } else {
        let inp = document.querySelector(`.vsaq-battle-input[data-idx="${idx}"]`);
        if(inp) uAns = inp.value.trim();
      }
      let isCorrect = (q.type==='mcq')?(uAns.toLowerCase()===q.answer.toLowerCase()):checkAnswerSmart(uAns, q.answer);
      if(uAns !== '') {
        totalSc += isCorrect ? parseInt(q.points) : -parseInt(q.negative);
      }
    });
    let finalSc = (currentUser.score || 0) + totalSc; if(finalSc < 0) finalSc = 0;
    await update(ref(db, 'users/' + currentUser.serial), { score: finalSc });
    alert(`পরীক্ষা সমাপ্ত! প্রাপ্ত নেট স্কোর যোগ হলো: ${totalSc}`);
    renderHome();
  };
};

window.enterMcqFightRealtime = async function(fId) {
  let snap = await get(ref(db, `mcq_fight_submissions/${fId}/${currentUser.serial}`));
  if(snap.exists()) return alert('তুমি এই ফাইটে ইতিমধ্যে একবার অংশ নিয়ে ফেলেছো! দ্বিতীয়বার অনুমতি নেই।');

  let fSnap = await get(ref(db, 'mcq_fights/' + fId)); if(!fSnap.exists()) return;
  let fight = fSnap.val();
  let questions = fight.questions;
  let currentQIdx = 0;
  let earnedScore = 0;
  let timerInterval = null;

  function renderFightQuestion() {
    if(currentQIdx >= questions.length) {
      clearInterval(timerInterval);
      finishFightSession();
      return;
    }
    let q = questions[currentQIdx];
    let optsHtml = '';
    q.options.forEach(o => {
      optsHtml += `<button class="btn btn-secondary opt-fight-btn" style="text-align:left; margin-top:6px;">${o.trim()}</button>`;
    });

    $('app').innerHTML = `
      <header><div style="display:flex; justify-content:space-between;"><span><b>Q: ${currentQIdx+1}/${questions.length}</b></span><span style="color:var(--accent2); font-weight:bold;" id="fightTimer">Time: 15s</span></div></header>
      <div class="main-content">
        <div class="card">
          <h3>${q.question}</h3>
          <div style="margin-top:12px; display:flex; flex-direction:column;">${optsHtml}</div>
        </div>
      </div>
    `;

    let timeAllocated = 15;
    timerInterval = setInterval(() => {
      timeAllocated--;
      $('fightTimer').textContent = `Time: ${timeAllocated}s`;
      if(timeAllocated <= 0) {
        clearInterval(timerInterval);
        // টাইমআউট - পরবর্তী প্রশ্নে চলো
        currentQIdx++;
        renderFightQuestion();
      }
    }, 1000);

    let btns = document.querySelectorAll('.opt-fight-btn');
    btns.forEach(btn => {
      btn.onclick = () => {
        clearInterval(timerInterval);
        let ans = btn.textContent.trim();
        if(ans.toLowerCase() === q.answer.toLowerCase().trim()) {
          earnedScore += 10;
          toast('✅ সঠিক উত্তর (+১০)');
        } else {
          toast('❌ ভুল উত্তর (০)');
        }
        setTimeout(() => {
          currentQIdx++;
          renderFightQuestion();
        }, 800);
      };
    });
  }

  async function finishFightSession() {
    await set(ref(db, `mcq_fight_submissions/${fId}/${currentUser.serial}`), { score: earnedScore });
    let fs = (currentUser.score || 0) + earnedScore;
    await update(ref(db, 'users/' + currentUser.serial), { score: fs });
    alert(`ফাইট শেষ! তুমি মোট অর্জন করলে: +${earnedScore} স্কোর।`);
    renderHome();
  }

  renderFightQuestion();
};

};
window.submitGroupBattleAnswerLive = function() {

window.castBattleVoteLive = async function(vote) {
  // জটিল ভোট ইভালুয়েশন ট্র্যাকিং ইঞ্জিন লজিক
  let snap = await get(ref(db, 'group_battle_session'));
  let d = snap.val();
  if(currentUser.isCO) {
    await update(ref(db, 'group_battle_session'), { coVote: vote });
  } else {
    await update(ref(db, 'group_battle_session'), { teamVote: vote });
  }
  // পুনরায় ডাটা রি-চেক করে স্কোর শিফট স্কিম এক্সিকিউট করা
  let reSnap = await get(ref(db, 'group_battle_session'));
  let rd = reSnap.val();
  if(rd.coVote && rd.teamVote) {
    let ptsA = rd.pointsA || 0; let ptsB = rd.pointsB || 0;
    if(rd.currentTurn === 'A') { // A প্রশ্নকর্তা, B উত্তরদাতা
      if(rd.teamVote === 'correct' && rd.coVote === 'correct') ptsB += 10;
      else if(rd.teamVote === 'incorrect' && rd.coVote === 'incorrect') ptsA += 10;
      else { ptsA -= 10; ptsB += 10; }
    } else { // B প্রশ্নকর্তা, A উত্তরদাতা
      if(rd.teamVote === 'correct' && rd.coVote === 'correct') ptsA += 10;
      else if(rd.teamVote === 'incorrect' && rd.coVote === 'incorrect') ptsB += 10;
      else { ptsB -= 10; ptsA += 10; }
    }
    // রাউন্ড অল্টারনেটিং ও রিসেট প্যারামিটার লক
    let nextTurn = rd.currentTurn === 'A'?'B':'A';
    await update(ref(db, 'group_battle_session'), {
      pointsA: ptsA, pointsB: ptsB, stage: 'questioning', currentTurn: nextTurn,
      coVote: null, teamVote: null, activeQuestion: '', activeAnswer: ''
    });
    toast('পয়েন্ট টেবিল লাইভ আপডেট হয়েছে!');
  }
};

window.enterQuestSolveArena = async function(qId) {
  let snap = await get(ref(db, 'quests/' + qId)); if(!snap.exists()) return;
  let q = snap.val();
  if(q.type === 'break_hint') {
    window.bhHints = q.hints.split('|'); window.bhIdx = 0; window.bhId = qId; window.bhPoints = q.points;
    renderBreakHintLoop();
  } else {
    let display = q.type==='picture'?`<img src="${q.question}" style="width:100%; border-radius:8px;">`:`<h3>${q.question}</h3>`;
    let answerForm = q.type==='mcq'? '':`<input type="text" class="input" id="qSoloAns" placeholder="উত্তর টাইপ করো...">`;
    if(q.type === 'mcq') {
      q.options.forEach(o => {
        answerForm += `<button class="btn btn-secondary" onclick="window.submitSoloQuestAnswer('${qId}','${o.trim()}')">${o.trim()}</button>`;
      });
    } else {
      answerForm += `<button class="btn" onclick="window.submitSoloQuestAnswer('${qId}', $('qSoloAns').value)">Submit</button>`;
    }
    $('app').innerHTML = `<header><button class="btn btn-secondary" style="width:auto; margin:0;" onclick="showQuest()">← Back</button></header><div class="main-content"><div class="card">${display}${answerForm}</div></div>`;
  }
};

window.submitSoloQuestAnswer = async function(qId, ans) {
  if(!ans) return alert('ফাঁকা রাখা যাবে his!');
  let snap = await get(ref(db, 'quests/' + qId)); let q = snap.val();
  let isCorrect = (q.type==='mcq')?(ans.toLowerCase()===q.answer.toLowerCase()):checkAnswerSmart(ans, q.answer);
  let delta = isCorrect ? parseInt(q.points) : -parseInt(q.negative || 0);
  let fs = (currentUser.score || 0) + delta; if(fs<0) fs=0;
  await update(ref(db, 'users/' + currentUser.serial), { score: fs });
  alert(isCorrect ? '🎉 সঠিক উত্তর!' : `❌ ভুল উত্তর! পয়েন্ট কাটা গেল: ${q.negative}`);
  showQuest();
};

function renderBreakHintLoop() {
  let activeHint = window.bhHints[window.bhIdx] || "কোনো হিন্ট নেই";
  let award = 10 - window.bhIdx; if(award < 1) award = 1;
  $('app').innerHTML = `
    <header><button class="btn btn-secondary" style="width:auto; margin:0;" onclick="showQuest()">← Back</button></header>
    <div class="main-content">
      <div class="card" style="border-top:4px solid var(--warning);">
        <h3>Break the Hint Quest 🧠</h3>
        <p style="margin:10px 0; background:#fff3e0; padding:10px; border-radius:6px;"><b>হিন্ট ${window.bhIdx+1}:</b> ${activeHint}</p>
        <p style="font-size:12px; color:var(--success); font-weight:bold;">💡 এই ধাপে সঠিক উত্তর দিলে পাবে: +${award} স্কোর</p>
        <input type="text" class="input" id="bhInput" placeholder="তোমার গেস করা উত্তর লেখো...">
        <button class="btn" onclick="window.submitBHAnswerLive()">উত্তর সাবমিট করো</button>
        ${window.bhIdx < window.bhHints.length - 1 ? `<button class="btn btn-secondary" style="margin-top:8px;" onclick="window.bhIdx++; renderBreakHintLoop();">পরের হিন্ট দেখবো (Skip Hint)</button>` : '<p style="color:var(--accent2); font-size:11px; margin-top:6px;">এটিই শেষ চূড়ান্ত হিন্ট! ভুল করলে -৫ হবে।</p><button class="btn btn-danger" onclick="window.failBHFinal()">আমি পারলাম না (Give Up -5)</button>'}
      </div>
    </div>
  `;
}
window.submitBHAnswerLive = async function() {
  let ans = $('bhInput').value.trim(); if(!ans) return alert('উত্তর লেখো!');
  let snap = await get(ref(db, 'quests/' + window.bhId)); let q = snap.val();

};
window.failBHFinal = async function() {

        <textarea class="input" id="coQHints" placeholder="Hints (Break Hint এর জন্য পাইপ | চিহ্ন আলাদা করো)"></textarea>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px;">
          <input type="number" class="input" id="coQPts" value="10" placeholder="প্লাস মার্ক">
          <input type="number" class="input" id="coQNeg" value="0" placeholder="নেগেটিভ মার্ক">
        </div>
        <button class="btn btn-success" id="coPublishQuestBtn">Publish Quest Live</button>
      </div>

      <div class="card">
        <h4>⚡ Deploy MCQ Fight Panel</h4>
        <input type="text" class="input" id="coFightTitle" placeholder="Fight Title (যেমন: ইতিহাস ফাইট ১)">
        <input type="number" class="input" id="coFightExpiryHours" placeholder="কত ঘণ্টা পর ডিলিট হবে?">
        <textarea class="input" id="coFightRaw" rows="6" placeholder="প্রশ্ন|সঠিক উত্তর|অপশন১,অপশন২,অপশন৩,অপশন৪&#10;পরের প্রশ্ন নিচে..."></textarea>
        <button class="btn btn-warning" id="coPublishFightBtn">Launch MCQ Fight Stream</button>
      </div>

      <div class="card">
        <h4>🛡️ Manage Group Battle Arena</h4>
        <div style="display:flex; gap:6px;">
          <button class="btn btn-success" onclick="window.toggleGroupBattleSessionSystem(true)">Start Battle</button>
          <button class="btn btn-danger" onclick="window.toggleGroupBattleSessionSystem(false)">Stop Battle</button>
        </div>
      </div>

      <div class="card">
        <h4>🎮 Add Games (২)</h4>
        <input type="text" class="input" id="coGameName" placeholder="Game Name">
        <input type="text" class="input" id="coGameIcon" placeholder="Emoji Icon">
        <textarea class="input" id="coGameCode" rows="4" placeholder="Pure HTML/JS App Embed Code"></textarea>
        <button class="btn" id="coAddGameBtn">Inject Game Sandbox</button>
      </div>

      <div class="card">
        <h4>🛠️ Add Tools (৩)</h4>
        <input type="text" class="input" id="coToolName" placeholder="Tool Name">
        <input type="text" class="input" id="coToolIcon" placeholder="Emoji Icon">
        <textarea class="input" id="coToolCode" rows="4" placeholder="Pure HTML/JS Code"></textarea>
        <button class="btn" id="coAddToolBtn">Inject Tool Sandbox</button>
      </div>

      <div class="card">
        <h4>🧠 Add Knowledge / Literature / Application (৪)</h4>
        <select class="input" id="coContentType"><option value="knowledge">Knowledge</option><option value="literature">Literature (৯০ দিন পর ডিলিট হবে)</option></select>
        <input type="text" class="input" id="coContentTitle" placeholder="Title">
        <textarea class="input" id="coContentDesc" rows="3" placeholder="Description content"></textarea>
        <button class="btn" id="coPublishContentBtn">Publish Feed Content</button>
      </div>

      <div class="card">
        <h4>📄 Create App Form (৪)</h4>
        <input type="text" class="input" id="coAppTitle" placeholder="Form Title">
        <input type="text" class="input" id="coAppDesc" placeholder="Short description">
        <input type="text" class="input" id="coAppFields" placeholder="Fields comma separated (e.g. Name,Age,Roll)">
        <input type="date" class="input" id="coAppDate">
        <button class="btn btn-success" id="coPublishAppFormBtn">Launch Digital Dynamic Form</button>
      </div>

      <div class="card">
        <h4>👥 Manage Members Area (৫)</h4>
        <div id="coUserDirectoryListZone" style="max-height:250px; overflow-y:auto;">Loading Registry...</div>
      </div>

      <div class="card">
        <h4>👑 Promote Member to CO Status (৬)</h4>
        <input type="text" class="input" id="coTargetSerialToPromote" placeholder="YC_XXXXXX">
        <button class="btn btn-warning" id="coPromoteActionBtn">Grant CO Authority</button>
      </div>

      <div class="card">
        <h4>📌 Add Notice Board Text (৭)</h4>
        <textarea class="input" id="coNoticeBoardText" rows="3" placeholder="নোটিশ বোর্ডে যা ঝোলানো হবে..."></textarea>
        <button class="btn btn-warning" id="coUpdateNoticeBoardBtn">Update Dashboard Notice</button>
      </div>

      <div class="card">
        <h4>🔗 Share Critical Web URL Link (৮)</h4>
        <input type="text" class="input" id="coLinkTitle" placeholder="Link Display Name">
        <input type="text" class="input" id="coLinkUrl" placeholder="https://example.com">
        <input type="text" class="input" id="coLinkDesc" placeholder="Short Summary description">
        <button class="btn" id="coPublishLinkBtn">Inject Hyperlink</button>
      </div>

      <div class="card">
        <h4>🔴 Add Red Tag Scroll Notice (৯)</h4>
        <input type="text" class="input" id="coScrollTagText" placeholder="যা হেডারের নিচের স্ক্রল লাইনে ঘুরবে...">
        <button class="btn btn-danger" id="coUpdateScrollTagBtn">Update Global Scroll Strip</button>
      </div>

      <div class="card" style="border:2px solid var(--accent2); background:#ffebee;">
        <h4 style="color:var(--accent2);">💣 Nuclear Danger Zone (১০)</h4>
        <p style="font-size:11px; margin-bottom:8px; font-weight:bold;">১-ক্লিকে সব ইউজারের স্কোর ০ হবে এবং সার্ভারের সব কুইজ প্রশ্ন ডিলিট হয়ে যাবে।</p>
        <button class="btn btn-danger" id="coNuclearMasterWipeBtn" style="font-weight:bold;">WIPEOUT ALL SCORES & QUESTS</button>
      </div>
    </div>
  `;
  $('backHome').onclick = renderHome;
  
  // সিও ইভেন্ট বাইন্ডিং মেকানিজমসমূহ
  $('coSearchBtn').onclick = executeCoDeepSearchEngine;
  $('coPublishQuestBtn').onclick = coPublishQuestLogicEngine;
  $('coPublishFightBtn').onclick = coPublishMcqFightLogicEngine;
  $('coAddGameBtn').onclick = () => injectSandboxNodeEngine('custom_games', $('coGameName'), $('coGameIcon'), $('coGameCode'));
  $('coAddToolBtn').onclick = () => injectSandboxNodeEngine('custom_tools', $('coToolName'), $('coToolIcon'), $('coToolCode'));
  $('coPublishContentBtn').onclick = coPublishSimpleContentLogicFeed;
  $('coPublishAppFormBtn').onclick = coPublishDynamicApplicationFormLogic;
  $('coPromoteActionBtn').onclick = coExecutePromoteMemberToCOStatusSystem;
  $('coUpdateNoticeBoardBtn').onclick = () => set(ref(db, 'notice_board'), { text: $('coNoticeBoardText').value.trim() }).then(()=>toast('নোটিশ আপডেট সফল!'));
  $('coPublishLinkBtn').onclick = coPublishImportantLinkLogicSystem;
  $('coUpdateScrollTagBtn').onclick = () => set(ref(db, 'scroll_tag'), { text: $('coScrollTagText').value.trim() }).then(()=>toast('স্ক্রল নোটিশ সফল!'));
  $('coNuclearMasterWipeBtn').onclick = executeNuclearMasterWipeSystemEngine;

  loadCoUserManagementDirectory();
}

async function executeCoDeepSearchEngine() {
  let s = $('coSearchUserKey').value.trim(); if(!s) return;
  let snap = await get(ref(db, 'users/' + s));
  if(snap.exists()) {
    let u = snap.val();
    $('coSearchDisplayZone').innerHTML = `
      <div style="background:var(--card); padding:8px; border:1px solid var(--border); border-radius:6px; margin-top:6px;">
        <b>Name:</b> ${u.name}<br><b>Password:</b> ${u.password || 'Not Set'}<br><b>Score:</b> ${u.score || 0}<br><b>Role:</b> ${u.isCO?'CO':'Member'}
      </div>
    `;
  } else { $('coSearchDisplayZone').innerHTML = '<span style="color:var(--accent2);">কোনো অ্যাকাউন্ট মেলেনি সার্ভারে!</span>'; }
}

async function coPublishQuestLogicEngine() {
  let type = $('coQType').value; let question = $('coQQuest').value.trim();
  let answer = $('coQAns').value.trim(); let options = $('coQOpts').value.split(',');
  let hints = $('coQHints').value.trim(); let points = $('coQPts').value; let negative = $('coQNeg').value;
  if(!question || !answer) return alert('প্রশ্ন ও উত্তর আবশ্যক!');
  await push(ref(db, 'quests'), { type, question, answer, options, hints, points, negative, createdAt: Date.now() });
  toast('কোয়েস্ট সফলভাবে লাইভ যোগ হয়েছে!'); showCOPanel();
}

async function coPublishMcqFightLogicEngine() {
  let title = $('coFightTitle').value.trim(); let hours = parseInt($('coFightExpiryHours').value) || 24;
  let raw = $('coFightRaw').value.trim(); if(!title || !raw) return alert('সব তথ্য পূরণ করো!');
  let lines = raw.split('\n'); let parsedQ = [];
  lines.forEach(l => {
    let parts = l.split('|');
    if(parts.length >= 3) {
      parsedQ.push({ question: parts[0].trim(), answer: parts[1].trim(), options: parts[2].split(',') });
    }
  });
  let expiryTimestamp = Date.now() + (hours * 60000 * 60);
  await push(ref(db, 'mcq_fights'), { title, questions: parsedQ, expiryTimestamp, createdAt: Date.now() });
  toast('MCQ Fight সেশন লাইভ চালু হয়েছে!'); showCOPanel();
}

window.toggleGroupBattleSessionSystem = async function(status) {
  if(status) {
    await set(ref(db, 'group_battle_session'), { active: true, stage: 'questioning', currentTurn: 'A', pointsA: 0, pointsB: 0, stageTimestamp: Date.now() });
    toast('গ্রুপ ফাইট এরিনা লাইভ ওপেন করা হয়েছে!');
  } else {
    let snap = await get(ref(db, 'group_battle_session'));
    if(snap.exists()) {
      let d = snap.val();
      // বিজয়ী নির্ধারণ করে প্লাস ৫০ গ্লোবাল স্কোর ডিস্ট্রিবিউশন লজিক
      let winner = d.pointsA > d.pointsB ? 'A' : 'B';
      alert(`ম্যাচ শেষ! বিজয়ী দল গ্রুপ ${winner}। বিজয়ী দলের প্রতি সদস্যের প্রোফাইলে +৫০ স্কোর এন্ট্রি হচ্ছে...`);
    }
    await remove(ref(db, 'group_battle_session'));
    await remove(ref(db, 'group_battle_chats'));
    toast('গ্রুপ ফাইট এরিনা বন্ধ ও স্কোর সেটেল করা হয়েছে।');
  }
};

async function injectSandboxNodeEngine(node, nameEl, iconEl, codeEl) {
  let name = nameEl.value.trim(); let icon = iconEl.value.trim(); let code = codeEl.value.trim();
  if(!name || !code) return alert('সব ঘর পূরণ করো!');
  await push(ref(db, node), { name, icon, code, createdAt: Date.now() });
  toast('স্যান্ডবক্স অ্যাপ্লিকেশন ইনজেক্ট সফল!'); showCOPanel();
}

async function coPublishSimpleContentLogicFeed() {
  let type = $('coContentType').value; let title = $('coContentTitle').value.trim(); let desc = $('coContentDesc').value.trim();
  if(!title || !desc) return alert('তথ্য ফাঁকা রাখা যাবে না!');
  await push(ref(db, type), { title, desc, createdAt: Date.now() });
  toast('ফিড কন্টেন্ট লাইভ সফল!'); showCOPanel();
}

async function coPublishDynamicApplicationFormLogic() {
  let title = $('coAppTitle').value.trim(); let desc = $('coAppDesc').value.trim();
  let fields = $('coAppFields').value.trim(); let lastDate = $('coAppDate').value;
  if(!title || !fields) return alert('শিরোনাম ও ইনপুট বক্সের নাম দেওয়া বাধ্যতামূলক!');
  await push(ref(db, 'applications'), { title, desc, fields, lastDate, createdAt: Date.now() });
  toast('ডায়নামিক ডিজিটাল ফরম লঞ্চ হয়েছে!'); showCOPanel();
}

function loadCoUserManagementDirectory() {
  onValue(ref(db, 'users'), snap => {
    if(!snap.exists()) return $('coUserDirectoryListZone').innerHTML = 'Registry Is Clean.';
    let html = '';
    Object.entries(snap.val()).forEach(([serial, u]) => {
      if(serial === currentUser.serial) return;
      html += `
        <div style="border-bottom:1px solid var(--border); padding:8px 0; font-size:12px;">
          <div><b>${u.name}</b> (${serial}) | Score: <b style="color:var(--success);">${u.score || 0}</b></div>
          <div style="margin-top:4px; display:flex; gap:4px;">
            <button class="btn btn-success" style="width:auto; margin:0; padding:2px 6px; font-size:10px;" onclick="window.coAlterMemberScoreLogic('${serial}', 1)">+1</button>
            <button class="btn btn-success" style="width:auto; margin:0; padding:2px 6px; font-size:10px;" onclick="window.coAlterMemberScoreLogic('${serial}', 10)">+10</button>
            <button class="btn btn-success" style="width:auto; margin:0; padding:2px 6px; font-size:10px;" onclick="window.coAlterMemberScoreLogic('${serial}', 50)">+50</button>
            <button class="btn btn-danger" style="width:auto; margin:0; padding:2px 6px; font-size:10px;" onclick="window.coAlterMemberScoreLogic('${serial}', -1)">-1</button>
            <button class="btn btn-danger" style="width:auto; margin:0; padding:2px 6px; font-size:10px;" onclick="window.coAlterMemberScoreLogic('${serial}', -10)">-10</button>
            <button class="btn btn-danger" style="width:auto; margin:0; padding:2px 6px; font-size:10px;" onclick="window.coAlterMemberScoreLogic('${serial}', -50)">-50</button>
            <button class="btn btn-warning" style="width:auto; margin:0; padding:2px 6px; font-size:10px;" onclick="window.coToggleBlockMemberSystem('${serial}', ${u.isBlocked? 'false':'true'})">${u.isBlocked?'Unblock':'Block'}</button>
            <button class="btn btn-danger" style="width:auto; margin:0; padding:2px 6px; font-size:10px; background:black;" onclick="window.coDeleteMemberFirebaseDirect('${serial}')">Wipe</button>
            <button class="btn btn-secondary" style="width:auto; margin:0; padding:2px 6px; font-size:10px;" onclick="window.openDirectChatRoom('co_messages/${serial}', 'Chat with ${u.name}')">Msg</button>
          </div>
        </div>
      `;
    });
    $('coUserDirectoryListZone').innerHTML = html;
  });
}

window.coAlterMemberScoreLogic = async function(serial, delta) {
  let snap = await get(ref(db, 'users/' + serial)); if(!snap.exists()) return;
  let currentScore = snap.val().score || 0;
  let ns = currentScore + delta; if(ns < 0) ns = 0;
  await update(ref(db, 'users/' + serial), { score: ns });
  toast('স্কোর আপডেট হয়েছে!');
};
window.coToggleBlockMemberSystem = async function(serial, status) {
  await update(ref(db, 'users/' + serial), { isBlocked: status });
  toast(status ? 'মেম্বারকে ব্লক করা হয়েছে!' : 'মেম্বার আনব্লকড!');
};
window.coDeleteMemberFirebaseDirect = function(serial) {
  if(confirm("⚠️ সাবধান! ফায়ারবেস ডেটাবেস থেকে এই মেম্বারের সমস্ত অস্তিত্ব চিরতরে ডিলিট করতে চাও?")) {
    remove(ref(db, 'users/' + serial)); toast('মেম্বার ডিলিট সফল!');
  }
};

async function coExecutePromoteMemberToCOStatusSystem() {
  let s = $('coTargetSerialToPromote').value.trim(); if(!s) return;
  await update(ref(db, 'users/' + s), { isCO: true });
  toast('সফলভাবে নতুন CO প্রমোট করা হয়েছে!'); showCOPanel();
}

async function coPublishImportantLinkLogicSystem() {
  let title = $('coLinkTitle').value.trim(); let url = $('coLinkUrl').value.trim(); let desc = $('coLinkDesc').value.trim();
  if(!title || !url) return alert('টাইটেল ও লিঙ্ক আবশ্যক!');
  await push(ref(db, 'shared_links'), { title, url, desc });
  toast('গুরুত্বপূর্ণ লিঙ্ক পাবলিশ হয়েছে!'); showCOPanel();
}

function executeNuclearMasterWipeSystemEngine() {
  if(confirm("☢️ ক্রিপ্টোগ্রাফিক অ্যালার্ট! তুমি কি নিশ্চিত যে ওয়ান-ক্লিকে সার্ভারের সমস্ত মেম্বার স্কোর ০ করবে এবং সমস্ত কোয়েস্ট চিরতরে ধ্বংস করবে? এই অ্যাকশন রিভার্স করা যাবে না।")) {
    get(ref(db, 'users')).then(snap => {
      if(snap.exists()) {
        Object.keys(snap.val()).forEach(serial => {
          update(ref(db, 'users/' + serial), { score: 0 });
        });
      }
    });
    remove(ref(db, 'quests'));
    alert('💥 সার্ভার সাকসেসফুলি নিউক্লিয়ার রিসেট সম্পন্ন করেছে! অল মেম্বার স্কোর শুন্য করা হলো।');
    showCOPanel();
  }
}
</script>
</body>
</html>
