<style>
:root{
  --bg:#f5f5f5;

}
[data-theme="dark"] {
  --bg:#121212;
  --card:#1e1e1e;
  --text:#f5f5f5;
  --border:#333333;
  --muted:#aaaaaa;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-touch-callout:none;}
body{

}
.allow-copy, .allow-copy *, #chatBox, #chatBox *, .literature-text, .literature-text *, .copyable, input, textarea, select {

.container{max-width:600px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);position: relative;}
header{

}
.header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}

.profile-info .serial{color:var(--accent);font-weight:600}
.profile-info .score-tag{color:var(--success);font-weight:600}
.profile-info .status-tag{background:var(--accent);color:#fff;padding:2px 6px;border-radius:4px;font-size:11px;font-weight:bold;}
.profile-info .status-tag.co{background:var(--warning);}
.network-dot{ width:10px;height:10px;border-radius:50%; background:#4caf50;display:inline-block;}
.network-dot.offline{background:#f44336}
.notice-ticker{
  background:var(--accent2); color:#fff; padding:6px 12px;
  font-size:13px; white-space:nowrap; overflow:hidden; border-radius:6px;
}

@keyframes scroll{to{transform:translateX(-100%)}}
.main-content{flex:1;padding:16px;padding-bottom:100px}
.nav-grid{ display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px }
.nav-btn{

.nav-btn:active{transform:scale(0.95)}

.nav-btn .icon{font-size:28px;margin-bottom:6px}

.screen{display:none}
.screen.active{display:block}
.card{

.btn{
  background:var(--accent); color:#fff; border:none; padding:12px 20px;
  border-radius:8px; font-size:14px; cursor:pointer; width:100%; margin-top:8px; font-weight: 500;
}
.btn-secondary{background:var(--muted)}
.btn-danger{background:var(--accent2)}
.btn-warning{background:var(--warning)}
.btn-success{background:var(--success)}
.input{
  width:100%;padding:12px; background:var(--card); border:1px solid var(--border);
  border-radius:8px; color:var(--text); font-size:14px; margin-top:8px;
}
textarea.input { resize: vertical; }
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0; background:var(--card);
  border-top:1px solid var(--border); display:flex;justify-content:space-around;
  padding:8px 0; max-width: 600px; margin: 0 auto; z-index: 99;
}
.bottom-nav-btn{
  background:none;border:none;color:var(--muted); font-size:12px;cursor:pointer;padding:4px 8px; font-weight: 500;
}
.bottom-nav-btn.active{color:var(--accent)}
.bluelight-filter{
  position:fixed;top:0;left:0;right:0;bottom:0; background:rgba(245,222,179,0.25);
  pointer-events:none;z-index:9999;display:none;
}
.brightness-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0, 0, 0, 0); pointer-events: none; z-index: 9998;
}
.switch-link{ display:block;text-align:center;margin-top:15px;color:var(--accent); font-size:13px;text-decoration:underline;cursor:pointer; }
.form-builder-row{ display:flex;align-items:center;gap:10px;margin-top:8px; }
.form-builder-row label{font-size:14px;min-width:90px;}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px;}
th,td{border:1px solid var(--border);padding:8px;text-align:left;}
th{background:var(--bg);color:var(--accent);}
.flex-actions { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap;}
.flex-actions .btn { margin-top:0; padding:8px 12px; font-size:12px; width:auto; flex:1; text-align:center;}
.delete-inline-btn {
  position: absolute; top: 10px; right: 10px; background: var(--accent2);
  color: #fff; border: none; border-radius: 4px; padding: 4px 8px; font-size: 11px; cursor: pointer;
  z-index: 5;
}
.score-control-btn {
  padding: 4px 8px; font-size: 11px; cursor: pointer; border-radius: 4px; border: 1px solid var(--border);
}
.battle-q-card {
  border-left: 4px solid var(--accent2); padding: 10px; margin-bottom: 10px; background: var(--bg); border-radius: 6px;
}
.indicator-dot {
  position: absolute; top: 8px; right: 8px; width: 12px; height: 12px; border-radius: 50%; display: none; z-index: 10;
}
.indicator-dot.red { background-color: var(--accent2); box-shadow: 0 0 6px var(--accent2); }
.indicator-dot.green { background-color: #4caf50; box-shadow: 0 0 6px #4caf50; }
.new-label-tag {
  position: absolute; top: -5px; left: 50%; transform: translateX(-50%); background: var(--accent2);
  color: white; font-size: 9px; font-weight: bold; padding: 1px 5px; border-radius: 4px; display: none; z-index: 11;
}
</style>

function toast(msg){
  let t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:10px 20px;border-radius:8px;z-index:1000;font-size:14px;box-shadow:0 4px 6px rgba(0,0,0,0.1);';
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2000);
}
window.toast = toast;

document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) {
    e.stopPropagation(); 
  }
}, true);

function checkTabLock(){
  const tabId = sessionStorage.getItem(TAB_KEY) || Math.random().toString(36);
  sessionStorage.setItem(TAB_KEY, tabId);
  localStorage.setItem(TAB_KEY, tabId);
  window.addEventListener('storage', (e)=>{
    if(e.key === TAB_KEY && e.newValue !== tabId){
      alert('তুমি অন্য ট্যাবে লগইন করেছো। এই ট্যাব বন্ধ হয়ে যাবে।');
      window.close();
    }
  });
}

function applySavedThemeAndBrightness() {
  const savedTheme = localStorage.getItem("yc_theme") || "light";
  document.documentElement.setAttribute("data-theme", savedTheme);
  
  const savedVal = localStorage.getItem("yc_brightness") || "100";
  const opacity = (100 - parseInt(savedVal)) / 100;
  if($('brightnessLayer')) $('brightnessLayer').style.backgroundColor = `rgba(0, 0, 0, ${opacity * 0.85})`;

  const blueCutActive = localStorage.getItem("yc_bluecut") === "true";
  if($('bluelight')) $('bluelight').style.display = blueCutActive ? 'block' : 'none';
}

function getLevenshteinDistance(a, b) {
  if (a.length === 0) return b.length;
  if (b.length === 0) return a.length;
  const matrix = [];
  for (let i = 0; i <= b.length; i++) { matrix[i] = [i]; }
  for (let j = 0; j <= a.length; j++) { matrix[0][j] = j; }
  for (let i = 1; i <= b.length; i++) {
    for (let j = 1; j <= a.length; j++) {
      if (b.charAt(i - 1) === a.charAt(j - 1)) { matrix[i][j] = matrix[i - 1][j - 1]; }
      else {
        matrix[i][j] = Math.min(matrix[i - 1][j - 1] + 1, Math.min(matrix[i][j - 1] + 1, matrix[i - 1][j] + 1));
      }
    }
  }
  return matrix[b.length][a.length];
}

function checkAnswerSmart(userAns, correctAns) {
  if (!userAns || !correctAns) return false;
  let u = userAns.toLowerCase().trim().replace(/[\s.,\/#!$%\^&\*;:{}=\-_`~()]/g,"");
  let c = correctAns.toLowerCase().trim().replace(/[\s.,\/#!$%\^&\*;:{}=\-_`~()]/g,"");
  if (u === c) return true;
  
  let maxLen = Math.max(u.length, c.length);
  if (maxLen === 0) return false;
  let dist = getLevenshteinDistance(u, c);
  let similarity = (maxLen - dist) / maxLen;
  return similarity >= 0.78; 
}

function isValidURL(string) {
  try {
    new URL(string);
    return true;
  } catch (_) {
    return false;  
  }
}

async function runAutoExpiryCheck(){
  const now = Date.now();
  const todayStr = new Date().toISOString().split('T')[0];
  
  const coExpiryLimit = now - (20 * 24 * 60 * 60 * 1000);
  const generalExpiryLimit = now - (100 * 24 * 60 * 60 * 1000);

  const coMsgSnap = await get(ref(db, 'co_messages'));
  if(coMsgSnap.exists()){
    Object.entries(coMsgSnap.val()).forEach(([userSerial, msgSet]) => {
      Object.entries(msgSet).forEach(async ([msgId, msgObj]) => {
        if(msgObj.time && msgObj.time < coExpiryLimit) {
          await remove(ref(db, `co_messages/${userSerial}/${msgId}`));
        }
      });
    });
  }

  const chatsSnap = await get(ref(db, 'chats'));
  if(chatsSnap.exists()){
    Object.entries(chatsSnap.val()).forEach(([chatRoomId, msgSet]) => {
      Object.entries(msgSet).forEach(async ([msgId, msgObj]) => {
        if(msgObj.time && msgObj.time < generalExpiryLimit) {
          await remove(ref(db, `chats/${chatRoomId}/${msgId}`));
        }
      });
    });
  }

  const groupChatsSnap = await get(ref(db, 'group_chats'));
  if(groupChatsSnap.exists()){
    Object.entries(groupChatsSnap.val()).forEach(([groupId, msgSet]) => {
      Object.entries(msgSet).forEach(async ([msgId, msgObj]) => {
        if(msgObj.time && msgObj.time < generalExpiryLimit) {
          await remove(ref(db, `group_chats/${groupId}/${msgId}`));
        }
      });
    });
  }

  const tagSnap = await get(ref(db, 'scroll_tag'));
  if(tagSnap.exists() && tagSnap.val().lastDate && tagSnap.val().lastDate < todayStr){
    await remove(ref(db, 'scroll_tag'));
  }

  const noticeSnap = await get(ref(db, 'notice_board'));
  if(noticeSnap.exists() && noticeSnap.val().lastDate && noticeSnap.val().lastDate < todayStr){
    await remove(ref(db, 'notice_board'));
  }

  const appsSnap = await get(ref(db, 'applications'));
  if(appsSnap.exists()){
    Object.entries(appsSnap.val()).forEach(([id, app]) => {
      if(app.lastDate && app.lastDate < todayStr){
        remove(ref(db, 'applications/' + id));
        remove(ref(db, 'submitted_applications/' + id));
      }
    });
  }

  const litSnap = await get(ref(db, 'literature'));
  if(litSnap.exists()){
    const ninetyDaysMs = 90 * 24 * 60 * 60 * 1000;
    Object.entries(litSnap.val()).forEach(([id, lit]) => {
      if(lit.createdAt && (now - lit.createdAt) > ninetyDaysMs){
        remove(ref(db, 'literature/' + id));
      }
    });
  }
}

function handlePushNotification(title, body) {
  if (localStorage.getItem("yc_mute_state") === "true") return; 
  if (!("Notification" in window)) return;
  if (Notification.permission === "granted") {
    new Notification(title, { body });
  } else if (Notification.permission !== "denied") {
    Notification.requestPermission().then(permission => {
      if (permission === "granted") new Notification(title, { body });
    });
  }
}

function listenForGlobalIndicators() {
  const sections = ['quests', 'live_battles', 'applications', 'knowledge', 'literature', 'custom_games', 'events', 'custom_tools'];
  
  sections.forEach(sec => {
    onValue(ref(db, `indicators/${sec}`), snap => {
      if(snap.exists()) {
        const timestamp = snap.val().timestamp;
        const lastSeen = parseInt(localStorage.getItem(`seen_${sec}`) || "0");
        if(timestamp > lastSeen) {
          const redDot = $(`dot_${sec}`);
          const newTag = $(`new_${sec}`);
          if (redDot) redDot.style.display = 'block';
          if (newTag) newTag.style.display = 'block';
        }
      }
    });
  });

  onValue(ref(db, 'chats'), snap => {
    const greenDot = $('dot_contact');
    if(greenDot && snap.exists()) {
      greenDot.style.display = 'block';
    }
  });
  onValue(ref(db, 'group_chats'), snap => {
    const greenDot = $('dot_contact');
    if(greenDot && snap.exists()) greenDot.style.display = 'block';
  });
  onValue(ref(db, 'co_messages'), snap => {
    const greenDot = $('dot_contact');
    if(greenDot && snap.exists()) greenDot.style.display = 'block';
  });
}

function markSectionAsSeen(sec) {
  localStorage.setItem(`seen_${sec}`, Date.now().toString());
  const redDot = $(`dot_${sec}`);
  const newTag = $(`new_${sec}`);
  if (redDot) redDot.style.display = 'none';
  if (newTag) newTag.style.display = 'none';
}

function renderAuth(){
  $('app').innerHTML = `
    <div class="screen active" id="auth">
      <div class="card" style="margin-top:60px" id="authCard">
        <h2 style="text-align:center;margin-bottom:20px;color:var(--accent);">YourChoice</h2>
        <input type="text" class="input" id="name" placeholder="তোমার নাম">
        <input type="password" class="input" id="password" placeholder="একটি পাসওয়ার্ড তৈরি করো">
        <button class="btn" onclick="login()">Login / Register</button>
        <span class="switch-link" onclick="toggleAuthMode(true)">পুরনো অ্যাকাউন্ট রিকভার করো (Recovery)</span>
      </div>
    </div>
  `;
}

window.toggleAuthMode = function(isRecovery){
  const card = $('authCard');
  if(isRecovery){
    card.innerHTML = `
      <h2 style="text-align:center;margin-bottom:20px;color:var(--accent);">Account Recovery</h2>
      <p style="font-size:12px; color:var(--muted); text-align:center; margin-bottom:10px;">তোমার পুরনো সিরিয়াল ও পাসওয়ার্ডটি নিচে বসাও</p>
      <input type="text" class="input" id="recoverySerial" placeholder="Old Serial No (YC_XXXXXX)">
      <input type="password" class="input" id="recoveryPass" placeholder="Password">
      <button class="btn" onclick="recoverAccount()">Recover Account</button>
      <span class="switch-link" onclick="renderAuth()">নতুন অ্যাকাউন্ট তৈরি করো (Login)</span>
    `;
  }
}

window.login = async function(){
  const name = $('name').value.trim();
  const password = $('password').value.trim();
  if(!name || !password){ toast('নাম এবং পাসওয়ার্ড দুটোই দেওয়া বাধ্যতামুলক!'); return; }
  
  toast('অ্যাকাউন্ট তৈরি হচ্ছে...');
  try {
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789";
    let randomPart = "";
    for(let i = 0; i < 6; i++) { randomPart += chars.charAt(Math.floor(Math.random() * chars.length)); }
    const generatedSerial = "YC_" + randomPart;
    
    currentUser = {
      name: name, serial: generatedSerial, password: password,
      isCO: false, score: 0,
      createdAt: Date.now(), lastActive: Date.now(),
      isBlocked: false, profileUpdated: false
    };
    
    await set(ref(db, 'users/' + generatedSerial), currentUser);
    toast('রেজিস্ট্রেশন সফল হয়েছে!');
    localStorage.setItem(STORAGE_KEY, JSON.stringify(currentUser));
    syncUserAndRender();
  } catch(e) { toast('কানেকশন এরর!'); }
}

window.recoverAccount = async function(){
  const serial = $('recoverySerial').value.trim();
  const password = $('recoveryPass').value.trim();
  if(!serial || !password){ toast('সিরিয়াল এবং পাসওয়ার্ড দেওয়া বাধ্যতামুলক'); return; }
  
  toast('অ্যাকাউন্ট খোঁজা হচ্ছে...');
  try {
    const snap = await get(ref(db, 'users/' + serial));
    if(snap.exists()){
      let fetchedUser = snap.val();
      if(fetchedUser.password && fetchedUser.password !== password) {
        toast('ভুল পাসওয়ার্ড! আবার চেষ্টা করো।');
        return;
      }
      currentUser = fetchedUser;
      if(currentUser.isBlocked) { renderBlockedScreen(); return; }
      toast('স্বাগতম ফিরে আসার জন্য, ' + currentUser.name);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(currentUser));
      syncUserAndRender();
    } else { toast('এই সিরিয়াল নাম্বারের কোনো অ্যাকাউন্ট পাওয়া যায়নি!'); }
  } catch(e) { toast('কানেকশন এরর!'); }
}

async function syncUserAndRender() {
  if(!currentUser) return renderAuth();
  
  onValue(ref(db, 'users/' + currentUser.serial), snap => {
    if(snap.exists()) {
      currentUser = snap.val();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(currentUser));
      if(currentUser.isBlocked) {
        renderBlockedScreen();
      } else if(!currentUser.password) {
        renderForcePasswordScreen();
      } else {
        renderHome();
      }
    } else {
      localStorage.removeItem(STORAGE_KEY);
      renderAuth();
    }
  });
  checkTabLock();
  applySavedThemeAndBrightness();
}

function renderForcePasswordScreen() {
  $('app').innerHTML = `
    <div class="screen active">
      <div class="card" style="margin-top:100px; text-align:center; border-color:var(--warning);">
        <h2 style="color:var(--warning); margin-bottom:15px;">পাসওয়ার্ড সেট করো 🔒</h2>
        <p style="font-size:14px; margin-bottom:15px;">তোমার সুরক্ষার স্বার্থে অ্যাকাউন্টে একটি পাসওয়ার্ড সেট করা বাধ্যতামূলক। অন্যথায় অ্যাপ ব্যবহার করা যাবে না।</p>
        <input type="password" class="input" id="forcePassInput" placeholder="নতুন পাসওয়ার্ড দিন">
        <button class="btn btn-success" onclick="saveForcedPassword()">Save Password & Enter</button>
      </div>
    </div>
  `;
}

window.saveForcedPassword = async function() {
  const p = $('forcePassInput').value.trim();
  if(!p || p.length < 4) return toast('পাসওয়ার্ড ন্যূনতম ৪ অক্ষরের দিন!');
  await update(ref(db, 'users/' + currentUser.serial), { password: p });
  toast('পাসওয়ার্ড সেট সফল হয়েছে!');
}

function renderBlockedScreen() {
  $('app').innerHTML = `
    <div class="screen active">

function updateNetworkStatus(){
  const dot = $('netDot'); if(!dot) return;
  window.addEventListener('online', ()=>dot.classList.remove('offline'));
  window.addEventListener('offline', ()=>dot.classList.add('offline'));
  if(!navigator.onLine) dot.classList.add('offline');
}

function loadScrollTagAndNotice(){
  onValue(ref(db, 'scroll_tag'), snap=>{
    const data = snap.val(); const element = $('noticeText');
    if(data && element) element.textContent = data.text || 'Welcome!';
  });
  onValue(ref(db, 'notice_board'), snap=>{
    const data = snap.val(); const element = $('boardNoticeText');
    if(data && element) element.textContent = data.text || 'বর্তমানে কোনো নোটিশ নেই।';
  });
}

window.saveUserProfile = async function() {
  const uCheckSnap = await get(ref(db, 'users/' + currentUser.serial));
  if(uCheckSnap.exists() && uCheckSnap.val().isBlocked) return renderBlockedScreen();

  const profileData = {
    class: $('pClass').value.trim(),
    school: $('pSchool').value.trim(),
    board: $('pBoard').value.trim(),
    address: $('pAddress').value.trim(),
    mobile: $('pMobile').value.trim(),
    others: $('pOthers').value.trim()
  };

  let currentScore = uCheckSnap.val().score || 0;
  let hasUpdatedBefore = uCheckSnap.val().profileUpdated || false;
  let updates = { ...profileData };

  if(hasUpdatedBefore) {
    if(currentScore < 50) {
      toast('প্রোফাইল এডিট করার জন্য পর্যাপ্ত স্কোর (কমপক্ষে ৫০) নেই!');
      return;
    }
    updates.score = currentScore - 50;
    toast('প্রোফাইল পরিবর্তনের জন্য ৫০ স্কোর কাটা হলো!');
  } else {
    updates.profileUpdated = true;
    toast('প্রথমবার প্রোফাইল ডেটা সফলভাবে সেভ হলো!');
  }

  await update(ref(db, 'users/' + currentUser.serial), updates);
}

window.showQuest = function(){

      <header>

        </div>
      </header>
      <div class="main-content" id="questList"></div>
    </div>

function loadQuests(){
  onValue(query(ref(db, 'quests'), orderByChild('createdAt')), snap=>{
    let html = '<div class="card"><h3 style="color:var(--accent)">Available Quests</h3></div>';
    if(snap.exists()){
      let items = [];
      snap.forEach(child => { items.push({id: child.key, ...child.val()}); });
      items.reverse(); 
      items.forEach(q => {
        html += `
          <div class="card">
            <div onclick="startQuest('${q.id}')" style="cursor:pointer;">
              <div style="font-size:12px;color:var(--muted)">${q.type.toUpperCase()}</div>
              <div style="margin:8px 0;font-weight:600">${q.type.toUpperCase()}</div>
              <div style="font-size:12px;color:var(--success)">+${q.points} points | Minus: ${q.negative || 0}</div>
            </div>
            ${currentUser?.isCO ? `<button class="delete-inline-btn" onclick="deleteItemLive('quests/${q.id}', 'কুইজ প্রশ্ন')">Delete</button>` : ''}
          </div>
        `;
      });
    }else{ html += '<div class="card">No quests yet!</div>'; }
    if($('questList')) $('questList').innerHTML = html;
  });
}

window.startQuest = async function(id){
  const uCheckSnap = await get(ref(db, 'users/' + currentUser.serial));
  if(uCheckSnap.exists() && uCheckSnap.val().isBlocked) return renderBlockedScreen();
  
  const snap = await get(ref(db, 'quests/' + id)); if(!snap.exists()) return;
  const q = snap.val();
  const ansSnap = await get(ref(db, 'quest_answers/' + currentUser.serial + '/' + id));
  
  if(ansSnap.exists()){
    $('app').innerHTML = `<div class="screen active"><header><button onclick="showQuest()" style="background:none;border:none;color:var(--accent);cursor:pointer;">← Back</button></header><div class="main-content"><div class="card" style="background:#e8f5e9; color:var(--success)">তুমি ইতিমধ্যে এই প্রশ্নের উত্তর দিয়েছ!<br>তোমার উত্তর: ${ansSnap.val().answer} (প্রাপ্ত স্কোর: ${ansSnap.val().score})</div></div></div>`;
    return;
  }
  
  window.currentQuestData = q;
  window.currentQuestId = id;

  let contentHTML = q.type === 'picture' ? (isValidURL(q.question) ? `<img src="${q.question}" style="width:100%;max-height:300px;object-fit:contain;border-radius:8px;margin:10px 0">` : 'Invalid Image') : `<h3 style="margin:10px 0">${q.question}</h3>`;
  let answerHTML = '';
  
  if(q.type === 'mcq'){
    q.options.forEach(opt=>{ answerHTML += `<button class="btn btn-secondary" style="margin-top:5px;" onclick="submitQuestAnswer('${id}','${opt.trim()}')">${opt.trim()}</button>`; });
  } else if(q.type === 'break_hint'){
    window.currentHintIndex = 0;
    window.hintArray = q.hints ? q.hints.split('|') : [];
    renderBreakHintQuest(id, q);
    return;
  } else {
    answerHTML = `<input class="input" id="qAns" placeholder="উত্তর টাইপ করো..."><button class="btn" onclick="submitQuestAnswer('${id}',$('qAns').value)">Submit</button>`;
  }
  
  $('app').innerHTML = `
    <div class="screen active">
      <header><button onclick="handleQuestExit()" style="background:none;border:none;color:var(--accent);cursor:pointer;">← Back</button></header>
      <div class="main-content">
        <div class="card">${contentHTML}${answerHTML}</div>
      </div>
    </div>
  `;
}

window.handleQuestExit = async function() {
  if(confirm("উত্তর না দিয়ে বেরিয়ে এলে ভুল উত্তর হিসেবে বিবেচিত হবে। আপনি কি নিশ্চিত?")) {
    const id = window.currentQuestId;
    const q = window.currentQuestData;
    const uCheckSnap = await get(ref(db, 'users/' + currentUser.serial));
    
    let minusPoints = q.negative ? parseInt(q.negative) : 0;
    if(q.type === 'break_hint') minusPoints = 5; 
    
    await set(ref(db, 'quest_answers/' + currentUser.serial + '/' + id), { answer: "Exited Without Answering", score: -minusPoints });
    
    let newTotalScore = (uCheckSnap.val().score || 0) - minusPoints;
    if(newTotalScore < 0) newTotalScore = 0;
    await update(ref(db, 'users/' + currentUser.serial), { score: newTotalScore });
    
    toast(`উত্তর না দেওয়ার জন্য ${minusPoints} পয়েন্ট কাটা গেল।`);
    showQuest();
  }
}

function renderBreakHintQuest(id, q) {
  let activeHint = window.hintArray[window.currentHintIndex] || "কোনো হিন্ট উপলব্ধ নেই";
  let pointAward = 10 - window.currentHintIndex;
  if(pointAward < 1) pointAward = 1; 

  $('app').innerHTML = `
    <div class="screen active">
      <header><button onclick="handleQuestExit()" style="background:none;border:none;color:var(--accent);cursor:pointer;">← Back</button></header>
      <div class="main-content">
        <div class="card" style="border-top:4px solid var(--warning);">
          <h3 style="color:var(--warning)">Break the Hint Quest 🧠</h3>
          <p style="margin:10px 0; font-size:14px; font-weight:bold; background:#fff3e0; padding:10px; border-radius:6px; color:#1a1a1a;">হিন্ট নাম্বার ${window.currentHintIndex + 1}: ${activeHint}</p>
          <p style="font-size:12px; color:var(--success); font-weight:bold; margin-bottom:10px;">💡 এই হিন্টে সঠিক উত্তর দিলে পাবে: +${pointAward} স্কোর</p>
          
          <input class="input" id="bhAns" placeholder="তোমার গেস করা উত্তরটি লেখো...">
          <button class="btn" onclick="submitBreakHintAnswer('${id}', $('bhAns').value)">এই হিন্টেই উত্তর দাও</button>
          
          ${window.currentHintIndex < 9 && window.currentHintIndex < window.hintArray.length - 1 ? 
            `<button class="btn btn-secondary" style="margin-top:8px;" onclick="nextHintStep('${id}')">উত্তর না দিয়ে পরের হিন্ট দেখবো (Skip Hint)</button>` : 
            `<p style="color:var(--accent2); font-size:12px; font-weight:bold; margin-top:10px; text-align:center;">⚠️ এটিই শেষ চূড়ান্ত হিন্ট! ভুল করলে বা না পারলে -৫ পয়েন্ট কাটা যাবে।</p>
             <button class="btn btn-danger" style="margin-top:8px;" onclick="failBreakHintFinal('${id}')">আমি পারলাম না (Final Give Up -5)</button>`
          }
        </div>
      </div>
    </div>
  `;
}

window.nextHintStep = function(id) {
  window.currentHintIndex++;
  get(ref(db, 'quests/' + id)).then(snap => {
    renderBreakHintQuest(id, snap.val());
  });
}

window.submitBreakHintAnswer = async function(id, ans) {
  if(!ans || !ans.trim()) return toast('উত্তর ফাঁকা রাখা যাবে না!');
  
  const uCheckSnap = await get(ref(db, 'users/' + currentUser.serial));
  if(uCheckSnap.exists() && uCheckSnap.val().isBlocked) return renderBlockedScreen();

  const qSnap = await get(ref(db, 'quests/' + id)); const q = qSnap.val();
  let isCorrect = checkAnswerSmart(ans, q.answer);
  
  if(isCorrect) {
    let finalAwardScore = 10 - window.currentHintIndex;
    if(finalAwardScore < 1) finalAwardScore = 1;

    await set(ref(db, 'quest_answers/' + currentUser.serial + '/' + id), { answer: ans, score: finalAwardScore });
    let newScore = (uCheckSnap.val().score || 0) + finalAwardScore;
    await update(ref(db, 'users/' + currentUser.serial), { score: newScore });
    
    alert(`🎉 সঠিক উত্তর! প্রাপ্ত স্কোর: +${finalAwardScore}`);
    showQuest();
  } else {
    toast('❌ ভুল বা অমিল উত্তর! আবার চেষ্টা করো।');
  }
}

window.failBreakHintFinal = async function(id) {
  const uCheckSnap = await get(ref(db, 'users/' + currentUser.serial));
  if(uCheckSnap.exists() && uCheckSnap.val().isBlocked) return renderBlockedScreen();

  await set(ref(db, 'quest_answers/' + currentUser.serial + '/' + id), { answer: "Failed/GivenUp", score: -5 });
  let newScore = (uCheckSnap.val().score || 0) - 5;
  await update(ref(db, 'users/' + currentUser.serial), { score: newScore });
  
  alert('🧠 ১০টি হিন্ট শেষ! ৫ পয়েন্ট কেটে নেওয়া হলো।');
  showQuest();
}

window.submitQuestAnswer = async function(id, ans){
  if(!ans || !ans.trim()) return toast('উত্তর খালি রাখা যাবে না!');
  
  const uCheckSnap = await get(ref(db, 'users/' + currentUser.serial));
  if(uCheckSnap.exists() && uCheckSnap.val().isBlocked) return renderBlockedScreen();

  const qSnap = await get(ref(db, 'quests/' + id)); const q = qSnap.val();
  let targetCorrectAns = q.answer || '';
  
  let isCorrect = (q.type === 'mcq') ? (ans.toLowerCase().trim() === targetCorrectAns.toLowerCase().trim()) : checkAnswerSmart(ans, targetCorrectAns);
  
  let minusPoints = q.negative ? parseInt(q.negative) : 0;
  let score = isCorrect ? parseInt(q.points) : -minusPoints;
  
  await set(ref(db, 'quest_answers/' + currentUser.serial + '/' + id), { answer: ans, score: score });
  
  let newTotalScore = (uCheckSnap.val().score || 0) + score;
  if(newTotalScore < 0) newTotalScore = 0;
  await update(ref(db, 'users/' + currentUser.serial), { score: newTotalScore });

  showQuest();
}

function loadFriends(){
  onValue(ref(db, 'friends/' + currentUser.serial), async snap=>{
    let html = ''; 
    if(snap.exists()){ 
      const customNamesSnap = await get(ref(db, `custom_nicknames/${currentUser.serial}`));
      const customNames = customNamesSnap.exists() ? customNamesSnap.val() : {};

      for(let fid of Object.keys(snap.val())) {
        const uSnap = await get(ref(db, 'users/' + fid));
        if(!uSnap.exists()) continue; 
        const baseName = uSnap.val().name;
        const displayName = customNames[fid] || baseName;

        html += `<div class="card" style="display:flex; justify-content:space-between; align-items:center;">
          <div onclick="openChat('${fid}', '${baseName}')" style="cursor:pointer; flex:1;">
            👤 <b>${displayName}</b> <small style="color:var(--muted)">(${fid})</small>
          </div>
          <div style="display:flex; gap:4px;">
            <button class="btn btn-secondary" style="width:auto; margin:0; padding:4px 8px; font-size:11px;" onclick="assignCustomFriendName('${fid}', '${baseName}')">Rename</button>
            <button class="btn btn-warning" style="width:auto; margin:0; padding:4px 8px; font-size:11px;" onclick="openMultiplayerGamesMenu('${fid}','${baseName}')">🎮 Play</button>
          </div>
        </div>`;
      }
    } else html = '<div style="color:var(--muted); font-size:13px">কোনো বন্ধু তালিকাভুক্ত নেই।</div>';
    if($('friendList')) $('friendList').innerHTML = html;
  });
}

window.openMultiplayerGamesMenu = async function(fid, friendName) {
  const snap = await get(ref(db, 'custom_games'));
  let gamesHTML = '';
  if(snap.exists()){
    let index = 0;
    Object.entries(snap.val()).reverse().forEach(([id, game]) => {
      if(index === 1) { 
        gamesHTML += `
          <div class="card" style="margin-top:8px;">
            <strong>${game.name}</strong>
            <button class="btn btn-success" onclick="sendMultiplayerGameCoupon('${fid}', '${id}', '${game.name}')">Send Match Coupon</button>
          </div>
        `;
      }
      index++;
    });
  }
  if(!gamesHTML) gamesHTML = '<div class="card">সার্ভার ডাটাবেসে দ্বিতীয় কোনো মাল্টিপ্লেয়ার গেম যুক্ত নেই।</div>';
  
  $('app').innerHTML = `
    <div class="screen active">
      <header><button onclick="showContact()" style="background:none;border:none;color:var(--accent);cursor:pointer;">← Back</button><span>Invite ${friendName}</span></header>
      <div class="main-content">${gamesHTML}</div>
    </div>
  `;
}

window.sendMultiplayerGameCoupon = async function(toSerial, gameId, gameName) {
  const couponRef = push(ref(db, 'multiplayer_coupons/' + toSerial));
  await set(couponRef, {
    from: currentUser.serial,
    fromName: currentUser.name,
    gameId: gameId,
    gameName: gameName,
    status: 'pending',
    timestamp: Date.now()
  });
  toast('ম্যাচ কুপন সফলভাবে পাঠানো হয়েছে!');
  showContact();
}

function listenToMultiplayerCoupons() {
  onValue(ref(db, 'multiplayer_coupons/' + currentUser.serial), async snap => {
    let html = '';
    if(snap.exists()){
      for(let [couponId, c] of Object.entries(snap.val())) {
        if(c.status === 'pending') {
          html += `
            <div class="card" style="border-left: 4px solid var(--warning);">
              <p>🗣️ <b>${c.fromName}</b> আপনাকে <b>${c.gameName}</b> খেলার জন্য আমন্ত্রণ পাঠিয়েছেন!</p>
              <div style="display:flex; gap:6px; margin-top:8px;">
                <button class="btn btn-success" style="margin:0; padding:6px 12px; font-size:12px;" onclick="handleCouponAction('${couponId}', '${c.from}', '${c.gameId}', 'accept')">Accept</button>
                <button class="btn btn-danger" style="margin:0; padding:6px 12px; font-size:12px;" onclick="handleCouponAction('${couponId}', '${c.from}', '${c.gameId}', 'deny')">Deny</button>
              </div>
            </div>
          `;
        } else if(c.status === 'accepted_launch') {
          const gameSnap = await get(ref(db, 'custom_games/' + c.gameId));
          if(gameSnap.exists()) {
            await remove(ref(db, 'multiplayer_coupons/' + currentUser.serial + '/' + couponId));
            launchEngineDynamicSandbox(gameSnap.val().name, gameSnap.val().code);
          }
        }
      }
    }
    if(!html) html = '<div style="color:var(--muted); font-size:13px">কোনো সক্রিয় ম্যাচ আমন্ত্রণ নেই।</div>';
    if($('multiplayerInvitationsList')) $('multiplayerInvitationsList').innerHTML = html;
  });
}

window.handleCouponAction = async function(couponId, fromSerial, gameId, action) {
  if(action === 'deny') {
    await remove(ref(db, 'multiplayer_coupons/' + currentUser.serial + '/' + couponId));
    toast('আমন্ত্রণ প্রত্যাখ্যান করা হয়েছে।');
  } else {
    await update(ref(db, 'multiplayer_coupons/' + currentUser.serial + '/' + couponId), { status: 'accepted' });
    const senderLaunchRef = push(ref(db, 'multiplayer_coupons/' + fromSerial));
    await set(senderLaunchRef, { status: 'accepted_launch', gameId: gameId });
    
    const gameSnap = await get(ref(db, 'custom_games/' + gameId));
    if(gameSnap.exists()) {
      await remove(ref(db, 'multiplayer_coupons/' + currentUser.serial + '/' + couponId));
      launchEngineDynamicSandbox(gameSnap.val().name, gameSnap.val().code);
    }
  }
}

window.assignCustomFriendName = async function(fid, baseName) {
  const customName = prompt(`"${baseName}" এর জন্য একটি নিজস্ব ডাকনাম (Custom Name) দাও:`);
  if(customName === null) return;
  await set(ref(db, `custom_nicknames/${currentUser.serial}/${fid}`), customName.trim() || baseName);
  toast('ডাকনাম সফলভাবে সংরক্ষিত!');

function loadRequests(){

function loadGroupChats(){
  onValue(ref(db, 'groups'), snap => {
    let html = '';

      Object.entries(snap.val()).forEach(([groupId, gData]) => {
        if(gData.members && gData.members[currentUser.serial]) {

async function loadAllUsersForFriends() {
  const snap = await get(ref(db, 'users'));
  window.allUsersCache = snap.exists() ? snap.val() : {};
  filterFriendsList();
}

window.filterFriendsList = function() {
  const queryText = $('findSerial').value.trim().toLowerCase();
  let html = '';
  Object.entries(window.allUsersCache || {}).forEach(([serial, u]) => {
    if(serial === currentUser.serial || u.isBlocked) return;
    if(queryText && !u.name.toLowerCase().includes(queryText) && !serial.toLowerCase().includes(queryText)) return;
    html += `<div class="card" style="display:flex; justify-content:space-between; align-items:center;">
      <div><strong>${u.name}</strong><br><small>${serial}</small></div>
      <button class="btn" style="width:auto; padding:6px 12px; margin:0;" onclick="sendFriendReq('${serial}')">Send Request</button>
    </div>`;
  });
  $('allUsersList').innerHTML = html || '<div class="card">কোনো মেম্বার পাওয়া যায়নি।</div>';
}

window.sendFriendReq = async function(targetSerial){

window.acceptReq = async function(from){

  toast('রিকোয়েস্ট গ্রহণ করা হয়েছে!'); showContact();

window.showCreateGroupScreen = async function(){

    for(let fid of Object.keys(fSnap.val())) {

window.submitCreateGroup = async function(){
  const gName = $('newGroupName').value.trim(); if(!gName) return toast('গ্রুপের নাম দাও!');

window.enterMCQFightActiveSession = async function(battleId) {
  const snap = await get(ref(db, 'battles/' + battleId));
  if(!snap.exists()) return toast('ব্যাটেল সেশনটি খুঁজে পাওয়া যায়নি!');
  const b = snap.val();
  
  const checkAns = await get(ref(db, `battle_submissions/${battleId}/${currentUser.serial}`));
  if(checkAns.exists()){
    alert('⚠️ তুমি ইতিমধ্যে এই MCQ Fight চ্যালেন্জে অংশগ্রহণ করেছো!');
    launchMCQFightStreamWindow(); return;
  }

  window.activeBattleId = battleId;
  window.activeBattleQuestions = b.questions || [];
  window.activeBattleCurrentIndex = 0;
  window.activeBattleScoresEarned = 0;
  window.battleTimerInterval = null;
  window.battleSubmissionDetails = {};

  runMCQQuestionStepper();
}

function runMCQQuestionStepper() {
  if(window.battleTimerInterval) clearInterval(window.battleTimerInterval);

  if(window.activeBattleCurrentIndex >= window.activeBattleQuestions.length) {
    finalizeAndUploadMCQFightResults();
    return;
  }

  const q = window.activeBattleQuestions[window.activeBattleCurrentIndex];
  let inputsHTML = '';
  
  if(q.type === 'mcq') {
    q.options.forEach((opt, oIdx) => {
      inputsHTML += `
        <button class="btn btn-secondary" style="margin-top:6px; text-align:left;" onclick="submitMCQFightStepAnswer('${opt.trim()}')">${oIdx+1}. ${opt.trim()}</button>
      `;
    });
  } else {
    inputsHTML += `
      <input type="text" class="input" id="vsaqBattleField" placeholder="উত্তর টাইপ করো...">
      <button class="btn btn-success" onclick="submitMCQFightStepAnswer($('vsaqBattleField').value)">Submit Answer</button>
    `;
  }

  $('app').innerHTML = `
    <div class="screen active">
      <header><div class="header-top"><span style="font-weight:bold; color:var(--accent2);">🔴 MCQ Fight Challenge: ${window.activeBattleCurrentIndex+1}/${window.activeBattleQuestions.length}</span><span id="battleClock" style="font-weight:bold; background:var(--accent2); color:white; padding:2px 8px; border-radius:4px;">15s</span></div></header>
      <div class="main-content">
        <div class="card" style="border-left:5px solid var(--accent2);">
          <h3 style="margin-bottom:12px;">${q.question}</h3>
          ${inputsHTML}
        </div>
      </div>
    </div>
  `;

  let timeLeft = 15;
  window.battleTimerInterval = setInterval(() => {
    timeLeft--;
    const clock = $('battleClock');
    if(clock) clock.textContent = `${timeLeft}s`;
    
    if(timeLeft <= 0) {
      clearInterval(window.battleTimerInterval);
      submitMCQFightStepAnswer(""); 
    }
  }, 1000);
}

window.submitMCQFightStepAnswer = function(userAns) {
  if(window.battleTimerInterval) clearInterval(window.battleTimerInterval);

  const q = window.activeBattleQuestions[window.activeBattleCurrentIndex];
  let isCorrect = false;

  if(userAns !== "") {
    if(q.type === 'mcq') {
      isCorrect = (userAns.toLowerCase().trim() === q.answer.toLowerCase().trim());
    } else {
      isCorrect = checkAnswerSmart(userAns, q.answer);
    }
  }

  let pointsEarned = 0;
  if(userAns !== "") {
    pointsEarned = isCorrect ? parseInt(q.points) : -parseInt(q.negative);
  }

  window.activeBattleScoresEarned += pointsEarned;
  window.battleSubmissionDetails[`q_${window.activeBattleCurrentIndex}`] = { userAns, isCorrect, pointsEarned };

  window.activeBattleCurrentIndex++;
  runMCQQuestionStepper();
}

async function finalizeAndUploadMCQFightResults() {
  const battleId = window.activeBattleId;
  const uCheckSnap = await get(ref(db, 'users/' + currentUser.serial));
  let currentTotalScore = uCheckSnap.val().score || 0;
  
  let finalScore = currentTotalScore + window.activeBattleScoresEarned;
  if(finalScore < 0) finalScore = 0;

  await set(ref(db, `battle_submissions/${battleId}/${currentUser.serial}`), {
    studentName: currentUser.name,
    scoreAwarded: window.activeBattleScoresEarned,
    details: window.battleSubmissionDetails,
    timestamp: Date.now()
  });
  
  await update(ref(db, 'users/' + currentUser.serial), { score: finalScore });
  
  alert(`🏁 MCQ Fight Arena সমাপ্ত!\n\nপ্রাপ্ত নেট স্কোর পরিবর্তন: ${window.activeBattleScoresEarned > 0 ? '+' : ''}${window.activeBattleScoresEarned}`);
  launchMCQFightStreamWindow();
}

function loadDynamicContent(node, gridId, label){
  onValue(ref(db, node), snap=>{
    const grid = $(gridId); if(!grid) return;
    if(snap.exists()){
      let items = Object.entries(snap.val());
      items.reverse(); 
      grid.innerHTML = ''; 
      items.forEach(([id, item]) => {
        const btn = document.createElement('div'); btn.className = 'nav-btn'; btn.style.position = 'relative';
        btn.innerHTML = `<div class="icon">${item.icon || '⚙️'}</div><div class="label">${item.name}</div>`;
        
        if(currentUser?.isCO) {
          let delBtn = document.createElement('button');
          delBtn.className = 'delete-inline-btn'; delBtn.style.top = '2px'; delBtn.style.right = '2px';
          delBtn.textContent = 'X';
          delBtn.onclick = (e) => { e.stopPropagation(); window.deleteItemLive(`${node}/${id}`, label); };
          btn.appendChild(delBtn);
        }
        
        btn.onclick = () => { launchEngineDynamicSandbox(item.name, item.code); };
        grid.appendChild(btn);
      });
    } else { grid.innerHTML = '<div class="card" style="grid-column:span 3;">কোনো কনটেন্ট নেই।</div>'; }
  });
}

function launchEngineDynamicSandbox(title, codeString) {
  $('app').innerHTML = `
    <div class="screen active" style="background:#fff; min-height:100vh;">
      <header style="background:#fff;">
        <div class="header-top">
          <button onclick="renderHome()" style="background:none;border:none;color:var(--accent);font-size:16px;cursor:pointer;">← Exit Engine</button>
          <strong style="color:var(--accent); font-size:14px;">${title}</strong>
          <span></span>
        </div>
      </header>
      <div id="sandboxRenderArea" style="padding:10px;" class="allow-copy"></div>
    </div>
  `;
  
  if (codeString.trim().startsWith('<') || codeString.toLowerCase().includes('</div>') || codeString.toLowerCase().includes('<style>')) {
    $('sandboxRenderArea').innerHTML = codeString;
    const scripts = $('sandboxRenderArea').querySelectorAll("script");
    scripts.forEach(oldScript => {
      const newScript = document.createElement("script");
      Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
      newScript.appendChild(document.createTextNode(oldScript.innerHTML));
      oldScript.parentNode.replaceChild(newScript, oldScript);
    });
  } else {
    try {
      let wrapperFunc = new Function(codeString);
      wrapperFunc();
    } catch(err) {
      $('sandboxRenderArea').innerHTML = `<div class="card" style="color:var(--accent2)">Runtime Error: ${err.message}</div>`;
    }
  }
}

window.publishMegaBattleExamEngine = async function() {
  const title = $('btMegaTitle').value.trim();
  const duration = parseInt($('btMegaDuration').value.trim());
  const rawData = $('btMegaRawString').value.trim();

  if(!title || !duration || !rawData) return toast('সব ঘর সঠিকভাবে পূরণ করো!');

  const lines = rawData.split('\n');
  let parsedQuestions = [];

  try {
    lines.forEach(line => {
      if(!line.trim()) return;
      const parts = line.split('|');
      const type = parts[0].trim().toLowerCase();
      const question = parts[1].trim();
      const answer = parts[2].trim();
      const options = parts[3] ? parts[3].split(',') : [];
      const points = parseInt(parts[4]) || 10;
      const negative = parseInt(parts[5]) || 0;

      parsedQuestions.push({ type, question, answer, options, points, negative });
    });

    if(parsedQuestions.length === 0) throw new Error('কোনো প্রশ্ন পাওয়া যায়নি!');

    const endTimestamp = Date.now() + (duration * 60000);

    const battleRef = push(ref(db, 'battles'));
    await set(battleRef, {
      title,
      durationMinutes: duration,
      endTimestamp,
      questions: parsedQuestions,
      createdAt: Date.now()
    });

    await set(ref(db, 'indicators/live_battles'), { timestamp: Date.now() });
    handlePushNotification("New Live MCQ Fight Challenge!", title);

    alert(`🎉 সফলভাবে MCQ Fight চ্যালেন্জ লাইভ করা হয়েছে!`);
    showCOPanel();
  } catch(e) {
    alert('❌ প্রশ্নপত্র ফরম্যাটে ভুল রয়েছে! গাইডলাইনটি পুনরায় চেক করো।');
  }
}

    <div class="screen active">
      <header><button onclick="coContactMembers()" style="background:none;border:none;color:var(--accent);cursor:pointer;">← Back</button><span>Chat: ${name}</span></header>
      <div class="main-content" id="chatBox" style="height:calc(100vh - 160px);overflow-y:auto;"></div>
      <div style="position:fixed;bottom:0;left:0;right:0;max-width:600px;margin:0 auto;padding:10px;background:var(--card);display:flex;gap:8px;border-top:1px solid var(--border)">
        <input class="input" id="coReplyInput" placeholder="উত্তর টাইপ করুন..." style="margin:0">
        <button class="btn btn-success" onclick="sendCOReply('${userSerial}', '${name}')" style="width:auto;margin:0">Reply</button>
      </div>
    </div>
  `;
  onValue(ref(db, 'co_messages/' + userSerial), snap=>{
    let html = ''; if(snap.exists()){ Object.values(snap.val()).forEach(m=>{ let isMe = m.sender !== userSerial; html += `<div style="text-align:${isMe?'right':'left'};margin:5px"><b>${isMe?'তুমি':'মেম্বার'}:</b> ${m.text}</div>`; }); }
    if($('chatBox')){ $('chatBox').innerHTML = html; $('chatBox').scrollTop = $('chatBox').scrollHeight; }
  });
}

window.sendCOReply = async function(userSerial, name) {
  const txt = $('coReplyInput').value.trim(); if(!txt) return;
  await push(ref(db, 'co_messages/' + userSerial), { sender: currentUser.serial, text: txt, time: Date.now(), userName: 'CO' });
  $('coReplyInput').value = '';
}

window.triggerSmartQuestReset = async function() {
  if(confirm("⚠️ আপনি কি নিশ্চিতভাবে সমস্ত কোয়েস্ট প্রশ্ন এবং মেম্বারদের স্কোর রিসেট করতে চান? এটি রিভার্ট করা যাবে না।")) {
    await remove(ref(db, 'quests'));
    await remove(ref(db, 'quest_answers'));
    
    const snap = await get(ref(db, 'users'));
    if(snap.exists()) {
      let updates = {};
      Object.keys(snap.val()).forEach(serial => {
        updates[`users/${serial}/score`] = 0;
      });
      await update(ref(db), updates);
    }
    alert("🔄 কোয়েস্ট তালিকা এবং সমস্ত মেম্বার স্কোর সফলভাবে ০ (শূন্য) করে রিসেট করা হয়েছে!");
    showCOPanel();
  }
}

currentUser = JSON.parse(localStorage.getItem(STORAGE_KEY));
syncUserAndRender();
</script>
</body>
</html>
