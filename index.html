<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
<link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png">
<title>YourChoice</title>
<style>
:root{
  --bg:#0a0a0a;
  --card:#1a1a1a;
  --text:#e0e0e0;
  --accent:#4fc3f7;
  --accent2:#ff6b6b;
  --muted:#666;
  --border:#2a2a2a;
}
[data-theme="light"]{
  --bg:#f5f5f5;
  --card:#ffffff;
  --text:#1a1a1a;
  --accent:#0288d1;
  --accent2:#d32f2f;
  --muted:#888;
  --border:#ddd;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none}
body{
  font-family:'Segoe UI',Roboto,sans-serif;
  background:var(--bg);
  color:var(--text);
  transition:background 0.3s,color 0.3s;
  overflow-x:hidden;
}
.container{max-width:600px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{
  background:var(--card);
  padding:12px 16px;
  border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:100;
}
.header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.profile-info{display:flex;align-items:center;gap:10px;font-size:14px}
.profile-info .serial{color:var(--accent);font-weight:600}
.profile-info .rank{color:var(--accent2);font-weight:600}
.network-dot{
  width:10px;height:10px;border-radius:50%;
  background:#4caf50;display:inline-block;
}
.network-dot.offline{background:#f44336}
.notice-ticker{
  background:var(--accent2);
  color:#fff;
  padding:6px 12px;
  font-size:13px;
  white-space:nowrap;
  overflow:hidden;
  border-radius:6px;
}
.notice-ticker span{display:inline-block;padding-left:100%;animation:scroll 15s linear infinite}
@keyframes scroll{to{transform:translateX(-100%)}}
.main-content{flex:1;padding:16px;padding-bottom:80px}
.nav-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px
}
.nav-btn{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:20px 10px;
  text-align:center;
  cursor:pointer;
  transition:transform 0.2s,border-color 0.2s;
}
.nav-btn:active{transform:scale(0.95)}
.nav-btn:hover{border-color:var(--accent)}
.nav-btn .icon{font-size:28px;margin-bottom:6px}
.nav-btn .label{font-size:12px;color:var(--text)}
.screen{display:none}
.screen.active{display:block}
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:16px;
  margin-bottom:12px;
}
.btn{
  background:var(--accent);
  color:#fff;
  border:none;
  padding:12px 20px;
  border-radius:8px;
  font-size:14px;
  cursor:pointer;
  width:100%;
  margin-top:8px;
}
.btn-secondary{background:var(--muted)}
.input{
  width:100%;padding:12px;
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:8px;
  color:var(--text);
  font-size:14px;
  margin-top:8px;
}
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--card);
  border-top:1px solid var(--border);
  display:flex;justify-content:space-around;
  padding:8px 0;
}
.bottom-nav-btn{
  background:none;border:none;color:var(--muted);
  font-size:11px;cursor:pointer;padding:4px 8px;
}
.bottom-nav-btn.active{color:var(--accent)}
.bluelight-filter{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(255,140,0,0.15);
  pointer-events:none;z-index:999;display:none;
}
</style>
</head>
<body>
<div class="bluelight-filter" id="bluelight"></div>
<div class="container" id="app"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getDatabase, ref, set, get, push, onValue, update, remove, query, orderByChild, runTransaction } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js";

// ==== FIREBASE CONFIG ====
const firebaseConfig = {
  apiKey: "AIzaSyDbFaMS-WtEYho-rUG1b1YNnfcE44u3VXI",
  authDomain: "your-choice-4b2aa.firebaseapp.com",
  databaseURL: "https://your-choice-4b2aa-default-rtdb.firebaseio.com",
  projectId: "your-choice-4b2aa",
  storageBucket: "your-choice-4b2aa.firebasestorage.app",
  messagingSenderId: "287190219191",
  appId: "1:287190219191:web:71797e26ea4065f2521032",
  measurementId: "G-VDJQ2L7KH5"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// Global Setup
window.db = db; window.ref = ref; window.set = set; window.get = get; window.push = push; 
window.onValue = onValue; window.update = update; window.remove = remove; window.query = query; 
window.orderByChild = orderByChild; window.runTransaction = runTransaction;

let currentUser = null;
const STORAGE_KEY = "yourchoice_user";
const TAB_KEY = "yourchoice_tab_lock";

function $(id){return document.getElementById(id)}
window.$ = $;

function toast(msg){
  let t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:10px 20px;border-radius:8px;z-index:1000;font-size:14px';
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2000);
}
window.toast = toast;

// Tab Lock & Utilities
function checkTabLock(){
  const tabId = sessionStorage.getItem(TAB_KEY) || Math.random().toString(36);
  sessionStorage.setItem(TAB_KEY, tabId);
  localStorage.setItem(TAB_KEY, tabId);
  window.addEventListener('storage', (e)=>{
    if(e.key === TAB_KEY && e.newValue !== tabId){
      alert('তুমি অন্য ট্যাবে লগইন করেছো। এই ট্যাব বন্ধ হয়ে যাবে।');
      window.close();
    }
  });
}

function checkBlueLight(){
  const hour = new Date().getHours();
  const filter = $('bluelight');
  if(filter) filter.style.display = (hour >= 18 || hour < 6) ? 'block' : 'none';
}

function isValidURL(url){
  try{
    const u = new URL(url);
    return u.protocol === 'http:' || u.protocol === 'https:';
  }catch{return false}
}

// ==== AUTH SYSTEM ====
function renderAuth(){
  $('app').innerHTML = `
    <div class="screen active" id="auth">
      <div class="card" style="margin-top:60px">
        <h2 style="text-align:center;margin-bottom:20px">YourChoice</h2>
        <input type="text" class="input" id="name" placeholder="তোমার নাম">
        <input type="text" class="input" id="serial" placeholder="Serial No">
        <input type="text" class="input" id="school" placeholder="School">
        <select class="input" id="role">
          <option value="student">Student</option>
          <option value="teacher">Teacher</option>
        </select>
        <button class="btn" onclick="login()">Login / Register</button>
      </div>
    </div>
  `;
}

window.login = async function(){
  const name = $('name').value.trim();
  const serial = $('serial').value.trim();
  const school = $('school').value.trim();
  const role = $('role').value;
  
  if(!name || !serial || !school){
    toast('সব ফিল্ড পূরণ করো');
    return;
  }
  
  const userRef = ref(db, 'users/' + serial);
  const snap = await get(userRef);
  
  if(snap.exists()){
    currentUser = snap.val();
  }else{
    currentUser = {
      name, serial, school, role,
      isCO: false,
      score: 0,
      rank: 0,
      createdAt: Date.now(),
      lastActive: Date.now()
    };
    await set(userRef, currentUser);
  }
  
  localStorage.setItem(STORAGE_KEY, JSON.stringify(currentUser));
  renderHome();
  checkTabLock();
  checkBlueLight();
}

// ==== HOME SCREEN ====
function renderHome(){
  const u = currentUser;
  if(!u) return renderAuth();

  $('app').innerHTML = `
    <header>
      <div class="header-top">
        <div class="profile-info">
          <span>${u.name}</span>
          <span class="serial">S:${u.serial}</span>
          <span class="rank">Rank:${u.rank || 0}</span>
        </div>
        <span class="network-dot" id="netDot"></span>
      </div>
      <div class="notice-ticker"><span id="noticeText">Welcome to YourChoice!</span></div>
    </header>
    
    <div class="main-content">
      <div class="nav-grid">
        <div class="nav-btn" onclick="showQuest()"><div class="icon">📚</div><div class="label">Quest</div></div>
        <div class="nav-btn" onclick="showContact()"><div class="icon">👥</div><div class="label">Contact</div></div>
        <div class="nav-btn" onclick="showBattle()"><div class="icon">⚔️</div><div class="label">Battle</div></div>
        <div class="nav-btn" onclick="showGames()"><div class="icon">🎮</div><div class="label">Games</div></div>
        <div class="nav-btn" onclick="showTools()"><div class="icon">🛠️</div><div class="label">Tools</div></div>
        <div class="nav-btn" onclick="showEvent()"><div class="icon">📅</div><div class="label">Event</div></div>
        <div class="nav-btn" onclick="showApp()"><div class="icon">📄</div><div class="label">Application</div></div>
        <div class="nav-btn" onclick="showKnowledge()"><div class="icon">🧠</div><div class="label">Knowledge</div></div>
        <div class="nav-btn" onclick="showLiterature()"><div class="icon">📖</div><div class="label">Literature</div></div>
      </div>
    </div>
    
    <div class="bottom-nav">
      <button class="bottom-nav-btn active" onclick="renderHome()">Home</button>
      <button class="bottom-nav-btn" onclick="showCOPanel()">CO Panel</button>
      <button class="bottom-nav-btn" onclick="logout()">Logout</button>
    </div>
  `;
  
  updateNetworkStatus();
  loadNotice();
  checkCOSetup();
  loadCustomContent();
}
window.renderHome = renderHome;

// Network Status
function updateNetworkStatus(){
  const dot = $('netDot');
  if(!dot) return;
  window.addEventListener('online', ()=>dot.classList.remove('offline'));
  window.addEventListener('offline', ()=>dot.classList.add('offline'));
  if(!navigator.onLine) dot.classList.add('offline');
}

function loadNotice(){
  onValue(ref(db, 'notice'), snap=>{
    const data = snap.val();
    const element = $('noticeText');
    if(data && element) element.textContent = data.text || 'Welcome!';
  });
}

// ==== QUEST SYSTEM ====
window.showQuest = function(){
  $('app').innerHTML = `
    <div class="screen active" id="quest">
      <header>
        <div class="header-top">
          <button onclick="renderHome()" style="background:none;border:none;color:var(--accent);font-size:16px">← Back</button>
          <span>Quest</span>
          <span></span>
        </div>
      </header>
      <div class="main-content" id="questList"></div>
    </div>
  `;
  loadQuests();
}

function loadQuests(){
  onValue(query(ref(db, 'quests'), orderByChild('createdAt')), snap=>{
    const data = snap.val();
    let html = '<div class="card"><h3>Available Quests</h3></div>';
    if(data){
      Object.entries(data).reverse().forEach(([id,q])=>{
        html += `
          <div class="card" onclick="startQuest('${id}')">
            <div style="font-size:12px;color:var(--muted)">${q.type.toUpperCase()}</div>
            <div style="margin:8px 0;font-weight:600">${q.type === 'picture' ? 'Picture Quest' : q.question}</div>
            <div style="font-size:12px;color:var(--accent)">+${q.points} points</div>
          </div>
        `;
      });
    }else{
      html += '<div class="card">No quests yet. CO will add soon!</div>';
    }
    const qList = $('questList');
    if(qList) qList.innerHTML = html;
  });
}

window.startQuest = async function(id){
  const snap = await get(ref(db, 'quests/' + id));
  if(!snap.exists()) return;
  const q = snap.val();
  
  const ansSnap = await get(ref(db, 'quest_answers/' + currentUser.serial + '/' + id));
  const alreadyAnswered = ansSnap.exists();
  const prevAns = alreadyAnswered ? ansSnap.val().answer : null;
  
  let contentHTML = '';
  if(q.type === 'picture'){
    contentHTML = isValidURL(q.question) 
      ? `<img src="${q.question}" onerror="this.style.display='none'" style="width:100%;max-height:300px;object-fit:contain;border-radius:8px;margin:10px 0">`
      : '<div style="color:var(--accent2)">Invalid image URL</div>';
  }else if(['audio','video','learning'].includes(q.type)){
    contentHTML = isValidURL(q.question)
      ? `<a href="${q.question}" target="_blank" rel="noopener" style="color:var(--accent);word-break:break-all">Open Link</a>`
      : '<div style="color:var(--accent2)">Invalid URL</div>';
  }else{
    contentHTML = `<h3 style="margin:10px 0">${q.question}</h3>`;
  }
  
  let answerHTML = '';
  if(alreadyAnswered){
    answerHTML = `
      <div class="card" style="background:#1a1a1a;margin-top:10px">
        <div style="color:var(--muted)">Your Answer:</div>
        <div>${prevAns}</div>
        <div style="color:var(--accent);margin-top:8px">Score: ${ansSnap.val().score}</div>
        <div style="color:var(--muted);font-size:12px">Review mode. Cannot change answer.</div>
      </div>
    `;
  }else{
    if(q.type === 'mcq'){
      q.options.forEach((opt)=>{
        answerHTML += `<button class="btn btn-secondary" style="margin-top:5px" onclick="submitQuestAnswer('${id}','${opt}')">${opt}</button>`;
      });
    }else if(q.type === 'break_hint'){
      answerHTML = `
        <div id="hintBox" style="margin:10px 0;color:var(--accent);font-size:12px"></div>
        <input class="input" id="qAns" placeholder="Final Answer">
        <button class="btn" onclick="unlockBreakHint('${id}')">Get Hint (<span id="hintPoints">10</span> pts)</button>
        <button class="btn" onclick="submitQuestAnswer('${id}',$('qAns').value)">Submit</button>
      `;
      window.hintStep = 0;
      window.hintList = q.hints ? q.hints.split('|') : [];
    }else{
      answerHTML = `<input class="input" id="qAns" placeholder="Type your answer">
                    <button class="btn" onclick="submitQuestAnswer('${id}',$('qAns').value)">Submit</button>`;
    }
  }
  
  $('app').innerHTML = `
    <div class="screen active" id="questPlay">
      <header><button onclick="showQuest()" style="background:none;border:none;color:var(--accent)">← Back</button></header>
      <div class="main-content">
        <div class="card">
          <div style="color:var(--muted);font-size:12px">${q.type.toUpperCase()}</div>
          ${contentHTML}
          ${answerHTML}
        </div>
      </div>
    </div>
  `;
}

window.unlockBreakHint = function(id){
  if(window.hintStep >= 10) return toast('Max 10 hints reached!');
  const points = 10 - window.hintStep;
  const hBox = $('hintBox');
  if(hBox) hBox.innerHTML += `<div>Hint ${window.hintStep+1}: ${window.hintList[window.hintStep] || 'No hint'}</div>`;
  const hPoints = $('hintPoints');
  if(hPoints) hPoints.textContent = Math.max(1, points - 1);
  window.hintStep++;
  toast('-2 points for hint logic');
}

window.submitQuestAnswer = async function(id, ans){
  const qSnap = await get(ref(db, 'quests/' + id));
  const q = qSnap.val();
  
  const checkSnap = await get(ref(db, 'quest_answers/' + currentUser.serial + '/' + id));
  if(checkSnap.exists()) return toast('Already answered!');
  
  let earnedScore = 0;
  let isCorrect = ans.toLowerCase().trim() === (q.coAnswer || q.answer).toLowerCase().trim();
  
  if(q.type === 'break_hint'){
    const hintUsed = window.hintStep || 0;
    if(isCorrect){ earnedScore = Math.max(1, 10 - hintUsed); }
    else { earnedScore = hintUsed >= 10 ? -3 : 0; }
  } else {
    earnedScore = isCorrect ? q.points : -Math.abs(q.points);
  }
  
  await set(ref(db, 'quest_answers/' + currentUser.serial + '/' + id), {
    answer: ans, correct: isCorrect, score: earnedScore, time: Date.now()
  });
  
  const newScore = (currentUser.score || 0) + earnedScore;
  await update(ref(db, 'users/' + currentUser.serial), {score: newScore});
  currentUser.score = newScore;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(currentUser));
  
  toast(isCorrect ? `Correct! +${earnedScore}` : `Wrong! ${earnedScore}`);
  showQuest();
}

// ==== CONTACT & CHAT SYSTEM ====
window.showContact = function(){
  $('app').innerHTML = `
    <div class="screen active" id="contact">
      <header>
        <div class="header-top">
          <button onclick="renderHome()" style="background:none;border:none;color:var(--accent)">← Back</button>
          <span>Contact</span>
          <button onclick="showFindUser()" style="background:none;border:none;color:var(--accent)">+ Add</button>
        </div>
      </header>
      <div class="main-content">
        <div class="card"><h3>Friends</h3><div id="friendList">Loading...</div></div>
        <div class="card"><h3>Friend Requests</h3><div id="reqList">Loading...</div></div>
      </div>
    </div>
  `;
  loadFriends();
  loadRequests();
}

function loadFriends(){
  onValue(ref(db, 'friends/' + currentUser.serial), snap=>{
    const data = snap.val();
    let html = '';
    if(data){
      Object.keys(data).forEach(fid=>{
        html += `<div class="card" style="padding:10px;margin:8px 0" onclick="openChat('${fid}')">
          <span>👤 ${fid}</span>
          <button class="btn-secondary" style="float:right;padding:4px 10px;font-size:12px" 
            onclick="event.stopPropagation();sendBattleReq('${fid}')">Battle</button>
        </div>`;
      });
    }else html = '<div style="color:var(--muted)">No friends yet</div>';
    const flist = $('friendList');
    if(flist) flist.innerHTML = html;
  });
}

function loadRequests(){
  onValue(ref(db, 'requests/' + currentUser.serial), snap=>{
    const data = snap.val();
    let html = '';
    if(data){
      Object.entries(data).forEach(([from,status])=>{
        if(status === 'pending'){
          html += `<div class="card" style="padding:10px;margin:8px 0">
            <span>${from}</span>
            <button class="btn" style="float:right;width:auto;padding:4px 12px" onclick="acceptReq('${from}')">Accept</button>
          </div>`;
        }
      });
    }else html = '<div style="color:var(--muted)">No requests</div>';
    const rlist = $('reqList');
    if(rlist) rlist.innerHTML = html;
  });
}

window.showFindUser = function(){
  $('app').innerHTML = `
    <div class="screen active" id="findUser">
      <header><button onclick="showContact()" style="background:none;border:none;color:var(--accent)">← Back</button><span>Find User</span></header>
      <div class="main-content">
        <input class="input" id="findSerial" placeholder="Enter Serial No">
        <button class="btn" onclick="sendFriendReq()">Send Request</button>
      </div>
    </div>
  `;
}

window.sendFriendReq = async function(){
  const serial = $('findSerial').value.trim();
  if(!serial || serial === currentUser.serial) return toast('Invalid serial');
  const snap = await get(ref(db, 'users/' + serial));
  if(!snap.exists()) return toast('User not found');
  await set(ref(db, 'requests/' + serial + '/' + currentUser.serial), 'pending');
  toast('Request sent!');
  showContact();
}

window.acceptReq = async function(from){
  await set(ref(db, 'friends/' + currentUser.serial + '/' + from), true);
  await set(ref(db, 'friends/' + from + '/' + currentUser.serial), true);
  await remove(ref(db, 'requests/' + currentUser.serial + '/' + from));
  toast('Friend added!');
}

window.openChat = function(fid){
  const chatId = [currentUser.serial, fid].sort().join('_');
  $('app').innerHTML = `
    <div class="screen active" id="chat">
      <header><button onclick="showContact()" style="background:none;border:none;color:var(--accent)">← Back</button><span>${fid}</span></header>
      <div class="main-content" id="chatBox" style="height:calc(100vh - 160px);overflow-y:auto;padding-bottom:20px"></div>
      <div style="position:fixed;bottom:0;left:0;right:0;padding:10px;background:var(--card);display:flex;gap:8px">
        <input class="input" id="chatInput" placeholder="Type message" style="margin:0">
        <button class="btn" onclick="sendMsg('${chatId}','${fid}')" style="width:auto;margin:0">Send</button>
      </div>
    </div>
  `;
  onValue(ref(db, 'chats/' + chatId), snap=>{
    const data = snap.val();
    let html = '';
    if(data){
      Object.entries(data).forEach(([msgId,m])=>{
        html += `<div style="margin:8px 0;text-align:${m.from===currentUser.serial?'right':'left'}"
          oncontextmenu="event.preventDefault();if('${m.from}'==='${currentUser.serial}')deleteMsg('${chatId}','${msgId}')">
          <span style="background:${m.from===currentUser.serial?'var(--accent)':'var(--border)'};padding:8px 12px;border-radius:12px;display:inline-block;max-width:70%">${m.text}</span>
        </div>`;
      });
    }
    const cBox = $('chatBox');
    if(cBox) {
      cBox.innerHTML = html;
      cBox.scrollTop = cBox.scrollHeight;
    }
  });
}

window.sendMsg = async function(chatId,fid){
  const txt = $('chatInput').value.trim();
  if(!txt) return;
  const lower = txt.toLowerCase();
  if(lower.includes('<img') || lower.includes('<video') || lower.includes('<audio') || 
     lower.includes('data:image') || lower.includes('.mp4') || lower.includes('.mp3') ||
     lower.includes('.jpg') || lower.includes('.png') || lower.includes('.jpeg')){
    return toast('Only text messages allowed!');
  }
  await push(ref(db, 'chats/' + chatId), {
    from: currentUser.serial, to: fid, text: txt, time: Date.now()
  });
  $('chatInput').value = '';
}

window.deleteMsg = async function(chatId, msgId){
  if(confirm('Delete this message?')){ await remove(ref(db,'chats/'+chatId+'/'+msgId)); }
}

// ==== BATTLE SYSTEM ====
window.showBattle = function(){
  $('app').innerHTML = `
    <div class="screen active" id="battle">
      <header><button onclick="renderHome()" style="background:none;border:none;color:var(--accent)">← Back</button><span>Online Battle</span></header>
      <div class="main-content">
        <div class="card"><h3>Pending Requests</h3><div id="battleReqs">Loading...</div></div>
        <div class="card" id="gameBoard" style="display:none">

window.sendBattleReq = async function(fid){
  await set(ref(db, 'battles/' + fid + '/' + currentUser.serial), {
    from: currentUser.serial, status: 'pending', time: Date.now()
  });
  toast('Battle request sent!');
}

function loadBattleReqs(){
  onValue(ref(db, 'battles/' + currentUser.serial), snap=>{
    const data = snap.val();
    let html = '';
    if(data){
      Object.entries(data).forEach(([from,req])=>{
        if(req.status === 'pending'){
          html += `<div class="card" style="padding:10px">
            <span>From: ${from}</span>
            <button class="btn" style="width:auto;float:right;padding:4px 12px" onclick="acceptBattle('${from}')">Accept</button>
          </div>`;
        }else if(req.status === 'accepted'){
          html += `<button class="btn" onclick="startGame('${from}')">Join Game with ${from}</button>`;
        }
      });
    }else html = '<div style="color:var(--muted)">No requests</div>';
    const bReqs = $('battleReqs');
    if(bReqs) bReqs.innerHTML = html;
  });
}

window.acceptBattle = async function(from){
  await update(ref(db, 'battles/' + currentUser.serial + '/' + from), {status:'accepted'});
  await update(ref(db, 'battles/' + from + '/' + currentUser.serial), {status:'accepted'});
  await remove(ref(db, 'battles/' + currentUser.serial + '/' + from));
  toast('Battle accepted!');
  startGame(from);
}

window.startGame = function(opponent){
  const gameId = [currentUser.serial, opponent].sort().join('_');
  const gBoard = $('gameBoard');
  if(gBoard) gBoard.style.display = 'block';

  const grid = Array(9).fill('');
  onValue(ref(db, 'games/' + gameId), snap=>{
    const data = snap.val();
    if(data){
      grid.splice(0,9,...data.board);
      renderGrid(grid, gameId, data.turn, opponent);
    }
  });

  get(ref(db, 'games/' + gameId)).then(snap => {
    if(!snap.exists()){
      set(ref(db, 'games/' + gameId), {
        board: grid, turn: currentUser.serial, players: [currentUser.serial, opponent]
      });
    }
  });
}

function renderGrid(board, gameId, turn, opponent){
  let html = '';
  board.forEach((cell,i)=>{
    html += `<button style="aspect-ratio:1;font-size:32px;background:var(--border);border:none;border-radius:8px;color:var(--text)"
      onclick="makeMove('${gameId}',${i})" ${cell || turn !== currentUser.serial ? 'disabled' : ''}>${cell}</button>`;
  });
  const tGrid = $('ticGrid');
  if(tGrid) tGrid.innerHTML = html;
  const gTurn = $('gameTurn');
  if(gTurn) gTurn.textContent = turn === currentUser.serial ? 'Your Turn' : 'Opponent Turn';

  const winner = checkWinner(board);
  if(winner){
    toast(winner === 'X' ? 'Game Ended!' : 'Over!');
    remove(ref(db, 'games/' + gameId));
  }
}

window.makeMove = async function(gameId, i){
  const gameRef = ref(db, 'games/' + gameId);
  await runTransaction(gameRef, (game)=>{
    if(!game) return game;
    if(game.board[i] || game.turn !== currentUser.serial) return game;
    game.board[i] = currentUser.serial === game.players[0] ? 'X' : 'O';
    game.turn = game.players.find(p => p !== currentUser.serial);
    return game;
  });
}

function checkWinner(b){
  const w=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  for(let [a,c,e] of w){ if(b[a] && b[a]===b[c] && b[a]===b[e]) return b[a]; }
  return null;
}

window.playTicVsComp = function(){
  let board = Array(9).fill('');
  let turn = 'X';
  function render(){
    let html = '<h3>VS Computer</h3><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:20px 0">';
    board.forEach((c,i)=>{
      html += `<button style="aspect-ratio:1;font-size:32px;background:var(--border);border:none;border-radius:8px;color:var(--text)" onclick="compMove(${i})" ${c?'disabled':''}>${c}</button>`;
    });
    html += '</div>';
    $('gameArea').innerHTML = html;
  }
  window.compMove = function(i){
    if(board[i] || turn!=='X') return;
    board[i]='X'; render();
    setTimeout(()=>{
      let empty = board.map((v,j)=>v?'':j).filter(x=>x!=='');
      if(empty.length){
        board[empty[Math.floor(Math.random()*empty.length)]]='O';
        turn='X'; render();
      }
    },500);
  };
  render();
}

window.playDice = function(){
  let d1 = Math.floor(Math.random()*6)+1;
  $('gameArea').innerHTML = `<h3>Dice Roll</h3><div style="font-size:60px;text-align:center;margin:20px 0">🎲 ${d1}</div><button class="btn" onclick="playDice()">Roll</button>`;

function displayContentScreen(type, title){

function loadContentData(type){
  onValue(ref(db, type), snap=>{
    const data = snap.val();
    let html = '';
    if(data){
      Object.entries(data).reverse().forEach(([id,c])=>{
        if(!c.deleteTime || Date.now() < c.deleteTime){
          html += `<div class="card"><h3>${c.title}</h3><p>${c.desc}</p></div>`;
        }
      });
    }else html = '<div class="card">No content yet</div>';
    const cList = $('contentList');
    if(cList) cList.innerHTML = html;
  });
}
